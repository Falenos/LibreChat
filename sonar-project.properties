sonar.host.url=https://sonarcloud.io
sonar.organization=knauf-group

sonar.projectKey=Knauf-Group_agentic-karl
sonar.projectName=Knauf-Group_agentic-karl
sonar.projectDescription=partners-program / agentic-karl / agentic-karl

sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=./client/coverage/lcov.info

sonar.links.scm=https://github.com/Knauf-Group/agentic-karl

sonar.sources=client/src,packages/api/src,packages/client/src,packages/data-provider/src,packages/data-schemas/src

# Knauf fork policy: gate the quality gate ONLY on Knauf-authored code (the additive
# `**/knauf/**` workspaces). The sources above are overwhelmingly upstream LibreChat code;
# on an upstream-sync PR the entire merge delta counts as "new code", so without this
# restriction SonarCloud rates the fork on upstream's code quality and every sync would
# require editing upstream files to satisfy it — permanent merge debt. Inline `[knauf]`
# seams inside upstream files are covered by code review, the seam tests, and the
# seam-validator instead. Widen or remove this line to analyze the full tree.
sonar.inclusions=**/knauf/**

sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.next/**,**/coverage/**,**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/migrations/**,**/*.d.ts,**/*.docx,**/*.xlsx,**/*.xls,**/*.ods
sonar.javascript.node.maxspace=6144
