name: Release Pipeline

run-name: Release PR #${{ github.event.pull_request.number }} to shared dev and AGK dev

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.repository }}-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and release to CT shared dev
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      new-version: ${{ steps.version.outputs.new-version }}
    env:
      CT_ACR_NAME: acrctshared001
      CT_NAMESPACE: tools-non-prod
      CT_CONFIG_REPOSITORY: Knauf-Group/ct-shared-deployment-configs
      CT_CONFIG_DIRECTORY: ./dev/services/agentic-karl/agentic-karl
      CT_ARGOCD_DOMAIN: argocd-shared-dev.knauf.digital
      CT_ARGOCD_APP: agentic-karl
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get secrets from shared Key Vaults
        run: |
          set -euo pipefail
          for secret in GITHUB-PUSH-PAT GITHUB-PAT; do
            VALUE=$(az keyvault secret show --vault-name kv-ct-shared-devops-001 --name "$secret" --query value -o tsv)
            echo "::add-mask::$VALUE"
            ENV_NAME="${secret//-/_}"
            echo "$ENV_NAME=$VALUE" >> "$GITHUB_ENV"
          done

          ACR_PASSWORD=$(az keyvault secret show --vault-name kv-ct-shared-tools --name ACRCTSHARED001-REGISTRY-PASSWORD --query value -o tsv)
          echo "::add-mask::$ACR_PASSWORD"
          echo "ACR_PASSWORD=$ACR_PASSWORD" >> "$GITHUB_ENV"

          ARGOCD_PASSWORD=$(az keyvault secret show --vault-name kv-ct-shared-tools --name shared-dev-ARGOCD --query value -o tsv)
          echo "::add-mask::$ARGOCD_PASSWORD"
          echo "CT_ARGOCD_PASSWORD=$ARGOCD_PASSWORD" >> "$GITHUB_ENV"

      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          token: ${{ env.GITHUB_PAT }}
          fetch-depth: 0

      - name: Determine next version
        id: version
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          LATEST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"

          MAJOR=$(echo "$LATEST_TAG" | sed 's/^v//' | cut -d. -f1)
          MINOR=$(echo "$LATEST_TAG" | sed 's/^v//' | cut -d. -f2)
          PATCH=$(echo "$LATEST_TAG" | sed 's/^v//' | cut -d. -f3)

          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'major-release') }}" == "true" ]]; then
            NEW_VERSION="v$((MAJOR + 1)).0.0"
          elif [[ "${{ contains(github.event.pull_request.labels.*.name, 'patch-release') }}" == "true" ]]; then
            NEW_VERSION="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          else
            NEW_VERSION="v${MAJOR}.$((MINOR + 1)).0"
          fi

          echo "New version: $NEW_VERSION"
          echo "new-version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "## Release summary"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Source PR | #${{ github.event.pull_request.number }} $PR_TITLE |"
            echo "| Source commit | \`${{ github.event.pull_request.merge_commit_sha }}\` |"
            echo "| Previous version | \`$LATEST_TAG\` |"
            echo "| Released version | \`$NEW_VERSION\` |"
            echo "| CT image | \`${CT_ACR_NAME}.azurecr.io/${CT_NAMESPACE}/agentic-karl:$NEW_VERSION\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create .npmrc for Docker build
        run: echo "//npm.pkg.github.com/:_authToken=${{ env.GITHUB_PUSH_PAT }}" > .npmrc

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to CT shared ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CT_ACR_NAME }}.azurecr.io
          username: ${{ env.CT_ACR_NAME }}
          password: ${{ env.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.CT_ACR_NAME }}.azurecr.io/${{ env.CT_NAMESPACE }}/agentic-karl:${{ steps.version.outputs.new-version }}
          build-args: |
            NPM_TOKEN=${{ env.GITHUB_PUSH_PAT }}

      - name: Create git tag and GitHub release
        env:
          GH_TOKEN: ${{ env.GITHUB_PAT }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.new-version }}"

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "$VERSION"

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/releases \
            -f tag_name="$VERSION" \
            -f name="$VERSION" \
            -F generate_release_notes=true

      - name: Update CT shared deployment config
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.new-version }}"
          git clone "https://x-access-token:$GITHUB_PAT@github.com/$CT_CONFIG_REPOSITORY.git" ct-deployment-configs
          cd ct-deployment-configs

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          sed -i -E "s/tag: .*$/tag: \"$VERSION\"/g" "$CT_CONFIG_DIRECTORY/values.yaml"
          sed -i -E "s/SERVICE_VERSION:.*$/SERVICE_VERSION: $VERSION/g" "$CT_CONFIG_DIRECTORY/values.yaml"

          git add "$CT_CONFIG_DIRECTORY/values.yaml"
          git commit -m "Update agentic-karl to $VERSION"
          git push origin main

      - name: Refresh CT shared ArgoCD
        run: |
          set -euo pipefail
          ARGOCD_TOKEN=$(curl -fsS "https://$CT_ARGOCD_DOMAIN/api/v1/session" \
            -H "Content-Type: application/json" \
            -d "$CT_ARGOCD_PASSWORD" \
            | jq -r '.token')
          echo "::add-mask::$ARGOCD_TOKEN"

          curl -fsS \
            "https://$CT_ARGOCD_DOMAIN/api/v1/applications/$CT_ARGOCD_APP?refresh=true" \
            -H "Authorization: Bearer $ARGOCD_TOKEN" \
            -H "Accept: application/json" \
            > /dev/null

          echo "CT shared ArgoCD refreshed for $CT_ARGOCD_APP"

  deploy-agk-dev:
    name: Deploy AGK dev
    needs: release
    if: ${{ github.event.pull_request.merged == true && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      AGK_SUBSCRIPTION_ID: ad3f0a71-cc5b-4d00-8289-23623cf2064c
      AGK_ACR_NAME: acragkhubnonprod001
      AGK_IMAGE_REPOSITORY: agentic-karl-dev/agentic-karl
      AGK_CONFIG_REPOSITORY: Knauf-Group/agk-deployment-configs
      AGK_CONFIG_DIRECTORY: agentic-karl/dev/services/agentic-karl
      AGK_ARGOCD_DOMAIN: argocd.agk.nonprod.knauf.digital
      AGK_ARGOCD_APP: agentic-karl-dev-agentic-karl
      AGK_ARGOCD_KEY_VAULT_NAME: kv-agk-hub-nonprod-001
      AGK_ARGOCD_PASSWORD_SECRET_NAME: argocd-admin-agk-nonprod
      CT_ACR_LOGIN_SERVER: acrctshared001.azurecr.io
      CT_IMAGE_REPOSITORY: tools-non-prod/agentic-karl
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get release support secrets
        run: |
          set -euo pipefail
          GITHUB_PAT=$(az keyvault secret show --vault-name kv-ct-shared-devops-001 --name GITHUB-PAT --query value -o tsv)
          echo "::add-mask::$GITHUB_PAT"
          echo "GITHUB_PAT=$GITHUB_PAT" >> "$GITHUB_ENV"

          CT_ACR_PASSWORD=$(az keyvault secret show --vault-name kv-ct-shared-tools --name ACRCTSHARED001-REGISTRY-PASSWORD --query value -o tsv)
          echo "::add-mask::$CT_ACR_PASSWORD"
          echo "CT_ACR_PASSWORD=$CT_ACR_PASSWORD" >> "$GITHUB_ENV"

      - name: Determine released version
        id: version
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          NEW_VERSION="${{ needs.release.outputs.new-version }}"
          echo "Released version: $NEW_VERSION"
          echo "new-version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "## AGK dev rollout"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Source PR | #${{ github.event.pull_request.number }} $PR_TITLE |"
            echo "| Released version | \`$NEW_VERSION\` |"
            echo "| Expected AGK image | \`${AGK_ACR_NAME}.azurecr.io/$AGK_IMAGE_REPOSITORY:$NEW_VERSION\` |"
            echo "| ArgoCD app | \`$AGK_ARGOCD_APP\` on \`$AGK_ARGOCD_DOMAIN\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Import image into AGK nonprod ACR
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.new-version }}"
          az acr import \
            --subscription "$AGK_SUBSCRIPTION_ID" \
            --name "$AGK_ACR_NAME" \
            --source "$CT_ACR_LOGIN_SERVER/$CT_IMAGE_REPOSITORY:$VERSION" \
            --username acrctshared001 \
            --password "$CT_ACR_PASSWORD" \
            --image "$AGK_IMAGE_REPOSITORY:$VERSION" \
            --force

      - name: Verify AGK image tag
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.new-version }}"
          az acr repository show-tags \
            --subscription "$AGK_SUBSCRIPTION_ID" \
            --name "$AGK_ACR_NAME" \
            --repository "$AGK_IMAGE_REPOSITORY" \
            --query "[?@=='$VERSION']" \
            -o tsv | grep -Fx "$VERSION"

      - name: Check out app repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      # Update the in-repo overlay so it stays in sync with the deployed version.
      # Uses a PR branch instead of pushing directly to main.
      - name: Update AGK app overlay values
        env:
          GH_TOKEN: ${{ env.GITHUB_PAT }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.new-version }}"

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git remote set-url origin "https://x-access-token:$GITHUB_PAT@github.com/${GITHUB_REPOSITORY}.git"

          sed -i -E "s/tag: ['\"]v[0-9]+\\.[0-9]+\\.[0-9]+['\"]/tag: '$VERSION'/" infrastructure/dev/values.yaml
          sed -i -E "s/SERVICE_VERSION: .*/SERVICE_VERSION: $VERSION/" infrastructure/dev/values.yaml

          if git diff --quiet -- infrastructure/dev/values.yaml; then
            echo "AGK app overlay already points at $VERSION"
            exit 0
          fi

          BRANCH="release/agk-overlay-$VERSION"
          git checkout -b "$BRANCH"
          git add infrastructure/dev/values.yaml
          git commit -m "Update AGK dev version to $VERSION"
          git push --force origin "$BRANCH"

          PR_URL=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create \
              --base main --head "$BRANCH" \
              --title "Update AGK dev overlay to $VERSION" \
              --body "Automated version bump from the release pipeline (run ${{ github.run_id }}).")
          fi
          gh pr merge "$PR_URL" --auto --squash --delete-branch

          for attempt in {1..30}; do
            STATE=$(gh pr view "$PR_URL" --json state --jq '.state' 2>/dev/null || echo UNKNOWN)
            echo "Attempt $attempt: PR state=$STATE"
            [ "$STATE" = "MERGED" ] && break
            [ "$STATE" = "CLOSED" ] && { echo "Overlay PR closed without merging"; exit 1; }
            sleep 5
          done

          {
            echo "| App overlay PR | $PR_URL |"
            echo "| App overlay file | \`infrastructure/dev/values.yaml\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out AGK deployment config repository
        run: git clone "https://x-access-token:$GITHUB_PAT@github.com/$AGK_CONFIG_REPOSITORY.git" agk-deployment-configs

      # The agk-deployment-configs main branch is protected (PR required, Sonar
      # "test" check, no direct pushes), so the bump is landed via an
      # auto-merged PR instead of a direct `git push origin main`.
      - name: Update AGK deployment config values
        working-directory: agk-deployment-configs
        env:
          GH_TOKEN: ${{ env.GITHUB_PAT }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.new-version }}"
          BRANCH="release/agk-dev-$VERSION"

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          sed -i -E "s/tag: ['\"]v[0-9]+\\.[0-9]+\\.[0-9]+['\"]/tag: \"$VERSION\"/" "$AGK_CONFIG_DIRECTORY/values.yaml"

          if git diff --quiet -- "$AGK_CONFIG_DIRECTORY/values.yaml"; then
            echo "AGK deployment config already points at $VERSION"
            echo "| Deployment config | already at \`$VERSION\` (no PR needed) |" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git checkout -b "$BRANCH"
          git add "$AGK_CONFIG_DIRECTORY/values.yaml"
          git commit -m "Update agentic-karl dev to $VERSION"
          git push --force origin "$BRANCH"

          PR_URL=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create \
              --base main --head "$BRANCH" \
              --title "Update agentic-karl dev to $VERSION" \
              --body "Automated GitOps version bump from the agentic-karl release pipeline (run ${{ github.run_id }}). Bumps \`$AGK_CONFIG_DIRECTORY/values.yaml\` image tag to \`$VERSION\`.")
          fi
          echo "Deployment config PR: $PR_URL"

          gh pr merge "$PR_URL" --auto --squash --delete-branch

          STATE=""
          for attempt in {1..90}; do
            STATE=$(gh pr view "$PR_URL" --json state --jq '.state' 2>/dev/null || echo UNKNOWN)
            echo "Attempt $attempt: PR state=$STATE"
            if [ "$STATE" = "MERGED" ]; then
              break
            fi
            if [ "$STATE" = "CLOSED" ]; then
              echo "Deployment config PR was closed without merging"
              exit 1
            fi
            sleep 10
          done

          if [ "$STATE" != "MERGED" ]; then
            echo "Deployment config PR did not merge in time (state=$STATE)."
            echo "Auto-merge stays enabled, so it will merge once the 'test' check passes; re-run this job afterwards or check $PR_URL."
            exit 1
          fi

          {
            echo "| Deployment config PR | $PR_URL (merged) |"
            echo "| Deployment config file | \`$AGK_CONFIG_REPOSITORY/$AGK_CONFIG_DIRECTORY/values.yaml\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refresh AGK ArgoCD application
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.new-version }}"
          EXPECTED_IMAGE="$AGK_IMAGE_REPOSITORY:$VERSION"
          echo "Waiting for AGK ArgoCD app $AGK_ARGOCD_APP to report Synced/Healthy on image $EXPECTED_IMAGE"
          ARGOCD_PASSWORD=$(az keyvault secret show \
            --subscription "$AGK_SUBSCRIPTION_ID" \
            --vault-name "$AGK_ARGOCD_KEY_VAULT_NAME" \
            --name "$AGK_ARGOCD_PASSWORD_SECRET_NAME" \
            --query value \
            -o tsv)
          echo "::add-mask::$ARGOCD_PASSWORD"

          ARGOCD_TOKEN=$(jq -rn --arg password "$ARGOCD_PASSWORD" '{username: "admin", password: $password}' \
            | curl -fsS "https://$AGK_ARGOCD_DOMAIN/api/v1/session" \
                -H "Content-Type: application/json" \
                -d @- \
            | jq -r '.token')
          echo "::add-mask::$ARGOCD_TOKEN"

          curl -fsS \
            "https://$AGK_ARGOCD_DOMAIN/api/v1/applications/$AGK_ARGOCD_APP?refresh=true" \
            -H "Authorization: Bearer $ARGOCD_TOKEN" \
            -H "Accept: application/json" \
            > /dev/null

          for attempt in {1..60}; do
            APP_JSON=$(curl -fsS \
              "https://$AGK_ARGOCD_DOMAIN/api/v1/applications/$AGK_ARGOCD_APP" \
              -H "Authorization: Bearer $ARGOCD_TOKEN" \
              -H "Accept: application/json")

            SYNC_STATUS=$(jq -r '.status.sync.status' <<< "$APP_JSON")
            HEALTH_STATUS=$(jq -r '.status.health.status' <<< "$APP_JSON")
            CURRENT_IMAGES=$(jq -r '.status.summary.images[]?' <<< "$APP_JSON" | tr '\n' ',' | sed 's/,$//')
            IMAGE_MATCH=$(jq -r '.status.summary.images[]?' <<< "$APP_JSON" | grep -F "$EXPECTED_IMAGE" || true)

            echo "Attempt $attempt: sync=$SYNC_STATUS health=$HEALTH_STATUS expected_image=${IMAGE_MATCH:-missing} current_images=${CURRENT_IMAGES:-none}"

            if [ "$SYNC_STATUS" = "Synced" ] && [ "$HEALTH_STATUS" = "Healthy" ] && [ -n "$IMAGE_MATCH" ]; then
              {
                echo "| Final ArgoCD sync | \`$SYNC_STATUS\` |"
                echo "| Final ArgoCD health | \`$HEALTH_STATUS\` |"
                echo "| Final ArgoCD images | \`${CURRENT_IMAGES:-none}\` |"
                echo "| AGK dev URL | https://agentic-karl.agk.dev.knauf.digital |"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            curl -fsS \
              "https://$AGK_ARGOCD_DOMAIN/api/v1/applications/$AGK_ARGOCD_APP?refresh=true" \
              -H "Authorization: Bearer $ARGOCD_TOKEN" \
              -H "Accept: application/json" \
              > /dev/null
            sleep 10
          done

          echo "AGK ArgoCD did not report $VERSION as Synced/Healthy in time"
          {
            echo "| Final ArgoCD sync | \`${SYNC_STATUS:-unknown}\` |"
            echo "| Final ArgoCD health | \`${HEALTH_STATUS:-unknown}\` |"
            echo "| Final ArgoCD images | \`${CURRENT_IMAGES:-none}\` |"
            echo "| Failure | AGK ArgoCD did not report \`$EXPECTED_IMAGE\` as Synced/Healthy in time |"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
