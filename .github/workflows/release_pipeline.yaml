name: Release Pipeline

run-name: Release PR #${{ github.event.pull_request.number }} to AGK dev

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.repository }}-release
  cancel-in-progress: false

jobs:
  release:
    name: Build, release and deploy to AGK dev
    # Branch protection enforces green tests on main — that is the release gate.
    # Skip automation-owned branches to prevent release loops.
    if: >-
      github.event.pull_request.merged == true
      && !startsWith(github.event.pull_request.head.ref, 'release/agk-overlay-')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      AGK_SUBSCRIPTION_ID: ad3f0a71-cc5b-4d00-8289-23623cf2064c
      AGK_ACR_NAME: acragkhubnonprod001
      AGK_IMAGE_REPOSITORY: agentic-karl-dev/agentic-karl
      AGK_CONFIG_REPOSITORY: Knauf-Group/agk-deployment-configs
      AGK_CONFIG_DIRECTORY: agentic-karl/dev/services/agentic-karl
      AGK_ARGOCD_DOMAIN: argocd.agk.nonprod.knauf.digital
      AGK_ARGOCD_APP: agentic-karl-dev-agentic-karl
      AGK_ARGOCD_KEY_VAULT_NAME: kv-agk-hub-nonprod-001
      AGK_ARGOCD_PASSWORD_SECRET_NAME: argocd-admin-agk-nonprod
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get secrets from Key Vaults
        run: |
          set -euo pipefail
          GITHUB_PAT=$(az keyvault secret show --vault-name kv-ct-shared-devops-001 --name GITHUB-PAT --query value -o tsv)
          echo "::add-mask::$GITHUB_PAT"
          echo "GITHUB_PAT=$GITHUB_PAT" >> "$GITHUB_ENV"

      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          token: ${{ env.GITHUB_PAT }}
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Determine next version
        id: version
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          MERGE_SHA="${{ github.event.pull_request.merge_commit_sha }}"
          # Use strict semver pattern to avoid matching prereleases / vendor tags
          LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
          LATEST_TAG="${LATEST_TAG:-v0.0.0}"
          echo "Latest tag: $LATEST_TAG"

          # Idempotent: if the merge commit already has a version tag, reuse it
          EXISTING_TAG=$(git tag --points-at "$MERGE_SHA" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -n "$EXISTING_TAG" ]; then
            echo "Merge commit already tagged as $EXISTING_TAG — reusing (rerun scenario)"
            NEW_VERSION="$EXISTING_TAG"
          else
            MAJOR=$(echo "$LATEST_TAG" | sed 's/^v//' | cut -d. -f1)
            MINOR=$(echo "$LATEST_TAG" | sed 's/^v//' | cut -d. -f2)
            NEW_VERSION="v${MAJOR}.$((MINOR + 1)).0"
          fi

          echo "New version: $NEW_VERSION"
          echo "new-version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "## Release summary"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Source PR | #${{ github.event.pull_request.number }} $PR_TITLE |"
            echo "| Source commit | \`${{ github.event.pull_request.merge_commit_sha }}\` |"
            echo "| Previous version | \`$LATEST_TAG\` |"
            echo "| Released version | \`$NEW_VERSION\` |"
            echo "| Image | \`${AGK_ACR_NAME}.azurecr.io/$AGK_IMAGE_REPOSITORY:$NEW_VERSION\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build and push Docker image (ACR Tasks)
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.new-version }}"

          # Idempotent: skip build if the image tag already exists in ACR (rerun scenario)
          if az acr repository show-tags \
               --subscription "$AGK_SUBSCRIPTION_ID" \
               --name "$AGK_ACR_NAME" \
               --repository "$AGK_IMAGE_REPOSITORY" \
               --query "[?@=='$VERSION']" \
               -o tsv 2>/dev/null | grep -Fxq "$VERSION"; then
            echo "Image $AGK_IMAGE_REPOSITORY:$VERSION already in ACR — skipping build (rerun scenario)"
            exit 0
          fi

          az acr build \
            --subscription "$AGK_SUBSCRIPTION_ID" \
            --registry "$AGK_ACR_NAME" \
            --image "$AGK_IMAGE_REPOSITORY:$VERSION" \
            .

      - name: Create git tag and GitHub release (idempotent)
        env:
          GH_TOKEN: ${{ env.GITHUB_PAT }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.new-version }}"
          MERGE_SHA="${{ github.event.pull_request.merge_commit_sha }}"

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Idempotent: skip if tag already exists and points at the merge commit
          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-list -n1 "refs/tags/$VERSION")
            if [ "$TAG_SHA" != "$MERGE_SHA" ]; then
              echo "::error::Tag $VERSION exists but points at $TAG_SHA, not merge commit $MERGE_SHA — aborting to prevent image/tag mismatch"
              exit 1
            fi
            echo "Tag $VERSION already exists at $MERGE_SHA — skipping tag creation (rerun scenario)"
          else
            git tag -a "$VERSION" "$MERGE_SHA" -m "$VERSION"
            git push origin "$VERSION"
          fi

          # Idempotent: skip if release already exists
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists — skipping release creation"
          else
            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              /repos/${{ github.repository }}/releases \
              -f tag_name="$VERSION" \
              -f name="$VERSION" \
              -F generate_release_notes=true
          fi

      - name: Check out AGK deployment config repository
        run: git clone "https://${{ env.GITHUB_PAT }}@github.com/$AGK_CONFIG_REPOSITORY.git" agk-deployment-configs

      # agk-deployment-configs main is branch-protected (PR required, Sonar
      # "test" check), so the bump is landed via an auto-merged PR.
      - name: Update AGK deployment config values
        working-directory: agk-deployment-configs
        env:
          GH_TOKEN: ${{ env.GITHUB_PAT }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.new-version }}"
          BRANCH="release/agk-dev-$VERSION"

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Anchor to the image.tag key path to avoid corrupting other tag: lines
          sed -i -E "/^[[:space:]]+tag:/s/['\"]?v[0-9]+\\.[0-9]+\\.[0-9]+['\"]?/\"$VERSION\"/" "$AGK_CONFIG_DIRECTORY/values.yaml"

          if git diff --quiet -- "$AGK_CONFIG_DIRECTORY/values.yaml"; then
            echo "AGK deployment config already points at $VERSION"
            echo "| Deployment config | already at \`$VERSION\` (no PR needed) |" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git checkout -b "$BRANCH"
          git add "$AGK_CONFIG_DIRECTORY/values.yaml"
          git commit -m "Update agentic-karl dev to $VERSION"
          git push --force origin "$BRANCH"

          PR_URL=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create \
              --base main --head "$BRANCH" \
              --title "Update agentic-karl dev to $VERSION" \
              --body "Automated GitOps version bump from the agentic-karl release pipeline (run ${{ github.run_id }}). Bumps \`$AGK_CONFIG_DIRECTORY/values.yaml\` image tag to \`$VERSION\`.")
          fi
          echo "Deployment config PR: $PR_URL"

          # --auto waits for required checks; fallback handles already-mergeable PRs on rerun
          gh pr merge "$PR_URL" --auto --squash --delete-branch \
            || gh pr merge "$PR_URL" --squash --delete-branch \
            || true

          STATE=""
          for attempt in {1..90}; do
            STATE=$(gh pr view "$PR_URL" --json state --jq '.state' 2>/dev/null || echo UNKNOWN)
            echo "Attempt $attempt: PR state=$STATE"
            if [ "$STATE" = "MERGED" ]; then
              break
            fi
            if [ "$STATE" = "CLOSED" ]; then
              echo "Deployment config PR was closed without merging"
              exit 1
            fi
            sleep 10
          done

          if [ "$STATE" != "MERGED" ]; then
            echo "Deployment config PR did not merge in time (state=$STATE)."
            echo "Auto-merge stays enabled, so it will merge once the 'test' check passes; re-run this job afterwards or check $PR_URL."
            exit 1
          fi

          {
            echo "| Deployment config PR | $PR_URL (merged) |"
            echo "| Deployment config file | \`$AGK_CONFIG_REPOSITORY/$AGK_CONFIG_DIRECTORY/values.yaml\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refresh AGK ArgoCD application
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.new-version }}"
          EXPECTED_IMAGE="$AGK_IMAGE_REPOSITORY:$VERSION"
          echo "Waiting for AGK ArgoCD app $AGK_ARGOCD_APP to report Synced/Healthy on image $EXPECTED_IMAGE"
          ARGOCD_PASSWORD=$(az keyvault secret show \
            --subscription "$AGK_SUBSCRIPTION_ID" \
            --vault-name "$AGK_ARGOCD_KEY_VAULT_NAME" \
            --name "$AGK_ARGOCD_PASSWORD_SECRET_NAME" \
            --query value \
            -o tsv)
          echo "::add-mask::$ARGOCD_PASSWORD"

          ARGOCD_TOKEN=$(jq -rn --arg password "$ARGOCD_PASSWORD" '{username: "admin", password: $password}' \
            | curl -fsS "https://$AGK_ARGOCD_DOMAIN/api/v1/session" \
                -H "Content-Type: application/json" \
                -d @- \
            | jq -r '.token')
          echo "::add-mask::$ARGOCD_TOKEN"

          # Initial refresh — tolerate transient errors
          curl -fsS \
            "https://$AGK_ARGOCD_DOMAIN/api/v1/applications/$AGK_ARGOCD_APP?refresh=true" \
            -H "Authorization: Bearer $ARGOCD_TOKEN" \
            -H "Accept: application/json" \
            > /dev/null 2>&1 || true

          for attempt in {1..60}; do
            # Tolerate transient API blips so set -euo pipefail does not abort the loop
            APP_JSON=$(curl -fsS \
              "https://$AGK_ARGOCD_DOMAIN/api/v1/applications/$AGK_ARGOCD_APP" \
              -H "Authorization: Bearer $ARGOCD_TOKEN" \
              -H "Accept: application/json" 2>/dev/null || true)

            if [ -z "$APP_JSON" ]; then
              echo "Attempt $attempt: API blip — retrying"
              sleep 10
              continue
            fi

            SYNC_STATUS=$(jq -r '.status.sync.status' <<< "$APP_JSON")
            HEALTH_STATUS=$(jq -r '.status.health.status' <<< "$APP_JSON")
            CURRENT_IMAGES=$(jq -r '.status.summary.images[]?' <<< "$APP_JSON" | tr '\n' ',' | sed 's/,$//')
            IMAGE_MATCH=$(jq -r '.status.summary.images[]?' <<< "$APP_JSON" | grep -F "$EXPECTED_IMAGE" || true)

            echo "Attempt $attempt: sync=$SYNC_STATUS health=$HEALTH_STATUS expected_image=${IMAGE_MATCH:-missing} current_images=${CURRENT_IMAGES:-none}"

            if [ "$SYNC_STATUS" = "Synced" ] && [ "$HEALTH_STATUS" = "Healthy" ] && [ -n "$IMAGE_MATCH" ]; then
              {
                echo "| Final ArgoCD sync | \`$SYNC_STATUS\` |"
                echo "| Final ArgoCD health | \`$HEALTH_STATUS\` |"
                echo "| Final ArgoCD images | \`${CURRENT_IMAGES:-none}\` |"
                echo "| AGK dev URL | https://agentic-karl.agk.dev.knauf.digital |"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            curl -fsS \
              "https://$AGK_ARGOCD_DOMAIN/api/v1/applications/$AGK_ARGOCD_APP?refresh=true" \
              -H "Authorization: Bearer $ARGOCD_TOKEN" \
              -H "Accept: application/json" \
              > /dev/null 2>&1 || true
            sleep 10
          done

          echo "AGK ArgoCD did not report $VERSION as Synced/Healthy in time"
          {
            echo "| Final ArgoCD sync | \`${SYNC_STATUS:-unknown}\` |"
            echo "| Final ArgoCD health | \`${HEALTH_STATUS:-unknown}\` |"
            echo "| Final ArgoCD images | \`${CURRENT_IMAGES:-none}\` |"
            echo "| Failure | AGK ArgoCD did not report \`$EXPECTED_IMAGE\` as Synced/Healthy in time |"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
