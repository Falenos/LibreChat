name: Release Pipeline

run-name: Release PR #${{ github.event.pull_request.number }} to shared dev and AGK dev

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.repository }}-release
  cancel-in-progress: false

jobs:
  release:
    uses: 'Knauf-Group/ct-shared-workflows/.github/workflows/release-nextjs.yaml@v2.9.0'
    with:
      repo-name-override: agentic-karl
      checkout-submodules: false
      project-key-vault-name: kv-ct-shared-tools
      project-shared-key-vault-name: kv-ct-shared-devops-001
      acr-password-key-vault-secret-name: ACRCTSHARED001-REGISTRY-PASSWORD
      acr-registry-name: acrctshared001
      namespace: tools-non-prod
      config-repository: Knauf-Group/ct-shared-deployment-configs
      argocd-password-key-vault-secret-name: shared-dev-ARGOCD
      argocd-domain: argocd-shared-dev.knauf.digital
      version-badge-directory: './docs/versions'
      deployment-config-directory: ./dev/services/agentic-karl/agentic-karl
      download-coverage-report: true
      coverage-folder-path: ./coverage
      test-workflow-file-name: test_pipeline.yaml
    secrets:
      azure-credentials: ${{ secrets.AZURE_CREDENTIALS }}

  deploy-agk-dev:
    name: Deploy AGK dev
    needs: release
    if: ${{ github.event.pull_request.merged == true && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      AGK_SUBSCRIPTION_ID: ad3f0a71-cc5b-4d00-8289-23623cf2064c
      AGK_ACR_NAME: acragkhubnonprod001
      AGK_IMAGE_REPOSITORY: agentic-karl-dev/agentic-karl
      AGK_CONFIG_REPOSITORY: Knauf-Group/agk-deployment-configs
      AGK_CONFIG_DIRECTORY: agentic-karl/dev/services/agentic-karl
      AGK_ARGOCD_DOMAIN: argocd.agk.nonprod.knauf.digital
      AGK_ARGOCD_APP: agentic-karl-dev-agentic-karl
      AGK_ARGOCD_KEY_VAULT_NAME: kv-agk-hub-nonprod-001
      AGK_ARGOCD_PASSWORD_SECRET_NAME: argocd-admin-agk-nonprod
      CT_ACR_LOGIN_SERVER: acrctshared001.azurecr.io
      CT_IMAGE_REPOSITORY: tools-non-prod/agentic-karl
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get release support secrets
        run: |
          GITHUB_PAT=$(az keyvault secret show --vault-name kv-ct-shared-devops-001 --name GITHUB-PAT --query value -o tsv)
          echo "::add-mask::$GITHUB_PAT"
          echo "GITHUB_PAT=$GITHUB_PAT" >> "$GITHUB_ENV"

          CT_ACR_PASSWORD=$(az keyvault secret show --vault-name kv-ct-shared-tools --name ACRCTSHARED001-REGISTRY-PASSWORD --query value -o tsv)
          echo "::add-mask::$CT_ACR_PASSWORD"
          echo "CT_ACR_PASSWORD=$CT_ACR_PASSWORD" >> "$GITHUB_ENV"

      - name: Check out released app revision
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Configure AGK app repository credentials
        run: git remote set-url origin "https://x-access-token:$GITHUB_PAT@github.com/${GITHUB_REPOSITORY}.git"

      - name: Determine released version
        id: version
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          git pull --ff-only origin main
          NEW_VERSION="v$(npm pkg get version | tr -d '"')"
          echo "Released version: $NEW_VERSION"
          echo "new-version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "## AGK dev rollout"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Source PR | #${{ github.event.pull_request.number }} $PR_TITLE |"
            echo "| Source commit | \`${{ github.event.pull_request.merge_commit_sha }}\` |"
            echo "| Released version | \`$NEW_VERSION\` |"
            echo "| Expected AGK image | \`${AGK_ACR_NAME}.azurecr.io/$AGK_IMAGE_REPOSITORY:$NEW_VERSION\` |"
            echo "| ArgoCD app | \`$AGK_ARGOCD_APP\` on \`$AGK_ARGOCD_DOMAIN\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Import image into AGK nonprod ACR
        run: |
          VERSION="${{ steps.version.outputs.new-version }}"
          az acr import \
            --subscription "$AGK_SUBSCRIPTION_ID" \
            --name "$AGK_ACR_NAME" \
            --source "$CT_ACR_LOGIN_SERVER/$CT_IMAGE_REPOSITORY:$VERSION" \
            --username acrctshared001 \
            --password "$CT_ACR_PASSWORD" \
            --image "$AGK_IMAGE_REPOSITORY:$VERSION" \
            --force

      - name: Verify AGK image tag
        run: |
          VERSION="${{ steps.version.outputs.new-version }}"
          az acr repository show-tags \
            --subscription "$AGK_SUBSCRIPTION_ID" \
            --name "$AGK_ACR_NAME" \
            --repository "$AGK_IMAGE_REPOSITORY" \
            --query "[?@=='$VERSION']" \
            -o tsv | grep -Fx "$VERSION"

      - name: Update AGK app overlay values
        run: |
          VERSION="${{ steps.version.outputs.new-version }}"
          sed -i -E "s/tag: ['\"]v[0-9]+\\.[0-9]+\\.[0-9]+['\"]/tag: '$VERSION'/" infrastructure/dev/values.yaml
          sed -i -E "s/SERVICE_VERSION: .*/SERVICE_VERSION: $VERSION/" infrastructure/dev/values.yaml

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git remote set-url origin "https://x-access-token:$GITHUB_PAT@github.com/${GITHUB_REPOSITORY}.git"
          git add infrastructure/dev/values.yaml

          if ! git diff --cached --quiet; then
            git commit -m "Update AGK dev version to $VERSION"
            git push origin main
          else
            echo "AGK app overlay already points at $VERSION"
          fi

          {
            echo "| App overlay commit | \`$(git rev-parse --short HEAD)\` |"
            echo "| App overlay file | \`infrastructure/dev/values.yaml\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out AGK deployment config repository
        run: git clone "https://x-access-token:$GITHUB_PAT@github.com/$AGK_CONFIG_REPOSITORY.git" agk-deployment-configs

      - name: Update AGK deployment config values
        working-directory: agk-deployment-configs
        run: |
          VERSION="${{ steps.version.outputs.new-version }}"
          git pull --ff-only origin main
          sed -i -E "s/tag: ['\"]v[0-9]+\\.[0-9]+\\.[0-9]+['\"]/tag: \"$VERSION\"/" "$AGK_CONFIG_DIRECTORY/values.yaml"

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add "$AGK_CONFIG_DIRECTORY/values.yaml"

          if ! git diff --cached --quiet; then
            git commit -m "Update agentic-karl dev to $VERSION"
            git push origin main
          else
            echo "AGK deployment config already points at $VERSION"
          fi

          {
            echo "| Deployment config commit | \`$(git rev-parse --short HEAD)\` |"
            echo "| Deployment config file | \`$AGK_CONFIG_REPOSITORY/$AGK_CONFIG_DIRECTORY/values.yaml\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refresh AGK ArgoCD application
        run: |
          VERSION="${{ steps.version.outputs.new-version }}"
          EXPECTED_IMAGE="$AGK_IMAGE_REPOSITORY:$VERSION"
          echo "Waiting for AGK ArgoCD app $AGK_ARGOCD_APP to report Synced/Healthy on image $EXPECTED_IMAGE"
          ARGOCD_PASSWORD=$(az keyvault secret show \
            --subscription "$AGK_SUBSCRIPTION_ID" \
            --vault-name "$AGK_ARGOCD_KEY_VAULT_NAME" \
            --name "$AGK_ARGOCD_PASSWORD_SECRET_NAME" \
            --query value \
            -o tsv)
          echo "::add-mask::$ARGOCD_PASSWORD"

          ARGOCD_TOKEN=$(jq -rn --arg password "$ARGOCD_PASSWORD" '{username: "admin", password: $password}' \
            | curl -fsS "https://$AGK_ARGOCD_DOMAIN/api/v1/session" \
                -H "Content-Type: application/json" \
                -d @- \
            | jq -r '.token')
          echo "::add-mask::$ARGOCD_TOKEN"

          curl -fsS \
            "https://$AGK_ARGOCD_DOMAIN/api/v1/applications/$AGK_ARGOCD_APP?refresh=true" \
            -H "Authorization: Bearer $ARGOCD_TOKEN" \
            -H "Accept: application/json" \
            > /dev/null

          for attempt in {1..60}; do
            APP_JSON=$(curl -fsS \
              "https://$AGK_ARGOCD_DOMAIN/api/v1/applications/$AGK_ARGOCD_APP" \
              -H "Authorization: Bearer $ARGOCD_TOKEN" \
              -H "Accept: application/json")

            SYNC_STATUS=$(jq -r '.status.sync.status' <<< "$APP_JSON")
            HEALTH_STATUS=$(jq -r '.status.health.status' <<< "$APP_JSON")
            CURRENT_IMAGES=$(jq -r '.status.summary.images[]?' <<< "$APP_JSON" | tr '\n' ',' | sed 's/,$//')
            IMAGE_MATCH=$(jq -r '.status.summary.images[]?' <<< "$APP_JSON" | grep -F "$EXPECTED_IMAGE" || true)

            echo "Attempt $attempt: sync=$SYNC_STATUS health=$HEALTH_STATUS expected_image=${IMAGE_MATCH:-missing} current_images=${CURRENT_IMAGES:-none}"

            if [ "$SYNC_STATUS" = "Synced" ] && [ "$HEALTH_STATUS" = "Healthy" ] && [ -n "$IMAGE_MATCH" ]; then
              {
                echo "| Final ArgoCD sync | \`$SYNC_STATUS\` |"
                echo "| Final ArgoCD health | \`$HEALTH_STATUS\` |"
                echo "| Final ArgoCD images | \`${CURRENT_IMAGES:-none}\` |"
                echo "| AGK dev URL | https://agentic-karl.agk.dev.knauf.digital |"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            curl -fsS \
              "https://$AGK_ARGOCD_DOMAIN/api/v1/applications/$AGK_ARGOCD_APP?refresh=true" \
              -H "Authorization: Bearer $ARGOCD_TOKEN" \
              -H "Accept: application/json" \
              > /dev/null
            sleep 10
          done

          echo "AGK ArgoCD did not report $VERSION as Synced/Healthy in time"
          {
            echo "| Final ArgoCD sync | \`${SYNC_STATUS:-unknown}\` |"
            echo "| Final ArgoCD health | \`${HEALTH_STATUS:-unknown}\` |"
            echo "| Final ArgoCD images | \`${CURRENT_IMAGES:-none}\` |"
            echo "| Failure | AGK ArgoCD did not report \`$EXPECTED_IMAGE\` as Synced/Healthy in time |"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
