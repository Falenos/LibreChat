name: Promote Pipeline

on:
  workflow_dispatch:
    inputs:
      source-and-destination-environment:
        type: choice
        description: 'Source and destination environments for promotion'
        required: true
        default: 'dev → prod'
        options:
          - 'dev → prod'
      version:
        description: 'The version to promote. Only used when the version to promote is not the current one in the source environment'
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.repository }}-release
  cancel-in-progress: false

jobs:
  promote-dev-to-prod:
    if: ${{ inputs.source-and-destination-environment == 'dev → prod' }}
    uses: 'Knauf-Group/ct-shared-workflows/.github/workflows/promote-app-kubernetes.yaml@v2.9.0'
    with:
      app-name: agentic-karl
      version: ${{ inputs.version }}
      source-environment-key-vault-name: kv-ct-shared-tools
      source-environment-argocd-password-key-vault-secret-name: shared-dev-ARGOCD
      source-environment-argocd-domain: argocd-shared-dev.knauf.digital
      source-environment-acr-registry-name: acrctshared001
      namespace: tools-non-prod
      destination-environment-acr-registry-name: acrctshared001
      destination-environment-config-repository: Knauf-Group/ct-shared-deployment-configs
      destination-environment-config-repository-app-directory: ./dev/services/agentic-karl/agentic-karl
      destination-environment-key-vault-name: kv-ct-sharedprod-tools
      destination-environment-argocd-password-key-vault-secret-name: shared-prod-ARGOCD
      destination-environment-argocd-domain: argocd-shared-prod.knauf.digital
      destination-environment: prod
      version-badge-directory: './docs/versions'
    secrets:
      azure-credentials: ${{ secrets.AZURE_CREDENTIALS }}
