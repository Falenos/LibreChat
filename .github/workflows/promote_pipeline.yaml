name: Deploy Stage to Prod

on:
  workflow_dispatch:
    inputs:
      source-and-destination-environment:
        type: choice
        description: 'Source and destination environments for promotion'
        required: true
        default: 'AGK stage -> AGK prod'
        options:
          - 'AGK stage -> AGK prod'
      version:
        description: 'Version to promote, for example v0.54.0. Defaults to the current AGK stage GitOps tag.'
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.repository }}-release
  cancel-in-progress: false

jobs:
  promote-agk-stage-to-prod:
    name: Promote AGK stage to prod
    if: ${{ inputs.source-and-destination-environment == 'AGK stage -> AGK prod' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: https://agentic-karl.knauf.com
    env:
      CT_SUBSCRIPTION_ID: ad3f0a71-cc5b-4d00-8289-23623cf2064c
      AGK_STAGE_SUBSCRIPTION_ID: ad3f0a71-cc5b-4d00-8289-23623cf2064c
      AGK_PROD_SUBSCRIPTION_ID: e0515a24-7205-481b-b657-944901020e32
      AGK_STAGE_ACR_NAME: acragkhubnonprod001
      AGK_PROD_ACR_NAME: acragkhubprod001
      AGK_STAGE_IMAGE_REPOSITORY: agentic-karl-stage/agentic-karl
      AGK_PROD_IMAGE_REPOSITORY: agentic-karl-prod/agentic-karl
      AGK_CONFIG_REPOSITORY: Knauf-Group/agk-deployment-configs
      AGK_STAGE_CONFIG_DIRECTORY: agentic-karl/stage/services/agentic-karl
      AGK_STAGE_WORKER_CONFIG_DIRECTORY: agentic-karl/stage/services/agentic-karl-worker
      AGK_PROD_CONFIG_DIRECTORY: agentic-karl/prod/services/agentic-karl
      AGK_PROD_MEILI_CONFIG_DIRECTORY: agentic-karl/prod/services/agentic-karl-meilisearch
      # [knauf] KK20-195 — prod worker values, bumped in lock-step with the app.
      # Guarded by a file-exists check: the prod worker dir is intentionally NOT
      # created until WP1 + WP6 sign-off, so this stays a no-op until then.
      AGK_PROD_WORKER_CONFIG_DIRECTORY: agentic-karl/prod/services/agentic-karl-worker
      AGK_PROD_DOMAIN: https://agentic-karl.knauf.com
      AGK_ARGOCD_DOMAIN: argocd.agk.prod.knauf.digital
      AGK_ARGOCD_APP: agentic-karl-prod-agentic-karl
      AGK_ARGOCD_KEY_VAULT_NAME: kv-agk-hub-prod-001
      AGK_ARGOCD_PASSWORD_SECRET_NAME: argocd-admin-agk-prod
      QUALITY_REPOSITORY: Knauf-Group/agentic-karl-quality
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get promotion support secrets
        run: |
          set -euo pipefail

          GITHUB_PAT=$(az keyvault secret show \
            --subscription "$CT_SUBSCRIPTION_ID" \
            --vault-name kv-ct-shared-devops-001 \
            --name GITHUB-PAT \
            --query value \
            -o tsv)
          echo "::add-mask::$GITHUB_PAT"
          echo "GITHUB_PAT=$GITHUB_PAT" >> "$GITHUB_ENV"

      - name: Check out app repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check out AGK deployment config repository
        run: git clone "https://x-access-token:$GITHUB_PAT@github.com/$AGK_CONFIG_REPOSITORY.git" agk-deployment-configs

      - name: Determine version to promote
        id: version
        run: |
          set -euo pipefail


          APP_VALUES="agk-deployment-configs/$AGK_STAGE_CONFIG_DIRECTORY/values.yaml"
          WORKER_VALUES="agk-deployment-configs/$AGK_STAGE_WORKER_CONFIG_DIRECTORY/values.yaml"
          test -f "$APP_VALUES"
          test -f "$WORKER_VALUES"

          INPUT_VERSION="${{ inputs.version }}"
          STAGE_VERSION=$(awk '$1 == "tag:" { print $2; exit }' "$APP_VALUES" | tr -d "\"'")
          STAGE_WORKER_VERSION=$(awk '$1 == "tag:" { print $2; exit }' "$WORKER_VALUES" | tr -d "\"'")
          VERSION="${INPUT_VERSION:-$STAGE_VERSION}"

          if [ "$STAGE_WORKER_VERSION" != "$STAGE_VERSION" ]; then
            echo "::error::STAGE app tag $STAGE_VERSION and worker tag $STAGE_WORKER_VERSION differ"
            exit 1
          fi

          if [ "$VERSION" != "$STAGE_VERSION" ]; then
            echo "::error::Requested version $VERSION is not the current STAGE GitOps tag $STAGE_VERSION"
            exit 1
          fi

          if ! grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' <<< "$VERSION"; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

          echo "Version to promote: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate promotion inputs and prod config shape
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"

          test -f "agk-deployment-configs/$AGK_STAGE_CONFIG_DIRECTORY/values.yaml"
          test -f "agk-deployment-configs/$AGK_STAGE_WORKER_CONFIG_DIRECTORY/values.yaml"
          test -f "agk-deployment-configs/$AGK_PROD_CONFIG_DIRECTORY/values.yaml"
          test -f "agk-deployment-configs/$AGK_PROD_MEILI_CONFIG_DIRECTORY/values.yaml"
          grep -F "repository: $AGK_STAGE_ACR_NAME.azurecr.io/$AGK_STAGE_IMAGE_REPOSITORY" \
            "agk-deployment-configs/$AGK_STAGE_CONFIG_DIRECTORY/values.yaml"
          grep -F "repository: $AGK_PROD_ACR_NAME.azurecr.io/$AGK_PROD_IMAGE_REPOSITORY" \
            "agk-deployment-configs/$AGK_PROD_CONFIG_DIRECTORY/values.yaml"
          grep -F "DOMAIN_SERVER: \"$AGK_PROD_DOMAIN\"" \
            "agk-deployment-configs/$AGK_PROD_CONFIG_DIRECTORY/values.yaml"
          grep -F "MEILI_MASTER_KEY: AGK-MEILI-MASTER-KEY" \
            "agk-deployment-configs/$AGK_PROD_CONFIG_DIRECTORY/values.yaml"
          grep -F "MEILI_MASTER_KEY: AGK-MEILI-MASTER-KEY" \
            "agk-deployment-configs/$AGK_PROD_MEILI_CONFIG_DIRECTORY/values.yaml"

          az acr repository show-tags \
            --subscription "$AGK_STAGE_SUBSCRIPTION_ID" \
            --name "$AGK_STAGE_ACR_NAME" \
            --repository "$AGK_STAGE_IMAGE_REPOSITORY" \
            --query "[?@=='$VERSION']" \
            -o tsv | grep -Fx "$VERSION"

          APP_CONFIG_SHA=$(sha256sum \
            "agk-deployment-configs/$AGK_STAGE_CONFIG_DIRECTORY/values.yaml" | awk '{print $1}')
          WORKER_CONFIG_SHA=$(sha256sum \
            "agk-deployment-configs/$AGK_STAGE_WORKER_CONFIG_DIRECTORY/values.yaml" | awk '{print $1}')
          git -C agk-deployment-configs fetch --force origin \
            'refs/tags/agentic-karl-stage-validated/*:refs/tags/agentic-karl-stage-validated/*'

          MATCHING_MARKER=""
          while IFS= read -r MARKER; do
            [ -n "$MARKER" ] || continue
            MESSAGE=$(git -C agk-deployment-configs for-each-ref --format='%(contents)' "refs/tags/$MARKER")
            MARKER_COMMIT=$(git -C agk-deployment-configs rev-list -n1 "$MARKER")
            if git -C agk-deployment-configs merge-base --is-ancestor "$MARKER_COMMIT" HEAD \
              && grep -Fxq "stage-version: $VERSION" <<< "$MESSAGE" \
              && grep -Fxq "gitops-commit: $MARKER_COMMIT" <<< "$MESSAGE" \
              && grep -Fxq "stage-config-sha256: $APP_CONFIG_SHA" <<< "$MESSAGE" \
              && grep -Fxq "stage-worker-config-sha256: $WORKER_CONFIG_SHA" <<< "$MESSAGE" \
              && grep -Fxq "quality-repository: $QUALITY_REPOSITORY" <<< "$MESSAGE" \
              && grep -Eq '^quality-run-id: [0-9]+$' <<< "$MESSAGE" \
              && grep -Eq '^stage-deploy-run-id: [0-9]+$' <<< "$MESSAGE"; then
              MATCHING_MARKER="$MARKER"
              break
            fi
          done < <(git -C agk-deployment-configs tag -l \
            "agentic-karl-stage-validated/$VERSION-*" --sort=-creatordate)

          if [ -z "$MATCHING_MARKER" ]; then
            echo "::error::No successful STAGE E2E marker matches $VERSION and the current app/worker GitOps config"
            exit 1
          fi

          echo "Validated STAGE provenance: $MATCHING_MARKER"
          echo "| STAGE validation marker | \`$MATCHING_MARKER\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Import image into AGK prod ACR
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          SOURCE_REGISTRY_ID=$(az acr show \
            --subscription "$AGK_STAGE_SUBSCRIPTION_ID" \
            --name "$AGK_STAGE_ACR_NAME" \
            --query id \
            -o tsv)

          az acr import \
            --subscription "$AGK_PROD_SUBSCRIPTION_ID" \
            --name "$AGK_PROD_ACR_NAME" \
            --registry "$SOURCE_REGISTRY_ID" \
            --source "$AGK_STAGE_IMAGE_REPOSITORY:$VERSION" \
            --image "$AGK_PROD_IMAGE_REPOSITORY:$VERSION" \
            --force

      - name: Verify AGK prod image tag
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          az acr repository show-tags \
            --subscription "$AGK_PROD_SUBSCRIPTION_ID" \
            --name "$AGK_PROD_ACR_NAME" \
            --repository "$AGK_PROD_IMAGE_REPOSITORY" \
            --query "[?@=='$VERSION']" \
            -o tsv | grep -Fx "$VERSION"

      # agk-deployment-configs main is protected (PR required, Sonar "test"
      # check, no direct pushes), so the prod bump is landed via an auto-merged
      # PR instead of a direct `git push origin main`.
      - name: Update AGK prod deployment config values
        working-directory: agk-deployment-configs
        env:
          GH_TOKEN: ${{ env.GITHUB_PAT }}
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          git pull --ff-only origin main
          sed -i -E "s/tag: ['\"]v[0-9]+\\.[0-9]+\\.[0-9]+['\"]/tag: \"$VERSION\"/" "$AGK_PROD_CONFIG_DIRECTORY/values.yaml"
          sed -i -E "/^[[:space:]]+LANGFUSE_RELEASE:/s/['\"]?v[0-9]+\\.[0-9]+\\.[0-9]+['\"]?/\"$VERSION\"/" "$AGK_PROD_CONFIG_DIRECTORY/values.yaml"
          grep -F "LANGFUSE_RELEASE: \"$VERSION\"" "$AGK_PROD_CONFIG_DIRECTORY/values.yaml"

          # [knauf] KK20-195 — bump the prod worker values in lock-step, in the
          # same PR. Guarded: no-op until the prod worker dir exists (deferred to
          # WP1 + WP6 sign-off), so promotions keep working unchanged until then.
          BUMP_PATHS=("$AGK_PROD_CONFIG_DIRECTORY/values.yaml")
          PROD_WORKER_VALUES="$AGK_PROD_WORKER_CONFIG_DIRECTORY/values.yaml"
          if [ -f "$PROD_WORKER_VALUES" ]; then
            sed -i -E "s/tag: ['\"]v[0-9]+\\.[0-9]+\\.[0-9]+['\"]/tag: \"$VERSION\"/" "$PROD_WORKER_VALUES"
            grep -F "tag: \"$VERSION\"" "$PROD_WORKER_VALUES"
            BUMP_PATHS+=("$PROD_WORKER_VALUES")
            echo "Bumping prod worker values $PROD_WORKER_VALUES to $VERSION"
          else
            echo "Prod worker values $PROD_WORKER_VALUES not present — skipping (deferred to WP1/WP6)"
          fi

          BRANCH="release/agk-prod-$VERSION"

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if git diff --quiet -- "${BUMP_PATHS[@]}"; then
            echo "AGK prod deployment config already points at $VERSION"
            echo "| Prod deployment config | already at \`$VERSION\` (no PR needed) |" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git checkout -b "$BRANCH"
          git add "${BUMP_PATHS[@]}"
          git commit -m "Update agentic-karl prod to $VERSION"
          # Plain --force: automation-owned throwaway branch and a fresh clone has
          # no remote-tracking ref, so --force-with-lease would reject re-runs.
          git push --force origin "$BRANCH"

          PR_URL=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create \
              --base main --head "$BRANCH" \
              --title "Update agentic-karl prod to $VERSION" \
              --body "Automated prod GitOps promotion from the agentic-karl promote pipeline (run ${{ github.run_id }}). Promotes the latest validated stage version \`$VERSION\` to prod.")
          fi
          echo "Prod deployment config PR: $PR_URL"

          gh pr merge "$PR_URL" --auto --squash --delete-branch \
            || gh pr merge "$PR_URL" --squash --delete-branch \
            || true

          STATE=""
          for attempt in {1..90}; do
            # Tolerate transient API errors so a blip does not fail a promotion
            # whose PR is about to merge.
            STATE=$(gh pr view "$PR_URL" --json state --jq '.state' 2>/dev/null || echo UNKNOWN)
            echo "Attempt $attempt: PR state=$STATE"
            if [ "$STATE" = "MERGED" ]; then
              break
            fi
            if [ "$STATE" = "CLOSED" ]; then
              echo "Prod deployment config PR was closed without merging"
              exit 1
            fi
            sleep 10
          done

          if [ "$STATE" != "MERGED" ]; then
            echo "Prod deployment config PR did not merge in time (state=$STATE)."
            echo "Auto-merge stays enabled, so it will merge once the 'test' check passes; re-run this job afterwards or check $PR_URL."
            exit 1
          fi

          {
            echo "| Prod deployment config PR | $PR_URL (merged) |"
            echo "| Prod deployment config files | \`$AGK_PROD_CONFIG_DIRECTORY/values.yaml\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refresh AGK prod ArgoCD application
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          ARGOCD_PASSWORD=$(az keyvault secret show \
            --subscription "$AGK_PROD_SUBSCRIPTION_ID" \
            --vault-name "$AGK_ARGOCD_KEY_VAULT_NAME" \
            --name "$AGK_ARGOCD_PASSWORD_SECRET_NAME" \
            --query value \
            -o tsv)
          echo "::add-mask::$ARGOCD_PASSWORD"

          ARGOCD_TOKEN=$(jq -rn --arg password "$ARGOCD_PASSWORD" '{username: "admin", password: $password}' \
            | curl -fsS "https://$AGK_ARGOCD_DOMAIN/api/v1/session" \
                -H "Content-Type: application/json" \
                -d @- \
            | jq -r '.token')
          echo "::add-mask::$ARGOCD_TOKEN"

          refresh_app() {
            local app_name="$1"
            curl -fsS \
              "https://$AGK_ARGOCD_DOMAIN/api/v1/applications/$app_name?refresh=true" \
              -H "Authorization: Bearer $ARGOCD_TOKEN" \
              -H "Accept: application/json" \
              > /dev/null 2>&1 || true
          }

          refresh_app "$AGK_ARGOCD_APP"

          for attempt in {1..60}; do
            APP_JSON=$(curl -fsS \
              "https://$AGK_ARGOCD_DOMAIN/api/v1/applications/$AGK_ARGOCD_APP" \
              -H "Authorization: Bearer $ARGOCD_TOKEN" \
              -H "Accept: application/json" 2>/dev/null || true)

            if [ -z "$APP_JSON" ]; then
              echo "Attempt $attempt: API blip — retrying"
              sleep 10
              continue
            fi

            SYNC_STATUS=$(jq -r '.status.sync.status' <<< "$APP_JSON")
            HEALTH_STATUS=$(jq -r '.status.health.status' <<< "$APP_JSON")
            IMAGE_MATCH=$(jq -r '.status.summary.images[]?' <<< "$APP_JSON" | grep -F "$AGK_PROD_IMAGE_REPOSITORY:$VERSION" || true)

            echo "Attempt $attempt: app sync=$SYNC_STATUS health=$HEALTH_STATUS image=${IMAGE_MATCH:-missing}"

            if [ "$SYNC_STATUS" = "Synced" ] \
              && [ "$HEALTH_STATUS" = "Healthy" ] \
              && [ -n "$IMAGE_MATCH" ]; then
              exit 0
            fi

            refresh_app "$AGK_ARGOCD_APP"
            sleep 10
          done

          echo "AGK prod ArgoCD did not report app $VERSION as Synced/Healthy in time"
          exit 1

      - name: Run PROD health smoke
        env:
          GH_TOKEN: ${{ env.GITHUB_PAT }}
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          CORRELATION_ID="agentic-karl-prod-${{ github.run_id }}-${{ github.run_attempt }}-$VERSION-health"
          run_id=""
          run_url=""

          echo "Dispatching PROD k6 health smoke: correlation_id=$CORRELATION_ID"
          gh workflow run k6-dev-prod-health.yaml \
            --repo "$QUALITY_REPOSITORY" \
            --ref main \
            -f environment=prod \
            -f correlation_id="$CORRELATION_ID"

          for attempt in {1..30}; do
            RUN_JSON=$(gh run list \
              --repo "$QUALITY_REPOSITORY" \
              --workflow k6-dev-prod-health.yaml \
              --event workflow_dispatch \
              --json databaseId,displayTitle,url \
              --limit 30 \
              --jq "map(select(.displayTitle | contains(\"$CORRELATION_ID\"))) | first // empty")

            if [ -n "$RUN_JSON" ]; then
              run_id=$(jq -r '.databaseId' <<< "$RUN_JSON")
              run_url=$(jq -r '.url' <<< "$RUN_JSON")
              break
            fi

            echo "Waiting for PROD health smoke run to appear: attempt=$attempt"
            sleep 10
          done

          if [ -z "$run_id" ]; then
            echo "::error::Timed out finding PROD health smoke run correlation_id=$CORRELATION_ID"
            exit 1
          fi

          echo "PROD health smoke run: $run_url"
          gh run watch "$run_id" --repo "$QUALITY_REPOSITORY" --exit-status
          echo "PROD health smoke passed"
          echo "| PROD health smoke | $run_url |" >> "$GITHUB_STEP_SUMMARY"
