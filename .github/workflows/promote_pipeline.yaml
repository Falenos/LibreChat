name: Deploy Stage to Prod

on:
  workflow_dispatch:
    inputs:
      source-and-destination-environment:
        type: choice
        description: 'Source and destination environments for promotion'
        required: true
        default: 'AGK stage -> AGK prod'
        options:
          - 'AGK stage -> AGK prod'
      version:
        description: 'Version to promote, for example v0.54.0. Defaults to the current AGK stage GitOps tag.'
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.repository }}-promote
  cancel-in-progress: false

jobs:
  promote-agk-stage-to-prod:
    name: Promote AGK stage to prod
    if: ${{ inputs.source-and-destination-environment == 'AGK stage -> AGK prod' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: https://agentic-karl.knauf.com
    env:
      CT_SUBSCRIPTION_ID: ad3f0a71-cc5b-4d00-8289-23623cf2064c
      AGK_STAGE_SUBSCRIPTION_ID: ad3f0a71-cc5b-4d00-8289-23623cf2064c
      AGK_PROD_SUBSCRIPTION_ID: e0515a24-7205-481b-b657-944901020e32
      AGK_STAGE_ACR_NAME: acragkhubnonprod001
      AGK_PROD_ACR_NAME: acragkhubprod001
      AGK_STAGE_IMAGE_REPOSITORY: agentic-karl-stage/agentic-karl
      AGK_PROD_IMAGE_REPOSITORY: agentic-karl-prod/agentic-karl
      AGK_CONFIG_REPOSITORY: Knauf-Group/agk-deployment-configs
      AGK_STAGE_CONFIG_DIRECTORY: agentic-karl/stage/services/agentic-karl
      AGK_STAGE_WORKER_CONFIG_DIRECTORY: agentic-karl/stage/services/agentic-karl-worker
      AGK_STAGE_ARGOCD_DOMAIN: argocd.agk.nonprod.knauf.digital
      AGK_STAGE_ARGOCD_APP: agentic-karl-stage-agentic-karl
      AGK_STAGE_WORKER_ARGOCD_APP: agentic-karl-stage-agentic-karl-worker
      AGK_STAGE_ARGOCD_KEY_VAULT_NAME: kv-agk-hub-nonprod-001
      AGK_STAGE_ARGOCD_PASSWORD_SECRET_NAME: argocd-admin-agk-nonprod
      AGK_PROD_CONFIG_DIRECTORY: agentic-karl/prod/services/agentic-karl
      AGK_PROD_MEILI_CONFIG_DIRECTORY: agentic-karl/prod/services/agentic-karl-meilisearch
      # [knauf] KK20-195 — prod worker values, bumped in lock-step with the app.
      # Guarded by a file-exists check: the prod worker dir is intentionally NOT
      # created until WP1 + WP6 sign-off, so this stays a no-op until then.
      AGK_PROD_WORKER_CONFIG_DIRECTORY: agentic-karl/prod/services/agentic-karl-worker
      AGK_PROD_DOMAIN: https://agentic-karl.knauf.com
      AGK_ARGOCD_DOMAIN: argocd.agk.prod.knauf.digital
      AGK_ARGOCD_APP: agentic-karl-prod-agentic-karl
      AGK_ARGOCD_KEY_VAULT_NAME: kv-agk-hub-prod-001
      AGK_ARGOCD_PASSWORD_SECRET_NAME: argocd-admin-agk-prod
      QUALITY_REPOSITORY: Knauf-Group/agentic-karl-quality
    steps:
      # [knauf] KK20-195 — validate the version input shape only. There is no
      # longer an old stage-run/provenance artifact to trust: this pipeline
      # snapshots and re-tests STAGE live, every time it runs (see the
      # "Snapshot STAGE" and "Run STAGE E2E" steps below).
      - name: Validate workflow inputs
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ] && ! grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' <<< "$INPUT_VERSION"; then
            echo "::error::Invalid version"
            exit 1
          fi

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get promotion support secrets
        run: |
          set -euo pipefail

          GITHUB_PAT=$(az keyvault secret show \
            --subscription "$CT_SUBSCRIPTION_ID" \
            --vault-name kv-ct-shared-devops-001 \
            --name GITHUB-PAT \
            --query value \
            -o tsv)
          echo "::add-mask::$GITHUB_PAT"
          echo "GITHUB_PAT=$GITHUB_PAT" >> "$GITHUB_ENV"

      - name: Check out app repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check out AGK deployment config repository
        run: git clone "https://x-access-token:$GITHUB_PAT@github.com/$AGK_CONFIG_REPOSITORY.git" agk-deployment-configs

      - name: Determine version to promote
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          APP_VALUES="agk-deployment-configs/$AGK_STAGE_CONFIG_DIRECTORY/values.yaml"
          WORKER_VALUES="agk-deployment-configs/$AGK_STAGE_WORKER_CONFIG_DIRECTORY/values.yaml"
          test -f "$APP_VALUES"
          test -f "$WORKER_VALUES"

          STAGE_VERSION=$(awk '$1 == "tag:" { print $2; exit }' "$APP_VALUES" | tr -d "\"'")
          STAGE_WORKER_VERSION=$(awk '$1 == "tag:" { print $2; exit }' "$WORKER_VALUES" | tr -d "\"'")
          VERSION="$STAGE_VERSION"

          if [ "$STAGE_WORKER_VERSION" != "$STAGE_VERSION" ]; then
            echo "::error::STAGE app tag $STAGE_VERSION and worker tag $STAGE_WORKER_VERSION differ"
            exit 1
          fi

          if [ -n "$INPUT_VERSION" ] && [ "$INPUT_VERSION" != "$STAGE_VERSION" ]; then
            echo "::error::Requested version $INPUT_VERSION is not the current STAGE GitOps tag $STAGE_VERSION"
            exit 1
          fi

          if ! grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' <<< "$VERSION"; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

          echo "Version to promote: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # [knauf] KK20-195 — validate prod GitOps config shape up front. This is
      # unchanged from the old provenance-based flow; it doesn't depend on any
      # STAGE snapshot.
      - name: Validate prod config shape
        run: |
          set -euo pipefail

          test -f "agk-deployment-configs/$AGK_STAGE_CONFIG_DIRECTORY/values.yaml"
          test -f "agk-deployment-configs/$AGK_STAGE_WORKER_CONFIG_DIRECTORY/values.yaml"
          test -f "agk-deployment-configs/$AGK_PROD_CONFIG_DIRECTORY/values.yaml"
          test -f "agk-deployment-configs/$AGK_PROD_MEILI_CONFIG_DIRECTORY/values.yaml"
          grep -F "repository: $AGK_STAGE_ACR_NAME.azurecr.io/$AGK_STAGE_IMAGE_REPOSITORY" \
            "agk-deployment-configs/$AGK_STAGE_CONFIG_DIRECTORY/values.yaml"
          grep -F "repository: $AGK_PROD_ACR_NAME.azurecr.io/$AGK_PROD_IMAGE_REPOSITORY" \
            "agk-deployment-configs/$AGK_PROD_CONFIG_DIRECTORY/values.yaml"
          grep -F "DOMAIN_SERVER: \"$AGK_PROD_DOMAIN\"" \
            "agk-deployment-configs/$AGK_PROD_CONFIG_DIRECTORY/values.yaml"
          grep -F "MEILI_MASTER_KEY: AGK-MEILI-MASTER-KEY" \
            "agk-deployment-configs/$AGK_PROD_CONFIG_DIRECTORY/values.yaml"
          grep -F "MEILI_MASTER_KEY: AGK-MEILI-MASTER-KEY" \
            "agk-deployment-configs/$AGK_PROD_MEILI_CONFIG_DIRECTORY/values.yaml"

      # [knauf] KK20-195 — replaces the old "trust an old provenance artifact"
      # model. Snapshots STAGE's live state (image digest, both git revisions,
      # and content-hash of the app+worker values.yaml at the current STAGE
      # config paths) directly from ArgoCD/ACR. This becomes the "candidate"
      # snapshot that an identical "after" snapshot must match once fresh E2E
      # has run, before promoting.
      - name: Snapshot STAGE state (before E2E)
        id: stage-before
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          EXPECTED_IMAGE="$AGK_STAGE_IMAGE_REPOSITORY:$VERSION"

          ARGOCD_PASSWORD=$(az keyvault secret show \
            --subscription "$AGK_STAGE_SUBSCRIPTION_ID" \
            --vault-name "$AGK_STAGE_ARGOCD_KEY_VAULT_NAME" \
            --name "$AGK_STAGE_ARGOCD_PASSWORD_SECRET_NAME" \
            --query value -o tsv)
          echo "::add-mask::$ARGOCD_PASSWORD"
          ARGOCD_TOKEN=$(jq -rn --arg password "$ARGOCD_PASSWORD" '{username: "admin", password: $password}' \
            | curl -fsS "https://$AGK_STAGE_ARGOCD_DOMAIN/api/v1/session" \
                -H "Content-Type: application/json" -d @- | jq -er '.token')
          echo "::add-mask::$ARGOCD_TOKEN"

          APP_JSON=$(curl -fsS "https://$AGK_STAGE_ARGOCD_DOMAIN/api/v1/applications/$AGK_STAGE_ARGOCD_APP" \
            -H "Authorization: ******" -H "Accept: application/json")
          WORKER_JSON=$(curl -fsS "https://$AGK_STAGE_ARGOCD_DOMAIN/api/v1/applications/$AGK_STAGE_WORKER_ARGOCD_APP" \
            -H "Authorization: ******" -H "Accept: application/json")

          for STATE in "$APP_JSON" "$WORKER_JSON"; do
            jq -e --arg image "$EXPECTED_IMAGE" \
              '.status.sync.status == "Synced" and .status.health.status == "Healthy" and
               any(.status.summary.images[]?; . == $image or endswith("/" + $image))' \
              <<< "$STATE" > /dev/null
          done

          revision_for_repo() {
            local repository_suffix="$1"
            jq -er --arg suffix "$repository_suffix" '
              .status.sync.comparedTo.sources as $sources
              | .status.sync.revisions as $revisions
              | [range(0; ($sources | length)) as $index
                 | select($sources[$index].repoURL | endswith($suffix))
                 | $revisions[$index]]
              | if length == 1 then .[0] else error("expected one matching Argo source") end
            ' <<< "$APP_JSON"
          }
          APP_REVISION=$(revision_for_repo 'Knauf-Group/agentic-karl.git')
          APP_GITOPS_REVISION=$(revision_for_repo 'Knauf-Group/agk-deployment-configs.git')
          WORKER_REVISION=$(jq -er '.status.sync.revision' <<< "$WORKER_JSON")
          grep -Eq '^[0-9a-f]{40}$' <<< "$APP_REVISION"
          grep -Eq '^[0-9a-f]{40}$' <<< "$APP_GITOPS_REVISION"
          grep -Eq '^[0-9a-f]{40}$' <<< "$WORKER_REVISION"

          IMAGE_DIGEST=$(az acr repository show \
            --subscription "$AGK_STAGE_SUBSCRIPTION_ID" --name "$AGK_STAGE_ACR_NAME" \
            --image "$EXPECTED_IMAGE" --query digest -o tsv)
          grep -Eq '^sha256:[0-9a-f]{64}$' <<< "$IMAGE_DIGEST"

          git -C agk-deployment-configs fetch origin "$APP_GITOPS_REVISION" "$WORKER_REVISION"
          APP_CONFIG_SHA=$(git -C agk-deployment-configs \
            show "${APP_GITOPS_REVISION}:$AGK_STAGE_CONFIG_DIRECTORY/values.yaml" | sha256sum | awk '{print $1}')
          WORKER_CONFIG_SHA=$(git -C agk-deployment-configs \
            show "${WORKER_REVISION}:$AGK_STAGE_WORKER_CONFIG_DIRECTORY/values.yaml" | sha256sum | awk '{print $1}')

          export ARGOCD_BASE_URL="https://$AGK_STAGE_ARGOCD_DOMAIN"
          export ARGOCD_TOKEN EXPECTED_IMAGE
          export EXPECTED_DIGEST="$IMAGE_DIGEST"
          APP_RUNTIME_DIGEST=$(ARGOCD_APPLICATION="$AGK_STAGE_ARGOCD_APP" \
            .github/scripts/verify-argocd-runtime-digest.sh)
          WORKER_RUNTIME_DIGEST=$(ARGOCD_APPLICATION="$AGK_STAGE_WORKER_ARGOCD_APP" \
            .github/scripts/verify-argocd-runtime-digest.sh)

          {
            echo "image-digest=$IMAGE_DIGEST"
            echo "app-revision=$APP_REVISION"
            echo "app-gitops-revision=$APP_GITOPS_REVISION"
            echo "worker-revision=$WORKER_REVISION"
            echo "app-config-sha=$APP_CONFIG_SHA"
            echo "worker-config-sha=$WORKER_CONFIG_SHA"
            echo "app-runtime-digest=$APP_RUNTIME_DIGEST"
            echo "worker-runtime-digest=$WORKER_RUNTIME_DIGEST"
          } >> "$GITHUB_OUTPUT"
          echo "| STAGE snapshot (before E2E) | digest \`$IMAGE_DIGEST\` |" >> "$GITHUB_STEP_SUMMARY"

      # [knauf] KK20-195 — fresh, live E2E run against STAGE every time this
      # pipeline is triggered. No old run's results or provenance artifact are
      # reused: this is the actual gate to prod.
      - name: Run STAGE E2E tests
        id: stage-e2e
        run: |
          set -euo pipefail
          export GH_TOKEN="$GITHUB_PAT"
          VERSION="${{ steps.version.outputs.version }}"
          GITOPS_REVISION="${{ steps.stage-before.outputs.app-gitops-revision }}"
          CORRELATION_ID="agentic-karl-promote-${{ github.run_id }}-${{ github.run_attempt }}-$VERSION-$(uuidgen)-e2e"
          run_id=""
          run_url=""

          echo "Dispatching STAGE E2E correlation_id=$CORRELATION_ID"
          gh workflow run stage-e2e.yaml \
            --repo "$QUALITY_REPOSITORY" \
            --ref main \
            -f correlation_id="$CORRELATION_ID" \
            -f application_version="$VERSION" \
            -f worker_version="$VERSION" \
            -f gitops_revision="$GITOPS_REVISION"

          for attempt in {1..30}; do
            RUN_JSON=$(gh run list \
              --repo "$QUALITY_REPOSITORY" \
              --workflow stage-e2e.yaml \
              --event workflow_dispatch \
              --json databaseId,displayTitle,url \
              --limit 50 \
              --jq "map(select(.displayTitle == \"Stage E2E $CORRELATION_ID\")) | first // empty")

            if [ -n "$RUN_JSON" ]; then
              run_id=$(jq -r '.databaseId' <<< "$RUN_JSON")
              run_url=$(jq -r '.url' <<< "$RUN_JSON")
              break
            fi

            echo "Waiting for STAGE E2E run to appear: attempt=$attempt"
            sleep 10
          done

          if [ -z "$run_id" ]; then
            echo "::error::Timed out finding STAGE E2E run correlation_id=$CORRELATION_ID"
            exit 1
          fi

          echo "STAGE E2E run: $run_url"
          gh run watch "$run_id" --repo "$QUALITY_REPOSITORY" --exit-status
          echo "STAGE E2E passed"
          echo "| STAGE E2E (fresh, this run) | $run_url |" >> "$GITHUB_STEP_SUMMARY"

      # [knauf] KK20-195 — re-snapshot STAGE using the identical logic as the
      # "before" snapshot, and compare byte-for-byte. If STAGE was redeployed
      # during/after the E2E run, this fails the job for safety — we never
      # promote a version that wasn't stably tested end-to-end.
      - name: Snapshot STAGE state (after E2E) and verify no drift
        env:
          EXPECTED_DIGEST: ${{ steps.stage-before.outputs.image-digest }}
          EXPECTED_APP_REVISION: ${{ steps.stage-before.outputs.app-revision }}
          EXPECTED_APP_GITOPS_REVISION: ${{ steps.stage-before.outputs.app-gitops-revision }}
          EXPECTED_WORKER_REVISION: ${{ steps.stage-before.outputs.worker-revision }}
          EXPECTED_APP_CONFIG_SHA: ${{ steps.stage-before.outputs.app-config-sha }}
          EXPECTED_WORKER_CONFIG_SHA: ${{ steps.stage-before.outputs.worker-config-sha }}
          EXPECTED_APP_RUNTIME_DIGEST: ${{ steps.stage-before.outputs.app-runtime-digest }}
          EXPECTED_WORKER_RUNTIME_DIGEST: ${{ steps.stage-before.outputs.worker-runtime-digest }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          EXPECTED_IMAGE="$AGK_STAGE_IMAGE_REPOSITORY:$VERSION"

          CURRENT_DIGEST=$(az acr repository show \
            --subscription "$AGK_STAGE_SUBSCRIPTION_ID" --name "$AGK_STAGE_ACR_NAME" \
            --image "$EXPECTED_IMAGE" --query digest -o tsv)
          if [ "$CURRENT_DIGEST" != "$EXPECTED_DIGEST" ]; then
            echo "::error::STAGE was redeployed during/after the E2E run (image digest changed from $EXPECTED_DIGEST to $CURRENT_DIGEST) — aborting promotion for safety. Re-run this workflow to test the new version fresh."
            exit 1
          fi

          ARGOCD_PASSWORD=$(az keyvault secret show \
            --subscription "$AGK_STAGE_SUBSCRIPTION_ID" \
            --vault-name "$AGK_STAGE_ARGOCD_KEY_VAULT_NAME" \
            --name "$AGK_STAGE_ARGOCD_PASSWORD_SECRET_NAME" \
            --query value -o tsv)
          ARGOCD_TOKEN=$(jq -rn --arg password "$ARGOCD_PASSWORD" '{username: "admin", password: $password}' \
            | curl -fsS "https://$AGK_STAGE_ARGOCD_DOMAIN/api/v1/session" \
                -H "Content-Type: application/json" -d @- | jq -er '.token')
          echo "::add-mask::$ARGOCD_TOKEN"
          APP_JSON=$(curl -fsS "https://$AGK_STAGE_ARGOCD_DOMAIN/api/v1/applications/$AGK_STAGE_ARGOCD_APP" \
            -H "Authorization: ******" -H "Accept: application/json")
          WORKER_JSON=$(curl -fsS "https://$AGK_STAGE_ARGOCD_DOMAIN/api/v1/applications/$AGK_STAGE_WORKER_ARGOCD_APP" \
            -H "Authorization: ******" -H "Accept: application/json")

          for STATE in "$APP_JSON" "$WORKER_JSON"; do
            jq -e --arg image "$EXPECTED_IMAGE" \
              '.status.sync.status == "Synced" and .status.health.status == "Healthy" and
               any(.status.summary.images[]?; . == $image or endswith("/" + $image))' \
              <<< "$STATE" > /dev/null
          done

          revision_for_repo() {
            local repository_suffix="$1"
            jq -er --arg suffix "$repository_suffix" '
              .status.sync.comparedTo.sources as $sources
              | .status.sync.revisions as $revisions
              | [range(0; ($sources | length)) as $index
                 | select($sources[$index].repoURL | endswith($suffix))
                 | $revisions[$index]]
              | if length == 1 then .[0] else error("expected one matching Argo source") end
            ' <<< "$APP_JSON"
          }
          CURRENT_APP_REVISION=$(revision_for_repo 'Knauf-Group/agentic-karl.git')
          CURRENT_APP_GITOPS_REVISION=$(revision_for_repo 'Knauf-Group/agk-deployment-configs.git')
          CURRENT_WORKER_REVISION=$(jq -er '.status.sync.revision' <<< "$WORKER_JSON")

          # [knauf] KK20-195 — content-hash-based drift check (brought forward
          # from PR #290's approach), rather than brittle whole-repo git SHA
          # equality: agk-deployment-configs is a monorepo shared by
          # dev/stage/prod and multiple services, so unrelated commits
          # elsewhere in the repo advance ArgoCD's reported comparedTo.sources
          # revision even when nothing under the STAGE app/worker config paths
          # changed. Comparing the live config-path content hash instead only
          # flags real drift in the paths that matter to this promotion.
          git -C agk-deployment-configs fetch origin "$CURRENT_APP_GITOPS_REVISION" "$CURRENT_WORKER_REVISION"
          CURRENT_APP_CONFIG_SHA=$(git -C agk-deployment-configs \
            show "${CURRENT_APP_GITOPS_REVISION}:$AGK_STAGE_CONFIG_DIRECTORY/values.yaml" | sha256sum | awk '{print $1}')
          CURRENT_WORKER_CONFIG_SHA=$(git -C agk-deployment-configs \
            show "${CURRENT_WORKER_REVISION}:$AGK_STAGE_WORKER_CONFIG_DIRECTORY/values.yaml" | sha256sum | awk '{print $1}')

          export ARGOCD_BASE_URL="https://$AGK_STAGE_ARGOCD_DOMAIN"
          export ARGOCD_TOKEN EXPECTED_IMAGE EXPECTED_DIGEST
          APP_RUNTIME_DIGEST=$(ARGOCD_APPLICATION="$AGK_STAGE_ARGOCD_APP" \
            .github/scripts/verify-argocd-runtime-digest.sh)
          WORKER_RUNTIME_DIGEST=$(ARGOCD_APPLICATION="$AGK_STAGE_WORKER_ARGOCD_APP" \
            .github/scripts/verify-argocd-runtime-digest.sh)

          DRIFTED=""
          [ "$CURRENT_APP_REVISION" = "$EXPECTED_APP_REVISION" ] || DRIFTED="app_revision"
          [ "$CURRENT_APP_CONFIG_SHA" = "$EXPECTED_APP_CONFIG_SHA" ] || DRIFTED="${DRIFTED:+$DRIFTED,}app_config_sha256"
          [ "$CURRENT_WORKER_CONFIG_SHA" = "$EXPECTED_WORKER_CONFIG_SHA" ] || DRIFTED="${DRIFTED:+$DRIFTED,}worker_config_sha256"
          [ "$APP_RUNTIME_DIGEST" = "$EXPECTED_APP_RUNTIME_DIGEST" ] || DRIFTED="${DRIFTED:+$DRIFTED,}app_runtime_digest"
          [ "$WORKER_RUNTIME_DIGEST" = "$EXPECTED_WORKER_RUNTIME_DIGEST" ] || DRIFTED="${DRIFTED:+$DRIFTED,}worker_runtime_digest"

          if [ -n "$DRIFTED" ]; then
            echo "::error::STAGE state changed during/after the E2E run (drifted fields: $DRIFTED) — aborting promotion for safety. STAGE was redeployed while being tested, so this run cannot promote a stably-tested version. Re-run this workflow to test the new version fresh."
            exit 1
          fi

          echo "Verified STAGE state is byte-for-byte identical before and after the fresh E2E run"
          echo "| STAGE snapshot (after E2E) | matches before-E2E snapshot — no drift |" >> "$GITHUB_STEP_SUMMARY"

      - name: Import image into AGK prod ACR
        env:
          IMAGE_DIGEST: ${{ steps.stage-before.outputs.image-digest }}
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          SOURCE_REGISTRY_ID=$(az acr show \
            --subscription "$AGK_STAGE_SUBSCRIPTION_ID" \
            --name "$AGK_STAGE_ACR_NAME" \
            --query id \
            -o tsv)

          EXISTING_PROD_DIGEST=$(az acr repository show \
            --subscription "$AGK_PROD_SUBSCRIPTION_ID" --name "$AGK_PROD_ACR_NAME" \
            --image "$AGK_PROD_IMAGE_REPOSITORY:$VERSION" --query digest -o tsv 2>/dev/null || true)
          if [ -n "$EXISTING_PROD_DIGEST" ]; then
            if [ "$EXISTING_PROD_DIGEST" != "$IMAGE_DIGEST" ]; then
              echo "::error::Refusing to retarget immutable PROD tag $VERSION from $EXISTING_PROD_DIGEST to $IMAGE_DIGEST"
              exit 1
            fi
            echo "PROD tag $VERSION already points at $IMAGE_DIGEST; reusing it"
          else
            az acr import \
              --subscription "$AGK_PROD_SUBSCRIPTION_ID" \
              --name "$AGK_PROD_ACR_NAME" \
              --registry "$SOURCE_REGISTRY_ID" \
              --source "$AGK_STAGE_IMAGE_REPOSITORY@$IMAGE_DIGEST" \
              --image "$AGK_PROD_IMAGE_REPOSITORY:$VERSION"
          fi

      - name: Verify AGK prod image tag
        env:
          EXPECTED_DIGEST: ${{ steps.stage-before.outputs.image-digest }}
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          PROD_DIGEST=$(az acr repository show \
            --subscription "$AGK_PROD_SUBSCRIPTION_ID" \
            --name "$AGK_PROD_ACR_NAME" \
            --image "$AGK_PROD_IMAGE_REPOSITORY:$VERSION" \
            --query digest -o tsv)
          if [ "$PROD_DIGEST" != "$EXPECTED_DIGEST" ]; then
            echo "::error::Prod digest $PROD_DIGEST differs from tested digest $EXPECTED_DIGEST"
            exit 1
          fi

      - name: Lock AGK prod image
        env:
          EXPECTED_DIGEST: ${{ steps.stage-before.outputs.image-digest }}
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          for IMAGE in \
            "$AGK_PROD_IMAGE_REPOSITORY@$EXPECTED_DIGEST" \
            "$AGK_PROD_IMAGE_REPOSITORY:$VERSION"; do
            az acr repository update \
              --subscription "$AGK_PROD_SUBSCRIPTION_ID" \
              --name "$AGK_PROD_ACR_NAME" \
              --image "$IMAGE" \
              --delete-enabled false \
              --write-enabled false \
              -o none

            DELETE_ENABLED=$(az acr repository show \
              --subscription "$AGK_PROD_SUBSCRIPTION_ID" \
              --name "$AGK_PROD_ACR_NAME" \
              --image "$IMAGE" \
              --query changeableAttributes.deleteEnabled -o tsv)
            WRITE_ENABLED=$(az acr repository show \
              --subscription "$AGK_PROD_SUBSCRIPTION_ID" \
              --name "$AGK_PROD_ACR_NAME" \
              --image "$IMAGE" \
              --query changeableAttributes.writeEnabled -o tsv)
            if [ "$DELETE_ENABLED" != "false" ] || [ "$WRITE_ENABLED" != "false" ]; then
              echo "::error::Failed to lock PROD image $IMAGE"
              exit 1
            fi
          done

      # agk-deployment-configs main is protected (PR required, Sonar "test"
      # check, no direct pushes), so the prod bump is landed via an auto-merged
      # PR instead of a direct `git push origin main`.
      - name: Update AGK prod deployment config values
        working-directory: agk-deployment-configs
        run: |
          set -euo pipefail
          export GH_TOKEN="$GITHUB_PAT"

          VERSION="${{ steps.version.outputs.version }}"
          sed -i -E "s/tag: ['\"]v[0-9]+\\.[0-9]+\\.[0-9]+['\"]/tag: \"$VERSION\"/" "$AGK_PROD_CONFIG_DIRECTORY/values.yaml"
          sed -i -E "/^[[:space:]]+LANGFUSE_RELEASE:/s/['\"]?v[0-9]+\\.[0-9]+\\.[0-9]+['\"]?/\"$VERSION\"/" "$AGK_PROD_CONFIG_DIRECTORY/values.yaml"
          grep -F "LANGFUSE_RELEASE: \"$VERSION\"" "$AGK_PROD_CONFIG_DIRECTORY/values.yaml"

          # [knauf] KK20-195 — bump the prod worker values in lock-step, in the
          # same PR. Guarded: no-op until the prod worker dir exists (deferred to
          # WP1 + WP6 sign-off), so promotions keep working unchanged until then.
          BUMP_PATHS=("$AGK_PROD_CONFIG_DIRECTORY/values.yaml")
          PROD_WORKER_VALUES="$AGK_PROD_WORKER_CONFIG_DIRECTORY/values.yaml"
          if [ -f "$PROD_WORKER_VALUES" ]; then
            sed -i -E "s/tag: ['\"]v[0-9]+\\.[0-9]+\\.[0-9]+['\"]/tag: \"$VERSION\"/" "$PROD_WORKER_VALUES"
            grep -F "tag: \"$VERSION\"" "$PROD_WORKER_VALUES"
            BUMP_PATHS+=("$PROD_WORKER_VALUES")
            echo "Bumping prod worker values $PROD_WORKER_VALUES to $VERSION"
          else
            echo "Prod worker values $PROD_WORKER_VALUES not present — skipping (deferred to WP1/WP6)"
          fi

          BRANCH="release/agk-prod-$VERSION"

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if git diff --quiet -- "${BUMP_PATHS[@]}"; then
            echo "AGK prod deployment config already points at $VERSION"
            echo "| Prod deployment config | already at \`$VERSION\` (no PR needed) |" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git checkout -b "$BRANCH"
          git add "${BUMP_PATHS[@]}"
          git commit -m "Update agentic-karl prod to $VERSION"
          # Plain --force: automation-owned throwaway branch and a fresh clone has
          # no remote-tracking ref, so --force-with-lease would reject re-runs.
          git push --force origin "$BRANCH"

          PR_URL=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create \
              --base main --head "$BRANCH" \
              --title "Update agentic-karl prod to $VERSION" \
              --body "Automated prod GitOps promotion from the agentic-karl promote pipeline (run ${{ github.run_id }}). Promotes the latest validated stage version \`$VERSION\` to prod.")
          fi
          echo "Prod deployment config PR: $PR_URL"

          gh pr merge "$PR_URL" --auto --squash --delete-branch \
            || gh pr merge "$PR_URL" --squash --delete-branch \
            || true

          STATE=""
          for attempt in {1..90}; do
            # Tolerate transient API errors so a blip does not fail a promotion
            # whose PR is about to merge.
            STATE=$(gh pr view "$PR_URL" --json state --jq '.state' 2>/dev/null || echo UNKNOWN)
            echo "Attempt $attempt: PR state=$STATE"
            if [ "$STATE" = "MERGED" ]; then
              break
            fi
            if [ "$STATE" = "CLOSED" ]; then
              echo "Prod deployment config PR was closed without merging"
              exit 1
            fi
            sleep 10
          done

          if [ "$STATE" != "MERGED" ]; then
            echo "Prod deployment config PR did not merge in time (state=$STATE)."
            echo "Auto-merge stays enabled, so it will merge once the 'test' check passes; re-run this job afterwards or check $PR_URL."
            exit 1
          fi

          {
            echo "| Prod deployment config PR | $PR_URL (merged) |"
            echo "| Prod deployment config files | \`$AGK_PROD_CONFIG_DIRECTORY/values.yaml\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refresh AGK prod ArgoCD application
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          ARGOCD_PASSWORD=$(az keyvault secret show \
            --subscription "$AGK_PROD_SUBSCRIPTION_ID" \
            --vault-name "$AGK_ARGOCD_KEY_VAULT_NAME" \
            --name "$AGK_ARGOCD_PASSWORD_SECRET_NAME" \
            --query value \
            -o tsv)
          echo "::add-mask::$ARGOCD_PASSWORD"

          ARGOCD_TOKEN=$(jq -rn --arg password "$ARGOCD_PASSWORD" '{username: "admin", password: $password}' \
            | curl -fsS "https://$AGK_ARGOCD_DOMAIN/api/v1/session" \
                -H "Content-Type: application/json" \
                -d @- \
            | jq -r '.token')
          echo "::add-mask::$ARGOCD_TOKEN"

          refresh_app() {
            local app_name="$1"
            curl -fsS \
              "https://$AGK_ARGOCD_DOMAIN/api/v1/applications/$app_name?refresh=true" \
              -H "Authorization: Bearer $ARGOCD_TOKEN" \
              -H "Accept: application/json" \
              > /dev/null 2>&1 || true
          }

          refresh_app "$AGK_ARGOCD_APP"

          for attempt in {1..60}; do
            APP_JSON=$(curl -fsS \
              "https://$AGK_ARGOCD_DOMAIN/api/v1/applications/$AGK_ARGOCD_APP" \
              -H "Authorization: Bearer $ARGOCD_TOKEN" \
              -H "Accept: application/json" 2>/dev/null || true)

            if [ -z "$APP_JSON" ]; then
              echo "Attempt $attempt: API blip — retrying"
              sleep 10
              continue
            fi

            SYNC_STATUS=$(jq -r '.status.sync.status' <<< "$APP_JSON")
            HEALTH_STATUS=$(jq -r '.status.health.status' <<< "$APP_JSON")
            IMAGE_MATCH=$(jq -r '.status.summary.images[]?' <<< "$APP_JSON" | grep -F "$AGK_PROD_IMAGE_REPOSITORY:$VERSION" || true)

            echo "Attempt $attempt: app sync=$SYNC_STATUS health=$HEALTH_STATUS image=${IMAGE_MATCH:-missing}"

            if [ "$SYNC_STATUS" = "Synced" ] \
              && [ "$HEALTH_STATUS" = "Healthy" ] \
              && [ -n "$IMAGE_MATCH" ]; then
              exit 0
            fi

            refresh_app "$AGK_ARGOCD_APP"
            sleep 10
          done

          echo "AGK prod ArgoCD did not report app $VERSION as Synced/Healthy in time"
          exit 1

      - name: Run PROD health smoke
        run: |
          set -euo pipefail
          export GH_TOKEN="$GITHUB_PAT"

          VERSION="${{ steps.version.outputs.version }}"
          CORRELATION_ID="agentic-karl-prod-${{ github.run_id }}-${{ github.run_attempt }}-$VERSION-health"
          run_id=""
          run_url=""

          echo "Dispatching PROD k6 health smoke: correlation_id=$CORRELATION_ID"
          gh workflow run k6-dev-prod-health.yaml \
            --repo "$QUALITY_REPOSITORY" \
            --ref main \
            -f environment=prod \
            -f correlation_id="$CORRELATION_ID"

          for attempt in {1..30}; do
            RUN_JSON=$(gh run list \
              --repo "$QUALITY_REPOSITORY" \
              --workflow k6-dev-prod-health.yaml \
              --event workflow_dispatch \
              --json databaseId,displayTitle,url \
              --limit 30 \
              --jq "map(select(.displayTitle | contains(\"$CORRELATION_ID\"))) | first // empty")

            if [ -n "$RUN_JSON" ]; then
              run_id=$(jq -r '.databaseId' <<< "$RUN_JSON")
              run_url=$(jq -r '.url' <<< "$RUN_JSON")
              break
            fi

            echo "Waiting for PROD health smoke run to appear: attempt=$attempt"
            sleep 10
          done

          if [ -z "$run_id" ]; then
            echo "::error::Timed out finding PROD health smoke run correlation_id=$CORRELATION_ID"
            exit 1
          fi

          echo "PROD health smoke run: $run_url"
          gh run watch "$run_id" --repo "$QUALITY_REPOSITORY" --exit-status
          echo "PROD health smoke passed"
          echo "| PROD health smoke | $run_url |" >> "$GITHUB_STEP_SUMMARY"
