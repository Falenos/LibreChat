name: Promote Pipeline

on:
  workflow_dispatch:
    inputs:
      source-and-destination-environment:
        type: choice
        description: 'Source and destination environments for promotion'
        required: true
        default: 'AGK dev -> AGK prod'
        options:
          - 'AGK dev -> AGK prod'
      version:
        description: 'Version to promote, for example v0.54.0. Defaults to the current AGK dev GitOps tag.'
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.repository }}-release
  cancel-in-progress: false

jobs:
  promote-agk-dev-to-prod:
    name: Promote AGK dev to prod
    if: ${{ inputs.source-and-destination-environment == 'AGK dev -> AGK prod' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://agentic-karl.knauf.com
    env:
      CT_SUBSCRIPTION_ID: ad3f0a71-cc5b-4d00-8289-23623cf2064c
      AGK_DEV_SUBSCRIPTION_ID: ad3f0a71-cc5b-4d00-8289-23623cf2064c
      AGK_PROD_SUBSCRIPTION_ID: e0515a24-7205-481b-b657-944901020e32
      AGK_DEV_ACR_NAME: acragkhubnonprod001
      AGK_PROD_ACR_NAME: acragkhubprod001
      AGK_DEV_IMAGE_REPOSITORY: agentic-karl-dev/agentic-karl
      AGK_PROD_IMAGE_REPOSITORY: agentic-karl-prod/agentic-karl
      AGK_DEV_RAG_IMAGE_REPOSITORY: agentic-karl-dev/agentic-karl-rag-api
      AGK_PROD_RAG_IMAGE_REPOSITORY: agentic-karl-prod/agentic-karl-rag-api
      AGK_CONFIG_REPOSITORY: Knauf-Group/agk-deployment-configs
      AGK_DEV_CONFIG_DIRECTORY: agentic-karl/dev/services/agentic-karl
      AGK_PROD_CONFIG_DIRECTORY: agentic-karl/prod/services/agentic-karl
      AGK_DEV_RAG_CONFIG_DIRECTORY: agentic-karl/dev/services/agentic-karl-rag-api
      AGK_PROD_RAG_CONFIG_DIRECTORY: agentic-karl/prod/services/agentic-karl-rag-api
      AGK_PROD_MEILI_CONFIG_DIRECTORY: agentic-karl/prod/services/agentic-karl-meilisearch
      AGK_PROD_DOMAIN: https://agentic-karl.knauf.com
      AGK_ARGOCD_DOMAIN: argocd.agk.prod.knauf.digital
      AGK_ARGOCD_APP: agentic-karl-prod-agentic-karl
      AGK_ARGOCD_RAG_APP: agentic-karl-prod-agentic-karl-rag-api
      AGK_ARGOCD_KEY_VAULT_NAME: kv-agk-hub-prod-001
      AGK_ARGOCD_PASSWORD_SECRET_NAME: argocd-admin-agk-prod
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get promotion support secrets
        run: |
          set -euo pipefail

          GITHUB_PAT=$(az keyvault secret show \
            --subscription "$CT_SUBSCRIPTION_ID" \
            --vault-name kv-ct-shared-devops-001 \
            --name GITHUB-PAT \
            --query value \
            -o tsv)
          echo "::add-mask::$GITHUB_PAT"
          echo "GITHUB_PAT=$GITHUB_PAT" >> "$GITHUB_ENV"

      - name: Check out app repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Configure app repository credentials
        run: git remote set-url origin "https://x-access-token:$GITHUB_PAT@github.com/${GITHUB_REPOSITORY}.git"

      - name: Check out AGK deployment config repository
        run: git clone "https://x-access-token:$GITHUB_PAT@github.com/$AGK_CONFIG_REPOSITORY.git" agk-deployment-configs

      - name: Determine version to promote
        id: version
        run: |
          set -euo pipefail

          git pull --ff-only origin main
          cd agk-deployment-configs
          git pull --ff-only origin main
          cd ..

          INPUT_VERSION="${{ inputs.version }}"
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=$(awk '$1 == "tag:" { print $2; exit }' \
              "agk-deployment-configs/$AGK_DEV_CONFIG_DIRECTORY/values.yaml" | tr -d "\"'")
          fi

          if ! grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' <<< "$VERSION"; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

          RAG_API_VERSION=$(tr -d '[:space:]' < knauf/rag-api-overlay/VERSION)
          if ! grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' <<< "$RAG_API_VERSION"; then
            echo "Invalid RAG API overlay version: $RAG_API_VERSION"
            exit 1
          fi

          echo "Version to promote: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "RAG API overlay version to promote: $RAG_API_VERSION"
          echo "rag_api_version=$RAG_API_VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate promotion inputs and prod config shape
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          RAG_API_VERSION="${{ steps.version.outputs.rag_api_version }}"

          test -f infrastructure/prod/values.yaml
          grep -Eq "tag: ['\"]v[0-9]+\.[0-9]+\.[0-9]+['\"]" infrastructure/prod/values.yaml
          grep -Eq "SERVICE_VERSION: v[0-9]+\.[0-9]+\.[0-9]+" infrastructure/prod/values.yaml

          test -f "agk-deployment-configs/$AGK_DEV_CONFIG_DIRECTORY/values.yaml"
          test -f "agk-deployment-configs/$AGK_PROD_CONFIG_DIRECTORY/values.yaml"
          test -f "agk-deployment-configs/$AGK_DEV_RAG_CONFIG_DIRECTORY/values.yaml"
          test -f "agk-deployment-configs/$AGK_PROD_RAG_CONFIG_DIRECTORY/values.yaml"
          test -f "agk-deployment-configs/$AGK_PROD_MEILI_CONFIG_DIRECTORY/values.yaml"
          grep -F "repository: $AGK_DEV_ACR_NAME.azurecr.io/$AGK_DEV_IMAGE_REPOSITORY" \
            "agk-deployment-configs/$AGK_DEV_CONFIG_DIRECTORY/values.yaml"
          grep -F "repository: $AGK_PROD_ACR_NAME.azurecr.io/$AGK_PROD_IMAGE_REPOSITORY" \
            "agk-deployment-configs/$AGK_PROD_CONFIG_DIRECTORY/values.yaml"
          grep -F "repository: $AGK_DEV_ACR_NAME.azurecr.io/$AGK_DEV_RAG_IMAGE_REPOSITORY" \
            "agk-deployment-configs/$AGK_DEV_RAG_CONFIG_DIRECTORY/values.yaml"
          grep -F "RAG_AZURE_DI_KEY: AGK-OPENAI-API-KEY" \
            "agk-deployment-configs/$AGK_DEV_RAG_CONFIG_DIRECTORY/values.yaml"
          grep -F "RAG_AZURE_DI_ENDPOINT: https://cst-karl-dev.services.ai.azure.com/" \
            "agk-deployment-configs/$AGK_DEV_RAG_CONFIG_DIRECTORY/values.yaml"
          grep -F "DOMAIN_SERVER: \"$AGK_PROD_DOMAIN\"" \
            "agk-deployment-configs/$AGK_PROD_CONFIG_DIRECTORY/values.yaml"
          grep -F "MEILI_MASTER_KEY: AGK-MEILI-MASTER-KEY" \
            "agk-deployment-configs/$AGK_PROD_CONFIG_DIRECTORY/values.yaml"
          grep -F "MEILI_MASTER_KEY: AGK-MEILI-MASTER-KEY" \
            "agk-deployment-configs/$AGK_PROD_MEILI_CONFIG_DIRECTORY/values.yaml"

          az acr repository show-tags \
            --subscription "$AGK_DEV_SUBSCRIPTION_ID" \
            --name "$AGK_DEV_ACR_NAME" \
            --repository "$AGK_DEV_IMAGE_REPOSITORY" \
            --query "[?@=='$VERSION']" \
            -o tsv | grep -Fx "$VERSION"

          az acr repository show-tags \
            --subscription "$AGK_DEV_SUBSCRIPTION_ID" \
            --name "$AGK_DEV_ACR_NAME" \
            --repository "$AGK_DEV_RAG_IMAGE_REPOSITORY" \
            --query "[?@=='$RAG_API_VERSION']" \
            -o tsv | grep -Fx "$RAG_API_VERSION"

      - name: Import image into AGK prod ACR
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          SOURCE_REGISTRY_ID=$(az acr show \
            --subscription "$AGK_DEV_SUBSCRIPTION_ID" \
            --name "$AGK_DEV_ACR_NAME" \
            --query id \
            -o tsv)

          az acr import \
            --subscription "$AGK_PROD_SUBSCRIPTION_ID" \
            --name "$AGK_PROD_ACR_NAME" \
            --registry "$SOURCE_REGISTRY_ID" \
            --source "$AGK_DEV_IMAGE_REPOSITORY:$VERSION" \
            --image "$AGK_PROD_IMAGE_REPOSITORY:$VERSION" \
            --force

      - name: Import RAG API overlay image into AGK prod ACR
        run: |
          set -euo pipefail

          RAG_API_VERSION="${{ steps.version.outputs.rag_api_version }}"
          SOURCE_REGISTRY_ID=$(az acr show \
            --subscription "$AGK_DEV_SUBSCRIPTION_ID" \
            --name "$AGK_DEV_ACR_NAME" \
            --query id \
            -o tsv)

          az acr import \
            --subscription "$AGK_PROD_SUBSCRIPTION_ID" \
            --name "$AGK_PROD_ACR_NAME" \
            --registry "$SOURCE_REGISTRY_ID" \
            --source "$AGK_DEV_RAG_IMAGE_REPOSITORY:$RAG_API_VERSION" \
            --image "$AGK_PROD_RAG_IMAGE_REPOSITORY:$RAG_API_VERSION" \
            --force

      - name: Verify AGK prod image tag
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          az acr repository show-tags \
            --subscription "$AGK_PROD_SUBSCRIPTION_ID" \
            --name "$AGK_PROD_ACR_NAME" \
            --repository "$AGK_PROD_IMAGE_REPOSITORY" \
            --query "[?@=='$VERSION']" \
            -o tsv | grep -Fx "$VERSION"

          RAG_API_VERSION="${{ steps.version.outputs.rag_api_version }}"
          az acr repository show-tags \
            --subscription "$AGK_PROD_SUBSCRIPTION_ID" \
            --name "$AGK_PROD_ACR_NAME" \
            --repository "$AGK_PROD_RAG_IMAGE_REPOSITORY" \
            --query "[?@=='$RAG_API_VERSION']" \
            -o tsv | grep -Fx "$RAG_API_VERSION"

      - name: Update AGK prod deployment config values
        working-directory: agk-deployment-configs
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          RAG_API_VERSION="${{ steps.version.outputs.rag_api_version }}"
          git pull --ff-only origin main
          sed -i -E "s/tag: ['\"]v[0-9]+\\.[0-9]+\\.[0-9]+['\"]/tag: \"$VERSION\"/" "$AGK_PROD_CONFIG_DIRECTORY/values.yaml"

          export PROD_RAG_VALUES="$AGK_PROD_RAG_CONFIG_DIRECTORY/values.yaml"
          export PROD_RAG_REPOSITORY="$AGK_PROD_ACR_NAME.azurecr.io/$AGK_PROD_RAG_IMAGE_REPOSITORY"
          export RAG_API_VERSION
          python3 - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          path = Path(os.environ["PROD_RAG_VALUES"])
          repo = os.environ["PROD_RAG_REPOSITORY"]
          tag = os.environ["RAG_API_VERSION"]
          text = path.read_text()

          image_pattern = re.compile(
              r"(\n  image:\n    repository: )[^\n]+"
              r"(\n    tag: )[^\n]+"
              r"(\n    pullPolicy: )[^\n]+"
          )
          text, image_count = image_pattern.subn(
              lambda match: (
                  f"{match.group(1)}{repo}"
                  f'{match.group(2)}"{tag}"'
                  f"{match.group(3)}Always"
              ),
              text,
              count=1,
          )
          if image_count != 1:
              print(f"Expected to update exactly one image block in {path}", file=sys.stderr)
              sys.exit(1)

          secret_line = "      RAG_AZURE_DI_KEY: AGK-OPENAI-API-KEY\n"
          if secret_line not in text:
              marker = "      RAG_OPENAI_API_KEY: AGK-OPENAI-API-KEY\n"
              if marker not in text:
                  print(f"Missing RAG_OPENAI_API_KEY marker in {path}", file=sys.stderr)
                  sys.exit(1)
              text = text.replace(marker, marker + secret_line, 1)

          config_block = (
              "    RAG_AZURE_DI_ENDPOINT: https://cst-karl-dev.services.ai.azure.com/\n"
              "    RAG_AZURE_DI_API_MODEL: prebuilt-layout\n"
              "    RAG_AZURE_DI_MODE: markdown\n"
              "    RAG_AZURE_DI_FILE_EXTS: pdf,docx,pptx,html\n"
              '    RAG_XLSX_MAX_CHARS: "1500000"\n'
              '    RAG_XLSX_SUMMARY_ROWS: "50"\n'
          )
          if "RAG_AZURE_DI_ENDPOINT:" not in text:
              marker = "    RAG_USE_FULL_CONTEXT: true\n"
              if marker not in text:
                  print(f"Missing RAG_USE_FULL_CONTEXT marker in {path}", file=sys.stderr)
                  sys.exit(1)
              text = text.replace(marker, marker + config_block, 1)

          required = [
              f"repository: {repo}",
              f'tag: "{tag}"',
              "RAG_AZURE_DI_KEY: AGK-OPENAI-API-KEY",
              "RAG_AZURE_DI_ENDPOINT: https://cst-karl-dev.services.ai.azure.com/",
              'RAG_XLSX_MAX_CHARS: "1500000"',
          ]
          missing = [value for value in required if value not in text]
          if missing:
              print(f"Missing expected RAG prod values in {path}: {missing}", file=sys.stderr)
              sys.exit(1)

          path.write_text(text)
          PY

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add "$AGK_PROD_CONFIG_DIRECTORY/values.yaml" "$PROD_RAG_VALUES"

          if ! git diff --cached --quiet; then
            git commit -m "Update agentic-karl prod to $VERSION and RAG API $RAG_API_VERSION"
            git push origin main
          else
            echo "AGK prod deployment config already points at $VERSION and RAG API $RAG_API_VERSION"
          fi

      - name: Update AGK prod app overlay values
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          sed -i -E "s/tag: ['\"]v[0-9]+\\.[0-9]+\\.[0-9]+['\"]/tag: '$VERSION'/" infrastructure/prod/values.yaml
          sed -i -E "s/SERVICE_VERSION: .*/SERVICE_VERSION: $VERSION/" infrastructure/prod/values.yaml

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git remote set-url origin "https://x-access-token:$GITHUB_PAT@github.com/${GITHUB_REPOSITORY}.git"
          git add infrastructure/prod/values.yaml

          if ! git diff --cached --quiet; then
            git commit -m "Update AGK prod version to $VERSION"
            git push origin main
          else
            echo "AGK prod app overlay already points at $VERSION"
          fi

      - name: Refresh AGK prod ArgoCD application
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          RAG_API_VERSION="${{ steps.version.outputs.rag_api_version }}"
          ARGOCD_PASSWORD=$(az keyvault secret show \
            --subscription "$AGK_PROD_SUBSCRIPTION_ID" \
            --vault-name "$AGK_ARGOCD_KEY_VAULT_NAME" \
            --name "$AGK_ARGOCD_PASSWORD_SECRET_NAME" \
            --query value \
            -o tsv)
          echo "::add-mask::$ARGOCD_PASSWORD"

          ARGOCD_TOKEN=$(jq -rn --arg password "$ARGOCD_PASSWORD" '{username: "admin", password: $password}' \
            | curl -fsS "https://$AGK_ARGOCD_DOMAIN/api/v1/session" \
                -H "Content-Type: application/json" \
                -d @- \
            | jq -r '.token')
          echo "::add-mask::$ARGOCD_TOKEN"

          refresh_app() {
            local app_name="$1"
            curl -fsS \
              "https://$AGK_ARGOCD_DOMAIN/api/v1/applications/$app_name?refresh=true" \
              -H "Authorization: Bearer $ARGOCD_TOKEN" \
              -H "Accept: application/json" \
              > /dev/null
          }

          refresh_app "$AGK_ARGOCD_APP"
          refresh_app "$AGK_ARGOCD_RAG_APP"

          for attempt in {1..60}; do
            APP_JSON=$(curl -fsS \
              "https://$AGK_ARGOCD_DOMAIN/api/v1/applications/$AGK_ARGOCD_APP" \
              -H "Authorization: Bearer $ARGOCD_TOKEN" \
              -H "Accept: application/json")
            RAG_APP_JSON=$(curl -fsS \
              "https://$AGK_ARGOCD_DOMAIN/api/v1/applications/$AGK_ARGOCD_RAG_APP" \
              -H "Authorization: Bearer $ARGOCD_TOKEN" \
              -H "Accept: application/json")

            SYNC_STATUS=$(jq -r '.status.sync.status' <<< "$APP_JSON")
            HEALTH_STATUS=$(jq -r '.status.health.status' <<< "$APP_JSON")
            IMAGE_MATCH=$(jq -r '.status.summary.images[]?' <<< "$APP_JSON" | grep -F "$AGK_PROD_IMAGE_REPOSITORY:$VERSION" || true)
            RAG_SYNC_STATUS=$(jq -r '.status.sync.status' <<< "$RAG_APP_JSON")
            RAG_HEALTH_STATUS=$(jq -r '.status.health.status' <<< "$RAG_APP_JSON")
            RAG_IMAGE_MATCH=$(jq -r '.status.summary.images[]?' <<< "$RAG_APP_JSON" | grep -F "$AGK_PROD_RAG_IMAGE_REPOSITORY:$RAG_API_VERSION" || true)

            echo "Attempt $attempt: app sync=$SYNC_STATUS health=$HEALTH_STATUS image=${IMAGE_MATCH:-missing}; rag sync=$RAG_SYNC_STATUS health=$RAG_HEALTH_STATUS image=${RAG_IMAGE_MATCH:-missing}"

            if [ "$SYNC_STATUS" = "Synced" ] \
              && [ "$HEALTH_STATUS" = "Healthy" ] \
              && [ -n "$IMAGE_MATCH" ] \
              && [ "$RAG_SYNC_STATUS" = "Synced" ] \
              && [ "$RAG_HEALTH_STATUS" = "Healthy" ] \
              && [ -n "$RAG_IMAGE_MATCH" ]; then
              exit 0
            fi

            refresh_app "$AGK_ARGOCD_APP"
            refresh_app "$AGK_ARGOCD_RAG_APP"
            sleep 10
          done

          echo "AGK prod ArgoCD did not report app $VERSION and RAG API $RAG_API_VERSION as Synced/Healthy in time"
          exit 1
