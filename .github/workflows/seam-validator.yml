name: Seam Validator
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate seam manifest
        run: |
          set -euo pipefail
          ERRORS=0

          echo "## Seam Validation Report" >> $GITHUB_STEP_SUMMARY

          # 1. Find all [knauf] markers in source (excluding knauf/ dirs, node_modules, SEAMS.md)
          MARKER_FILES=$(grep -rln '\[knauf\]' \
            --include='*.js' --include='*.ts' --include='*.tsx' --include='*.jsx' --include='*.css' \
            --exclude-dir='knauf' --exclude-dir='node_modules' --exclude='SEAMS.md' \
            api/ client/ packages/ 2>/dev/null | sort -u || true)

          echo "### Source Markers" >> $GITHUB_STEP_SUMMARY
          if [ -z "$MARKER_FILES" ]; then
            echo "No \`[knauf]\` markers found in source." >> $GITHUB_STEP_SUMMARY
          else
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "$MARKER_FILES" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

          # 2. Check every marker file is listed in SEAMS.md
          echo "### Marker → Manifest Check" >> $GITHUB_STEP_SUMMARY
          if [ -f SEAMS.md ]; then
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              if ! grep -q "$file" SEAMS.md; then
                echo "❌ \`$file\` has \`[knauf]\` marker but is NOT in SEAMS.md" >> $GITHUB_STEP_SUMMARY
                ERRORS=$((ERRORS + 1))
              fi
            done <<< "$MARKER_FILES"
          else
            if [ -n "$MARKER_FILES" ]; then
              echo "❌ SEAMS.md does not exist but \`[knauf]\` markers found" >> $GITHUB_STEP_SUMMARY
              ERRORS=$((ERRORS + 1))
            fi
          fi

          # 3. Check every SEAMS.md inline entry points to a real file with a marker
          if [ -f SEAMS.md ]; then
            echo "### Manifest → Source Check" >> $GITHUB_STEP_SUMMARY
            SEAM_PATHS=$(awk '/^## Inline Modifications/,/^## [A-Z]/' SEAMS.md | grep -oP '(?<=\| `)[^`]+(?=`)' || true)
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              if [ ! -f "$path" ]; then
                echo "❌ SEAMS.md lists \`$path\` but file does not exist (deleted or renamed?)" >> $GITHUB_STEP_SUMMARY
                ERRORS=$((ERRORS + 1))
              elif ! grep -q '\[knauf\]' "$path" 2>/dev/null; then
                echo "❌ SEAMS.md lists \`$path\` but file has no \`[knauf]\` marker" >> $GITHUB_STEP_SUMMARY
                ERRORS=$((ERRORS + 1))
              fi
            done <<< "$SEAM_PATHS"
          fi

          # 4. Report counts
          MARKER_COUNT=$(echo "$MARKER_FILES" | grep -c . || echo 0)
          KNAUF_FILES=$(find api/knauf client/src/knauf packages/knauf -type f 2>/dev/null | wc -l || echo 0)
          echo "### Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Files with inline markers:** $MARKER_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- **Net-new knauf/ files:** $KNAUF_FILES" >> $GITHUB_STEP_SUMMARY
          echo "- **Validation errors:** $ERRORS" >> $GITHUB_STEP_SUMMARY

          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::Seam validation failed with $ERRORS error(s). See job summary."
            exit 1
          fi
