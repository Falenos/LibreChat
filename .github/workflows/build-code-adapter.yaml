name: Build code-adapter image

# Builds the Knauf code-adapter (knauf/code-adapter/, LibreChat Code API ->
# Azure Container Apps dynamic sessions) straight into the AGK hub ACR:
#   acragkhubnonprod001.azurecr.io/agentic-karl-dev/agentic-karl-code-adapter:<VERSION>
#
# `az acr build` runs the build server-side in ACR (no docker, no registry password, no
# cross-registry import), authenticating as the shared service principal (secrets.AZURE_CREDENTIALS).
# The dev code-adapter Helm service (Knauf-Group/agk-deployment-configs) points at this image.
#
# VERSION is the only tag source. Every adapter PR must change it, and publishing refuses to
# replace an existing tag. The workflow records the source commit, VERSION, and resulting digest;
# deployments must consume repository@digest rather than trusting a mutable tag.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - knauf/code-adapter/**
  # Review finding A6 — the adapter had NO test gate on a PR. This workflow ran only on
  # dispatch or post-merge, and test_pipeline.yaml covers the root workspaces only (the
  # adapter is a separate package with its own dependency tree, excluded from the monorepo
  # eslint config). So adapter changes reached main untested and the first signal was a
  # post-merge build. The test job now runs on PRs touching the adapter; the build job is
  # guarded to non-PR events so a fork PR can never reach the ACR.
  pull_request:
    paths:
      - knauf/code-adapter/**
      - .github/workflows/build-code-adapter.yaml

permissions:
  contents: read

concurrency:
  # Every registry publisher shares one lane. PR tests remain independently cancellable.
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || 'code-adapter-publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Unit + contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: knauf/code-adapter
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate unique adapter version
        id: version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [ -n "$VERSION" ] || { echo "::error::VERSION is empty"; exit 1; }
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]{1,20})?$'; then
            echo "::error::invalid VERSION '$VERSION' — expected semver like 0.3.0 or 0.3.0-rc.1"
            exit 1
          fi
          if [ "${#VERSION}" -gt 64 ]; then
            echo "::error::VERSION is longer than 64 characters"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] &&
             [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::manual publishing is allowed only from main"
            exit 1
          fi

          if [ "${{ github.event_name }}" = "pull_request" ] &&
             ! git diff --quiet "$BASE_SHA" "${{ github.event.pull_request.head.sha }}" -- .; then
            BASE_VERSION="$(git show "${BASE_SHA}:knauf/code-adapter/VERSION" | tr -d '[:space:]')"
            if [ "$VERSION" = "$BASE_VERSION" ]; then
              echo "::error::adapter changes require a new VERSION (base is $BASE_VERSION)"
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      # lockedClient.spec.ts asserts against the INSTALLED @librechat/agents, which lives in
      # the monorepo root's node_modules — the adapter does not depend on it. Without this
      # the spec finds nothing and degrades to a loud skip, so the one test written to catch
      # client drift (the `runtime_session_hint` field and the never-read `result.code` that
      # the adapter compensates for) never actually ran in CI. Root install is scoped to that
      # package to keep the job fast.
      - name: Install the locked code client (for the drift tripwire)
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          # The EXACT version from the lockfile, not the range from api/package.json.
          # Installing the range resolves to the newest matching release (^3.2.65 picked up
          # 3.4.5), which tests a client we do not ship: real drift in the shipped version
          # could pass, and an unrelated change in a future version fails the build for no
          # reason. The tripwire is only meaningful against what the app actually runs.
          LOCKED="$(node -p "require('./package-lock.json').packages['node_modules/@librechat/agents'].version")"
          echo "Installing the locked @librechat/agents@$LOCKED for the contract tripwire"
          npm install --no-save --ignore-scripts --no-audit --no-fund "@librechat/agents@$LOCKED"

      - name: Type-check
        run: npm run lint

      # KNAUF_REQUIRE_LOCKED_CLIENT turns lockedClient.spec.ts's graceful skip into a hard
      # failure. Locally the skip is right (the adapter is standalone); in CI a skip means
      # the tripwire is not guarding anything, which is indistinguishable from green.
      - name: Test
        run: npm test
        env:
          KNAUF_REQUIRE_LOCKED_CLIENT: 'true'

  build:
    name: Build adapter into AGK ACR
    needs: test
    # Never on a pull_request: this job holds an Azure login with write access to the ACR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUBSCRIPTION_ID: ad3f0a71-cc5b-4d00-8289-23623cf2064c
      ACR_NAME: acragkhubnonprod001
      IMAGE_REPOSITORY: agentic-karl-dev/agentic-karl-code-adapter
      ADAPTER_DIR: knauf/code-adapter
      ADAPTER_VERSION: ${{ needs.test.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Create unique build tag
        id: build-tag
        run: |
          set -euo pipefail
          echo "tag=build-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Azure login (shared service principal)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build adapter under a unique temporary tag
        env:
          BUILD_TAG: ${{ steps.build-tag.outputs.tag }}
        run: |
          set -euo pipefail
          az acr build \
            --subscription "$SUBSCRIPTION_ID" \
            --registry "$ACR_NAME" \
            --image "$IMAGE_REPOSITORY:$BUILD_TAG" \
            --build-arg "ADAPTER_VERSION=$ADAPTER_VERSION" \
            --build-arg "SOURCE_REVISION=$GITHUB_SHA" \
            --file "$ADAPTER_DIR/Dockerfile" \
            "$ADAPTER_DIR"

      - name: Resolve temporary build digest
        id: build
        env:
          BUILD_TAG: ${{ steps.build-tag.outputs.tag }}
        run: |
          set -euo pipefail
          DIGEST=""
          for attempt in 1 2 3 4 5 6; do
            DIGEST="$(az acr repository show \
              --subscription "$SUBSCRIPTION_ID" \
              --name "$ACR_NAME" \
              --image "$IMAGE_REPOSITORY:$BUILD_TAG" \
              --query digest \
              --output tsv 2>/dev/null || true)"
            if printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
              break
            fi
            sleep 5
          done
          if ! printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::could not resolve the temporary build digest"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Publish immutable version tag
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          REGISTRY_ID="$(az acr show \
            --subscription "$SUBSCRIPTION_ID" \
            --name "$ACR_NAME" \
            --query id \
            --output tsv)"
          # No --force: ACR atomically rejects an existing VERSION tag. The build itself
          # used a unique temporary tag, so registry lookup failures cannot cause overwrite.
          az acr import \
            --subscription "$SUBSCRIPTION_ID" \
            --name "$ACR_NAME" \
            --registry "$REGISTRY_ID" \
            --source "$IMAGE_REPOSITORY@$BUILD_DIGEST" \
            --image "$IMAGE_REPOSITORY:$ADAPTER_VERSION"

      - name: Verify published version digest
        id: provenance
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          PUBLISHED_DIGEST="$(az acr repository show \
            --subscription "$SUBSCRIPTION_ID" \
            --name "$ACR_NAME" \
            --image "$IMAGE_REPOSITORY:$ADAPTER_VERSION" \
            --query digest \
            --output tsv)"
          if [ "$PUBLISHED_DIGEST" != "$BUILD_DIGEST" ]; then
            echo "::error::published digest mismatch: build=$BUILD_DIGEST version=$PUBLISHED_DIGEST"
            exit 1
          fi
          echo "digest=$PUBLISHED_DIGEST" >> "$GITHUB_OUTPUT"
          echo "image=$ACR_NAME.azurecr.io/$IMAGE_REPOSITORY@$PUBLISHED_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Remove temporary build tag
        if: always()
        env:
          BUILD_TAG: ${{ steps.build-tag.outputs.tag }}
        run: |
          az acr repository untag \
            --subscription "$SUBSCRIPTION_ID" \
            --name "$ACR_NAME" \
            --image "$IMAGE_REPOSITORY:$BUILD_TAG" \
            || echo "::warning::failed to remove temporary build tag $BUILD_TAG"

      - name: Record build provenance
        env:
          DIGEST: ${{ steps.provenance.outputs.digest }}
          IMAGE: ${{ steps.provenance.outputs.image }}
        run: |
          set -euo pipefail
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit "$GITHUB_SHA" \
            --arg version "$ADAPTER_VERSION" \
            --arg digest "$DIGEST" \
            --arg image "$IMAGE" \
            '{repository:$repository,commit:$commit,version:$version,digest:$digest,image:$image}' \
            > "$RUNNER_TEMP/code-adapter-provenance.json"
          {
            echo "### code-adapter published"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Source commit | \`$GITHUB_SHA\` |"
            echo "| VERSION | \`$ADAPTER_VERSION\` |"
            echo "| Digest | \`$DIGEST\` |"
            echo "| Deploy image | \`$IMAGE\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build provenance
        uses: actions/upload-artifact@v4
        with:
          name: code-adapter-${{ needs.test.outputs.version }}-provenance
          path: ${{ runner.temp }}/code-adapter-provenance.json
          if-no-files-found: error
          retention-days: 90
