name: Build code-adapter image

# Builds the Knauf code-adapter (knauf/code-adapter/, LibreChat Code API ->
# Azure Container Apps dynamic sessions) straight into the AGK hub ACR:
#   acragkhubnonprod001.azurecr.io/agentic-karl-dev/agentic-karl-code-adapter:<tag>
#
# `az acr build` runs the build server-side in ACR (no docker, no registry password, no
# cross-registry import), authenticating as the shared service principal (secrets.AZURE_CREDENTIALS).
# The dev code-adapter Helm service (Knauf-Group/agk-deployment-configs) points at this image.
#
# Tag: workflow_dispatch input (default = VERSION); a push to main touching the adapter rebuilds
# the tag in VERSION. Bump knauf/code-adapter/VERSION when you change the adapter, then point
# the deployment-configs values.yaml tag at it. Tests run first — a red suite never ships.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to build & push (e.g. 0.1.0)'
        required: true
        default: '0.1.0'
  push:
    branches: [main]
    paths:
      - knauf/code-adapter/**
      - .github/workflows/build-code-adapter.yaml
  # Review finding A6 — the adapter had NO test gate on a PR. This workflow ran only on
  # dispatch or post-merge, and test_pipeline.yaml covers the root workspaces only (the
  # adapter is a separate package with its own dependency tree, excluded from the monorepo
  # eslint config). So adapter changes reached main untested and the first signal was a
  # post-merge build. The test job now runs on PRs touching the adapter; the build job is
  # guarded to non-PR events so a fork PR can never reach the ACR.
  pull_request:
    paths:
      - knauf/code-adapter/**
      - .github/workflows/build-code-adapter.yaml

permissions:
  contents: read

concurrency:
  # PRs cancel superseded runs; main/dispatch builds must not cancel each other, because a
  # cancelled `az acr build` can leave a half-pushed tag.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Unit + contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: knauf/code-adapter
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      # lockedClient.spec.ts asserts against the INSTALLED @librechat/agents, which lives in
      # the monorepo root's node_modules — the adapter does not depend on it. Without this
      # the spec finds nothing and degrades to a loud skip, so the one test written to catch
      # client drift (the `runtime_session_hint` field and the never-read `result.code` that
      # the adapter compensates for) never actually ran in CI. Root install is scoped to that
      # package to keep the job fast.
      - name: Install the locked code client (for the drift tripwire)
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          # The declared range lives in api/package.json, not the root manifest.
          RANGE="$(node -p "require('./api/package.json').dependencies['@librechat/agents']")"
          echo "Installing @librechat/agents@$RANGE for the contract tripwire"
          npm install --no-save --ignore-scripts --no-audit --no-fund "@librechat/agents@$RANGE"

      - name: Type-check
        run: npm run lint

      # KNAUF_REQUIRE_LOCKED_CLIENT turns lockedClient.spec.ts's graceful skip into a hard
      # failure. Locally the skip is right (the adapter is standalone); in CI a skip means
      # the tripwire is not guarding anything, which is indistinguishable from green.
      - name: Test
        run: npm test
        env:
          KNAUF_REQUIRE_LOCKED_CLIENT: 'true'

  build:
    name: Build adapter into AGK ACR
    needs: test
    # Never on a pull_request: this job holds an Azure login with write access to the ACR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUBSCRIPTION_ID: ad3f0a71-cc5b-4d00-8289-23623cf2064c
      ACR_NAME: acragkhubnonprod001
      IMAGE_REPOSITORY: agentic-karl-dev/agentic-karl-code-adapter
      ADAPTER_DIR: knauf/code-adapter
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        # `inputs.tag` arrives through `env`, never interpolated into the script body:
        # `${{ }}` is substituted before bash parses the line, so a crafted tag could
        # otherwise close the quoting and run arbitrary commands — with a later step
        # holding an Azure login and write access to the ACR. Validating after the fact
        # would be too late, because the injection happens at substitution time.
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$(tr -d '[:space:]' < "$ADAPTER_DIR/VERSION")"
          fi
          [ -n "$TAG" ] || { echo "::error::empty tag"; exit 1; }
          # Docker tag grammar, deliberately narrower than the spec allows: the adapter is
          # tagged from VERSION, so semver plus an optional short pre-release suffix is
          # everything a legitimate build needs.
          if ! printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]{1,20})?$'; then
            echo "::error::invalid tag '$TAG' — expected semver like 0.1.0 or 0.1.0-rc.1"
            exit 1
          fi
          if [ "${#TAG}" -gt 64 ]; then
            echo "::error::tag longer than 64 characters"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building $ACR_NAME / $IMAGE_REPOSITORY:$TAG"

      - name: Azure login (shared service principal)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build adapter into AGK ACR (server-side)
        run: |
          set -euo pipefail
          az acr build \
            --subscription "$SUBSCRIPTION_ID" \
            --registry "$ACR_NAME" \
            --image "$IMAGE_REPOSITORY:${{ steps.tag.outputs.tag }}" \
            --file "$ADAPTER_DIR/Dockerfile" \
            "$ADAPTER_DIR"

      - name: Verify tag is in AGK ACR
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          az acr repository show-tags \
            --subscription "$SUBSCRIPTION_ID" \
            --name "$ACR_NAME" \
            --repository "$IMAGE_REPOSITORY" \
            --output tsv \
            --query "[?@=='$TAG'] | [0]" | grep -qx "$TAG"
