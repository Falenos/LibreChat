name: AGK Deploy Smoke

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/agk-deploy-smoke.yaml
      - .github/workflows/release_pipeline.yaml
      - .github/workflows/promote_pipeline.yaml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke AGK deploy dependencies
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AGK_SUBSCRIPTION_ID: ad3f0a71-cc5b-4d00-8289-23623cf2064c
      AGK_ACR_NAME: acragkhubnonprod001
      AGK_IMAGE_REPOSITORY: agentic-karl-stage/agentic-karl
      AGK_SMOKE_IMAGE_REPOSITORY: agentic-karl-stage/smoke/agentic-karl
      AGK_CONFIG_REPOSITORY: Knauf-Group/agk-deployment-configs
      AGK_CONFIG_DIRECTORY: agentic-karl/stage/services/agentic-karl
      AGK_PROD_ACR_NAME: acragkhubprod001
      AGK_PROD_IMAGE_REPOSITORY: agentic-karl-prod/agentic-karl
      AGK_PROD_CONFIG_DIRECTORY: agentic-karl/prod/services/agentic-karl
      AGK_PROD_MEILI_CONFIG_DIRECTORY: agentic-karl/prod/services/agentic-karl-meilisearch
      AGK_PROD_DOMAIN: https://agentic-karl.knauf.com
      AGK_ARGOCD_DOMAIN: argocd.agk.nonprod.knauf.digital
      AGK_ARGOCD_APP: agentic-karl-dev-agentic-karl
      AGK_ARGOCD_KEY_VAULT_NAME: kv-agk-hub-nonprod-001
      AGK_ARGOCD_PASSWORD_SECRET_NAME: argocd-admin-agk-nonprod
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get smoke support secrets
        run: |
          set -euo pipefail

          GITHUB_PAT=$(az keyvault secret show --vault-name kv-ct-shared-devops-001 --name GITHUB-PAT --query value -o tsv)
          echo "::add-mask::$GITHUB_PAT"
          echo "GITHUB_PAT=$GITHUB_PAT" >> "$GITHUB_ENV"

      - name: Check out app repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Smoke version derivation from stage GitOps tag
        run: |
          set -euo pipefail

          git clone "https://$GITHUB_PAT@github.com/$AGK_CONFIG_REPOSITORY.git" agk-deployment-configs-version
          VERSION=$(awk '$1 == "tag:" { print $2; exit }' \
            "agk-deployment-configs-version/$AGK_CONFIG_DIRECTORY/values.yaml" | tr -d "\"'")

          if ! grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' <<< "$VERSION"; then
            echo "Invalid stage GitOps version: $VERSION"
            exit 1
          fi

          echo "Stage GitOps version: $VERSION"
          echo "SMOKE_VERSION=$VERSION" >> "$GITHUB_ENV"

          az acr repository show-tags \
            --subscription "$AGK_SUBSCRIPTION_ID" \
            --name "$AGK_ACR_NAME" \
            --repository "$AGK_IMAGE_REPOSITORY" \
            --query "[?@=='$VERSION']" \
            -o tsv | grep -Fx "$VERSION"
          echo "Image $AGK_IMAGE_REPOSITORY:$VERSION exists in AGK ACR"

      - name: Smoke ACR build permissions (dry build)
        run: |
          set -euo pipefail

          # Verify we have permission to run az acr build (check access without building)
          az acr repository list \
            --subscription "$AGK_SUBSCRIPTION_ID" \
            --name "$AGK_ACR_NAME" \
            -o tsv | grep -q "agentic-karl"
          echo "ACR access verified"

      - name: Smoke promote — image import stage to prod ACR
        run: |
          set -euo pipefail

          VERSION="$SMOKE_VERSION"
          SMOKE_TAG="${VERSION}-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          SOURCE_REGISTRY_ID=$(az acr show \
            --subscription "$AGK_SUBSCRIPTION_ID" \
            --name "$AGK_ACR_NAME" \
            --query id \
            -o tsv)

          cleanup() {
            az acr repository delete \
              --subscription "$AGK_SUBSCRIPTION_ID" \
              --name "$AGK_PROD_ACR_NAME" \
              --image "$AGK_PROD_IMAGE_REPOSITORY:$SMOKE_TAG" \
              --yes >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          az acr import \
            --subscription "$AGK_PROD_SUBSCRIPTION_ID" \
            --name "$AGK_PROD_ACR_NAME" \
            --registry "$SOURCE_REGISTRY_ID" \
            --source "$AGK_IMAGE_REPOSITORY:$VERSION" \
            --image "$AGK_PROD_IMAGE_REPOSITORY:$SMOKE_TAG" \
            --force

          az acr repository show-tags \
            --subscription "$AGK_PROD_SUBSCRIPTION_ID" \
            --name "$AGK_PROD_ACR_NAME" \
            --repository "$AGK_PROD_IMAGE_REPOSITORY" \
            --query "[?@=='$SMOKE_TAG']" \
            -o tsv | grep -Fx "$SMOKE_TAG"
          echo "Smoke import succeeded"

          az acr repository delete \
            --subscription "$AGK_PROD_SUBSCRIPTION_ID" \
            --name "$AGK_PROD_ACR_NAME" \
            --image "$AGK_PROD_IMAGE_REPOSITORY:$SMOKE_TAG" \
            --yes
          trap - EXIT
        env:
          AGK_PROD_SUBSCRIPTION_ID: e0515a24-7205-481b-b657-944901020e32

      - name: Smoke AGK deployment config repository access
        run: |
          set -euo pipefail

          git clone "https://$GITHUB_PAT@github.com/$AGK_CONFIG_REPOSITORY.git" agk-deployment-configs
          cd agk-deployment-configs
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git pull --ff-only origin main
          test -f "$AGK_CONFIG_DIRECTORY/values.yaml"
          test -f "$AGK_PROD_CONFIG_DIRECTORY/values.yaml"
          test -f "$AGK_PROD_MEILI_CONFIG_DIRECTORY/values.yaml"
          grep -F "repository: $AGK_PROD_ACR_NAME.azurecr.io/$AGK_PROD_IMAGE_REPOSITORY" "$AGK_PROD_CONFIG_DIRECTORY/values.yaml"
          grep -F "DOMAIN_SERVER: \"$AGK_PROD_DOMAIN\"" "$AGK_PROD_CONFIG_DIRECTORY/values.yaml"
          grep -F "MEILI_MASTER_KEY: AGK-MEILI-MASTER-KEY" "$AGK_PROD_CONFIG_DIRECTORY/values.yaml"
          grep -F "MEILI_MASTER_KEY: AGK-MEILI-MASTER-KEY" "$AGK_PROD_MEILI_CONFIG_DIRECTORY/values.yaml"

          SMOKE_BRANCH="agk-deploy-smoke/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            git push origin ":refs/heads/$SMOKE_BRANCH" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          git push origin "HEAD:refs/heads/$SMOKE_BRANCH"
          git push origin ":refs/heads/$SMOKE_BRANCH"
          trap - EXIT

      - name: Smoke AGK ArgoCD API access
        run: |
          set -euo pipefail

          ARGOCD_PASSWORD=$(az keyvault secret show \
            --subscription "$AGK_SUBSCRIPTION_ID" \
            --vault-name "$AGK_ARGOCD_KEY_VAULT_NAME" \
            --name "$AGK_ARGOCD_PASSWORD_SECRET_NAME" \
            --query value \
            -o tsv)
          echo "::add-mask::$ARGOCD_PASSWORD"

          ARGOCD_TOKEN=$(jq -rn --arg password "$ARGOCD_PASSWORD" '{username: "admin", password: $password}' \
            | curl -fsS "https://$AGK_ARGOCD_DOMAIN/api/v1/session" \
                -H "Content-Type: application/json" \
                -d @- \
            | jq -r '.token')
          echo "::add-mask::$ARGOCD_TOKEN"

          curl -fsS \
            "https://$AGK_ARGOCD_DOMAIN/api/v1/applications/$AGK_ARGOCD_APP" \
            -H "Authorization: Bearer $ARGOCD_TOKEN" \
            -H "Accept: application/json" \
            | jq -e --arg app "$AGK_ARGOCD_APP" '
                .metadata.name == $app
                and (.status.sync.status | type == "string")
                and (.status.health.status | type == "string")
              '
