name: Test Pipeline

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled
    # Skip the full client/api/packages suite for changes that are structurally
    # isolated from it: the code-adapter is a standalone service consumed only
    # over HTTP at runtime (no compile-time import from client/api/packages),
    # and docs/markdown carry no executable code. Any PR touching client/, api/,
    # packages/*, or shared root config still runs the full suite unchanged.
    paths-ignore:
      - 'knauf/code-adapter/**'
      - 'knauf/docs/**'
      - '**/*.md'

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    uses: 'Knauf-Group/ct-shared-workflows/.github/workflows/test-nextjs.yaml@v3.0.0'
    with:
      checkout-submodules: false
      build-app: false
      lint-code: false
      project-key-vault-name: kv-ct-shared-tools
      test-command: 'NODE_OPTIONS="--max-old-space-size=6144" npm run build:packages && NODE_OPTIONS="--max-old-space-size=6144" npm run test:coverage'
      upload-coverage-report: true
      coverage-report-path: './client/coverage/lcov.info'
    secrets:
      azure-credentials: ${{ secrets.AZURE_CREDENTIALS }}
