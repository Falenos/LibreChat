name: Test Pipeline

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    uses: 'Knauf-Group/ct-shared-workflows/.github/workflows/test-nextjs.yaml@v2.9.0'
    with:
      checkout-submodules: false
      build-app: false
      lint-code: false
      project-key-vault-name: kv-ct-shared-tools
      test-command: 'NODE_OPTIONS="--max-old-space-size=6144" npm run build:packages && NODE_OPTIONS="--max-old-space-size=6144" npm run test:coverage'
      upload-coverage-report: true
      coverage-report-path: './client/coverage/lcov.info'
    env:
      NODE_OPTIONS: '--max-old-space-size=8192'
    secrets:
      azure-credentials: ${{ secrets.AZURE_CREDENTIALS }}
