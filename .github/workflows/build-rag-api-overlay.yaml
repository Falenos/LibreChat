name: Build RAG API overlay image

# Builds the Knauf rag_api overlay (knauf/rag-api-overlay/, Azure Document Intelligence
# parser + native xlsx loader) straight into the AGK hub ACR:
#   acragkhubnonprod001.azurecr.io/agentic-karl-dev/agentic-karl-rag-api:<tag>
#
# `az acr build` runs the build server-side in ACR (no docker, no registry password, no
# cross-registry import), authenticating as the shared service principal (secrets.AZURE_CREDENTIALS).
# The dev rag_api Helm service (Knauf-Group/agk-deployment-configs) points at this image.
#
# Tag: workflow_dispatch input (default = VERSION); a push to main touching the overlay rebuilds
# the tag in VERSION. Bump knauf/rag-api-overlay/VERSION when you change the overlay, then point
# the deployment-configs values.yaml tag at it.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to build & push (e.g. 0.1.0)"
        required: true
        default: "0.1.0"
  push:
    branches: [main]
    paths:
      - knauf/rag-api-overlay/**
      - .github/workflows/build-rag-api-overlay.yaml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: Build overlay into AGK ACR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUBSCRIPTION_ID: ad3f0a71-cc5b-4d00-8289-23623cf2064c
      ACR_NAME: acragkhubnonprod001
      IMAGE_REPOSITORY: agentic-karl-dev/agentic-karl-rag-api
      OVERLAY_DIR: knauf/rag-api-overlay
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="$(tr -d '[:space:]' < "$OVERLAY_DIR/VERSION")"
          fi
          [ -n "$TAG" ] || { echo "::error::empty tag"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building $ACR_NAME / $IMAGE_REPOSITORY:$TAG"

      - name: Azure login (shared service principal)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build overlay into AGK ACR (server-side)
        run: |
          set -euo pipefail
          az acr build \
            --subscription "$SUBSCRIPTION_ID" \
            --registry "$ACR_NAME" \
            --image "$IMAGE_REPOSITORY:${{ steps.tag.outputs.tag }}" \
            --file "$OVERLAY_DIR/Dockerfile.knauf-rag" \
            "$OVERLAY_DIR"

      - name: Verify tag is in AGK ACR
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          az acr repository show-tags \
            --subscription "$SUBSCRIPTION_ID" \
            --name "$ACR_NAME" \
            --repository "$IMAGE_REPOSITORY" \
            --query "[?@=='$TAG']" -o tsv | grep -Fx "$TAG"
          echo "✅ $ACR_NAME.azurecr.io/$IMAGE_REPOSITORY:$TAG is in AGK ACR"
