name: Promote code-adapter image to prod

# Resolves an existing nonprod tag to its immutable digest, imports that digest into the prod
# hub ACR, and proves the source and target manifests are byte-identical:
#   nonprod/.../agentic-karl-code-adapter:<tag> -> @sha256:<digest>
#     -> prod/.../agentic-karl-code-adapter:<tag> == @sha256:<digest>
#
# WHY A SEPARATE WORKFLOW, not a step inside promote_pipeline.yaml.
# The adapter versions independently of KARL: its tag comes from
# knauf/code-adapter/VERSION (e.g. 0.1.0), while promote_pipeline.yaml promotes the
# app's `vX.Y.Z` GitOps tag. Bolting the adapter onto that job would force one of the
# two into the other's scheme, and would couple a code-adapter hotfix to a full app
# promotion. Deliberate deviation from the "slot it into promote_pipeline.yaml" bullet in
# knauf/docs/code-execution/deployment.md §8, which assumed lock-step versioning.
#
# This workflow does NOT deploy. It only makes the immutable manifest available in prod —
# the prod rollout is a values bump in Knauf-Group/agk-deployment-configs
# (agentic-karl/prod/services/agentic-karl-code-adapter), which ArgoCD then syncs. That
# split is intentional: image availability is reversible and safe, the values bump is the
# actual change, and it goes through the config repo's PR review like every other service.
#
# Auth is the shared service principal (secrets.AZURE_CREDENTIALS), same as
# build-code-adapter.yaml and promote_pipeline.yaml. `az acr import` is server-side —
# no docker pull/push, no registry password.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Adapter tag to promote (must already exist in nonprod, e.g. 0.1.0)'
        required: true
      confirm:
        description: 'Type the tag again to confirm the prod promotion'
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  promote:
    name: Import adapter tag into AGK prod ACR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    env:
      NONPROD_SUBSCRIPTION_ID: ad3f0a71-cc5b-4d00-8289-23623cf2064c
      PROD_SUBSCRIPTION_ID: e0515a24-7205-481b-b657-944901020e32
      NONPROD_ACR_NAME: acragkhubnonprod001
      PROD_ACR_NAME: acragkhubprod001
      NONPROD_IMAGE_REPOSITORY: agentic-karl-dev/agentic-karl-code-adapter
      PROD_IMAGE_REPOSITORY: agentic-karl-prod/agentic-karl-code-adapter
    steps:
      - name: Validate inputs
        id: inputs
        # Both inputs arrive through `env`, never interpolated into the script body.
        # `${{ }}` is substituted before bash parses the line, so a crafted tag could
        # otherwise break quoting and run commands — and this job holds an Azure login
        # with write access to the PROD registry. Validation has to happen on the
        # variable, after substitution can no longer inject anything.
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          TAG="$INPUT_TAG"
          CONFIRM="$INPUT_CONFIRM"
          # Two-field confirmation: this writes to the prod registry, and a mistyped tag
          # would publish an unintended image under a name prod values may already point at.
          if [ "$TAG" != "$CONFIRM" ]; then
            echo "::error::confirm does not match tag"
            exit 1
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]{1,20})?$'; then
            echo "::error::tag must be semver without a leading v (e.g. 0.1.0); the adapter is tagged from knauf/code-adapter/VERSION"
            exit 1
          fi
          if [ "${#TAG}" -gt 64 ]; then
            echo "::error::tag longer than 64 characters"
            exit 1
          fi
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::production promotion is allowed only from main"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Azure login (shared service principal)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Resolve source digest
        id: source
        env:
          TAG: ${{ steps.inputs.outputs.tag }}
        run: |
          set -euo pipefail
          DIGEST="$(az acr repository show \
            --subscription "$NONPROD_SUBSCRIPTION_ID" \
            --name "$NONPROD_ACR_NAME" \
            --image "$NONPROD_IMAGE_REPOSITORY:$TAG" \
            --query digest \
            --output tsv)"
          if ! printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::nonprod tag $TAG did not resolve to a valid digest"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Reject an existing prod tag
        env:
          TAG: ${{ steps.inputs.outputs.tag }}
        run: |
          set -euo pipefail
          if az acr repository show \
            --subscription "$PROD_SUBSCRIPTION_ID" \
            --name "$PROD_ACR_NAME" \
            --image "$PROD_IMAGE_REPOSITORY:$TAG" \
            >/dev/null 2>&1; then
            echo "::error::$PROD_IMAGE_REPOSITORY:$TAG already exists in prod"
            exit 1
          fi

      - name: Import into AGK prod ACR
        env:
          TAG: ${{ steps.inputs.outputs.tag }}
          SOURCE_DIGEST: ${{ steps.source.outputs.digest }}
        run: |
          set -euo pipefail
          SOURCE_REGISTRY_ID=$(az acr show \
            --subscription "$NONPROD_SUBSCRIPTION_ID" \
            --name "$NONPROD_ACR_NAME" \
            --query id \
            -o tsv)

          # Import the resolved manifest, never the mutable source tag. No --force: a
          # production version is immutable and must never be silently replaced.
          az acr import \
            --subscription "$PROD_SUBSCRIPTION_ID" \
            --name "$PROD_ACR_NAME" \
            --registry "$SOURCE_REGISTRY_ID" \
            --source "$NONPROD_IMAGE_REPOSITORY@$SOURCE_DIGEST" \
            --image "$PROD_IMAGE_REPOSITORY:$TAG"

      - name: Verify exact target digest
        id: target
        env:
          TAG: ${{ steps.inputs.outputs.tag }}
          SOURCE_DIGEST: ${{ steps.source.outputs.digest }}
        run: |
          set -euo pipefail
          TARGET_DIGEST=""
          for attempt in 1 2 3 4 5 6; do
            TARGET_DIGEST="$(az acr repository show \
              --subscription "$PROD_SUBSCRIPTION_ID" \
              --name "$PROD_ACR_NAME" \
              --image "$PROD_IMAGE_REPOSITORY:$TAG" \
              --query digest \
              --output tsv 2>/dev/null || true)"
            if [ "$TARGET_DIGEST" = "$SOURCE_DIGEST" ]; then
              break
            fi
            sleep 5
          done
          if [ "$TARGET_DIGEST" != "$SOURCE_DIGEST" ]; then
            echo "::error::digest mismatch: source=$SOURCE_DIGEST target=$TARGET_DIGEST"
            exit 1
          fi
          echo "digest=$TARGET_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Record promotion provenance
        env:
          TAG: ${{ steps.inputs.outputs.tag }}
          SOURCE_DIGEST: ${{ steps.source.outputs.digest }}
          TARGET_DIGEST: ${{ steps.target.outputs.digest }}
        run: |
          set -euo pipefail
          jq -n \
            --arg tag "$TAG" \
            --arg source "$NONPROD_ACR_NAME.azurecr.io/$NONPROD_IMAGE_REPOSITORY@$SOURCE_DIGEST" \
            --arg target "$PROD_ACR_NAME.azurecr.io/$PROD_IMAGE_REPOSITORY@$TARGET_DIGEST" \
            --arg digest "$TARGET_DIGEST" \
            '{tag:$tag,source:$source,target:$target,digest:$digest}' \
            > "$RUNNER_TEMP/code-adapter-promotion.json"
          {
            echo "### code-adapter promoted to prod ACR"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Tag | \`$TAG\` |"
            echo "| Source digest | \`$SOURCE_DIGEST\` |"
            echo "| Target digest | \`$TARGET_DIGEST\` |"
            echo "| Deploy image | \`$PROD_ACR_NAME.azurecr.io/$PROD_IMAGE_REPOSITORY@$TARGET_DIGEST\` |"
            echo ""
            echo "**Not deployed yet.** Point the prod values at the digest above to roll it out:"
            echo "\`agentic-karl/prod/services/agentic-karl-code-adapter/values.yaml\` in"
            echo "Knauf-Group/agk-deployment-configs. Prod also needs its own ACA session pool,"
            echo "managed identity and \`LIBRECHAT_CODE_BASEURL\` — until that env var points at"
            echo "the prod adapter, code execution stays off by design"
            echo "(packages/api/src/knauf/code/codeEnvGuard.ts)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload promotion provenance
        uses: actions/upload-artifact@v4
        with:
          name: code-adapter-${{ steps.inputs.outputs.tag }}-promotion
          path: ${{ runner.temp }}/code-adapter-promotion.json
          if-no-files-found: error
          retention-days: 90
