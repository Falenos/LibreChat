# Parser-eval configuration. Env vars (RAG_AZURE_DI_*, AZURE_OPENAI_*) are read from
# the repo .env by default; values here override env. See README.md.

strategies: [azure_di, upstream, liteparse]

azure_di:
  # endpoint/key default to RAG_AZURE_DI_ENDPOINT / RAG_AZURE_DI_KEY env.
  api_model: prebuilt-layout
  mode: markdown
  cost_per_page_usd: 0.01      # DI prebuilt-layout ≈ $10 / 1000 pages — VERIFY current Azure pricing

liteparse:
  # The harness shells out to the liteparse CLI. Adjust to your install's actual flags.
  # {input} and {output} are substituted; output is read back as the parsed text.
  command: "lit parse {input} --format text -o {output}"
  output_suffix: ".txt"

judge:
  enabled: true
  # Azure OpenAI deployment used as the judge (vision-capable for page-grounded scoring).
  deployment: gpt-4o
  api_version: "2024-10-21"
  # endpoint/key default to AZURE_OPENAI_* env; azure_endpoint derived from RAG_OPENAI_BASEURL if unset.
  azure_endpoint: "https://cst-karl-dev.openai.azure.com/"
  max_pages_judged: 3          # cap pages sent to the vision judge per doc (cost control)
  pairwise: true               # also produce A/B rankings across strategies

# Phase 2 (RAG quality) — only used with --phase2
rag:
  backend: auto               # auto = ragas if installed, else lite ; or force "ragas" / "lite"
  embeddings_deployment: ""   # blank → uses $EMBEDDINGS_MODEL from .env (e.g. text-embedding-3-large)
  chunk_size: 1000
  chunk_overlap: 200
  top_k: 4
