<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="1080" viewBox="0 0 1600 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Knauf Color System</title>
  <desc id="desc">Brand color layout with primary colors on the left and secondary colors on the right, including swatches, color codes, and use cases.</desc>

  <defs>
    <style>
      .bg { fill: #FFFFFF; }
      .title { font: 700 34px Arial, Helvetica, sans-serif; fill: #003778; }
      .subtitle { font: 400 18px Arial, Helvetica, sans-serif; fill: #557696; }
      .section { font: 700 26px Arial, Helvetica, sans-serif; fill: #003778; }
      .card { fill: #FFFFFF; stroke: #D7E2EA; stroke-width: 2; }
      .cardPrimary { fill: #FFFFFF; stroke: #C6D9E6; stroke-width: 2.5; }
      .cardTitle { font: 700 24px Arial, Helvetica, sans-serif; fill: #003778; }
      .cardTitleSm { font: 700 20px Arial, Helvetica, sans-serif; fill: #003778; }
      .meta { font: 400 17px Arial, Helvetica, sans-serif; fill: #003778; }
      .metaSm { font: 400 15px Arial, Helvetica, sans-serif; fill: #003778; }
      .use { font: 600 18px Arial, Helvetica, sans-serif; fill: #003778; }
      .useSm { font: 600 16px Arial, Helvetica, sans-serif; fill: #003778; }
      .note { font: 400 16px Arial, Helvetica, sans-serif; fill: #557696; }
      .divider { stroke: #E6EEF4; stroke-width: 2; }
      .swatchBorder { stroke: #AAB8C2; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" x="0" y="0" width="1600" height="1080"/>

  <!-- Header -->
  <text class="title" x="800" y="62" text-anchor="middle">Knauf Color System</text>
  <text class="subtitle" x="800" y="94" text-anchor="middle">Primary and secondary colors</text>

  <!-- Divider -->
  <line class="divider" x1="680" y1="138" x2="680" y2="1030"/>
  <line class="divider" x1="60" y1="138" x2="1540" y2="138"/>

  <!-- Section headings -->
  <text class="section" x="60" y="176">Primary colors</text>
  <text class="section" x="720" y="176">Secondary colors</text>

  <!-- PRIMARY CARD 1 -->
  <g transform="translate(60,200)">
    <rect class="cardPrimary" x="0" y="0" width="580" height="390" rx="18"/>
    <rect x="28" y="28" width="120" height="120" rx="14" fill="#0099DE"/>
    <text class="cardTitle" x="170" y="58">Knauf Cyan Blue</text>
    <text class="meta" x="170" y="90">
      <tspan x="170" dy="0">HEX  #0099DE</tspan>
      <tspan x="170" dy="26">RGB  0, 160, 230</tspan>
      <tspan x="170" dy="26">CMYK  100, 0, 0, 0</tspan>
      <tspan x="170" dy="26">Pantone  Process Cyan C</tspan>
      <tspan x="170" dy="26">RAL  240 60 40</tspan>
    </text>
    <text class="use" x="28" y="198">Use case: Logo, headlines, brand statement, key visual.</text>
    <text class="note" x="28" y="228">Print / brand reference: #00A0E6</text>
  </g>

  <!-- PRIMARY CARD 2 -->
  <g transform="translate(60,620)">
    <rect class="cardPrimary" x="0" y="0" width="580" height="390" rx="18"/>
    <rect x="28" y="28" width="120" height="120" rx="14" fill="#003778"/>
    <text class="cardTitle" x="170" y="58">Knauf Accessible Blue</text>
    <text class="meta" x="170" y="90">
      <tspan x="170" dy="0">HEX  #003778</tspan>
      <tspan x="170" dy="26">RGB  0, 55, 120</tspan>
      <tspan x="170" dy="26">CMYK  100, 75, 0, 30</tspan>
      <tspan x="170" dy="26">Pantone  3597 C</tspan>
      <tspan x="170" dy="26">RAL  270 30 30</tspan>
    </text>
    <text class="use" x="28" y="198">Use case: Digital text and highlights. Never for logo.</text>
  </g>

  <!-- SECONDARY CARD 1 -->
  <g transform="translate(720,200)">
    <rect class="card" x="0" y="0" width="380" height="250" rx="18"/>
    <rect x="24" y="24" width="84" height="84" rx="12" fill="#004B46"/>
    <text class="cardTitleSm" x="126" y="48">Knauf Dark Green</text>
    <text class="metaSm" x="126" y="73">
      <tspan x="126" dy="0">HEX  #004B46</tspan>
      <tspan x="126" dy="20">RGB  0, 75, 70</tspan>
      <tspan x="126" dy="20">CMYK  100, 25, 55, 55</tspan>
      <tspan x="126" dy="20">Pantone  3292 C</tspan>
      <tspan x="126" dy="20">RAL  6026</tspan>
    </text>
    <text class="useSm" x="24" y="180">Use case: Secondary support color.</text>
  </g>

  <!-- SECONDARY CARD 2 -->
  <g transform="translate(1140,200)">
    <rect class="card" x="0" y="0" width="380" height="250" rx="18"/>
    <rect x="24" y="24" width="84" height="84" rx="12" fill="#87C15F"/>
    <text class="cardTitleSm" x="126" y="48">Knauf Light Green</text>
    <text class="metaSm" x="126" y="73">
      <tspan x="126" dy="0">HEX  #87C15F</tspan>
      <tspan x="126" dy="20">RGB  135, 193, 95</tspan>
      <tspan x="126" dy="20">CMYK  50, 0, 75, 0</tspan>
      <tspan x="126" dy="20">Pantone  368 C</tspan>
      <tspan x="126" dy="20">RAL  120 70 75</tspan>
    </text>
    <text class="useSm" x="24" y="180">
      <tspan x="24" dy="0">Use case: Backgrounds, tables,</tspan>
      <tspan x="24" dy="22">graphic accents. Not for text.</tspan>
    </text>
  </g>

  <!-- SECONDARY CARD 3 -->
  <g transform="translate(720,480)">
    <rect class="card" x="0" y="0" width="380" height="250" rx="18"/>
    <rect x="24" y="24" width="84" height="84" rx="12" fill="#F06E00"/>
    <text class="cardTitleSm" x="126" y="48">Knauf Orange</text>
    <text class="metaSm" x="126" y="73">
      <tspan x="126" dy="0">HEX  #F06E00</tspan>
      <tspan x="126" dy="20">RGB  240, 110, 0</tspan>
      <tspan x="126" dy="20">CMYK  0, 65, 100, 0</tspan>
      <tspan x="126" dy="20">Pantone  152 C</tspan>
      <tspan x="126" dy="20">RAL  060 60 80</tspan>
    </text>
    <text class="useSm" x="24" y="180">
      <tspan x="24" dy="0">Use case: Support color, use sparingly.</tspan>
      <tspan x="24" dy="22">Not for text.</tspan>
    </text>
  </g>

  <!-- SECONDARY CARD 4 -->
  <g transform="translate(1140,480)">
    <rect class="card" x="0" y="0" width="380" height="250" rx="18"/>
    <rect x="24" y="24" width="84" height="84" rx="12" fill="#FFD25C"/>
    <text class="cardTitleSm" x="126" y="48">Knauf Yellow</text>
    <text class="metaSm" x="126" y="73">
      <tspan x="126" dy="0">HEX  #FFD25C</tspan>
      <tspan x="126" dy="20">RGB  255, 210, 92</tspan>
      <tspan x="126" dy="20">CMYK  0, 17, 70, 0</tspan>
      <tspan x="126" dy="20">Pantone  121 C</tspan>
      <tspan x="126" dy="20">RAL  080 80 60</tspan>
    </text>
    <text class="useSm" x="24" y="180">
      <tspan x="24" dy="0">Use case: Backgrounds and graphic highlights.</tspan>
      <tspan x="24" dy="22">Not for text.</tspan>
    </text>
  </g>

  <!-- SECONDARY CARD 5 -->
  <g transform="translate(720,760)">
    <rect class="card" x="0" y="0" width="800" height="250" rx="18"/>
    <rect class="swatchBorder" x="24" y="24" width="84" height="84" rx="12" fill="#CFD7D9"/>
    <text class="cardTitleSm" x="126" y="48">Knauf Grey</text>
    <text class="metaSm" x="126" y="73">
      <tspan x="126" dy="0">HEX  #CFD7D9</tspan>
      <tspan x="126" dy="20">RGB  207, 215, 217</tspan>
      <tspan x="126" dy="20">CMYK  5, 0, 0, 20</tspan>
      <tspan x="126" dy="20">Pantone  427 C</tspan>
      <tspan x="126" dy="20">RAL  7047</tspan>
    </text>
    <text class="useSm" x="24" y="180">
      <tspan x="24" dy="0">Use case: Tables, backgrounds, neutral content areas.</tspan>
      <tspan x="24" dy="22">Not for text.</tspan>
    </text>
  </g>
</svg>
