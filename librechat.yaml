      2. License Grant
      Company grants you a non-exclusive, non-transferable, limited license to use the Software for your internal business purposes, subject to the terms and conditions of this Agreement.


      3. Restrictions
      You may not use our Services for any illegal, harmful, or abusive activity. For example, you are prohibited from:

