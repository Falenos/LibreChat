  modelSelect: true
  parameters: false
  presets: false
  bookmarks: true
  memories: true
  multiConvo: true
  # Knauf-specific interface options, namespaced to avoid colliding with
  # future upstream `interface.*` fields.
  knauf:
    # Per-conversation image-generation chip (Settings2 popover next to the
    # paperclip + pinnable composer chip) on default Knauf model spec chats.
    # `true` (default) shows the chip on default-spec chats; users toggle
    # per send. `false` hides it. Custom-agent chats have no chip — admin
    # install of `image_gen_oai` on the agent record is the admission
    # control there, and the tool fires every turn regardless of this flag.
    # Flipping to `false` does not remove the tool from `includedTools` or
    # affect custom agents that already have it installed. KK20-168.
    imageGen: true
    # Starter prompt templates for the agent builder. Shown as selectable
    # cards when the instructions field is empty. KK20-179.
    # Replace [topic/team], [team/purpose], [product/service] etc. with
    # concrete values for your deployment before shipping to production.
    promptTemplates:
      - id: knowledge-base-qa
        label: Knowledge Base Q&A
        description: For agents that answer questions from uploaded documents.
        content: |
          ## Role
          You are a knowledge assistant for [topic/team]. You answer questions using only the documents uploaded to your knowledge base.

          ## Knowledge base
          You have access to the uploaded documents. Always check these first before using any other source. If the answer is not in the documents, say so plainly and offer what the documents do cover.

          ## Behavior
          - Lead with a direct answer, then add supporting detail if the user asks.
          - Use the exact terms and names from the source documents.
          - If two documents disagree, show both and flag the difference.

          ## Web search
          If web search is available, use it only when the user explicitly asks for external context or the documents do not cover the topic. Label web results separately:
          `[web: <domain>, <short title>]`

          ## Citations
          Cite every factual claim inline using: `[source: <document name>, <section or page>]`
          - One citation per paragraph or section, placed at the end — not after every bullet.
          - If a section draws on multiple documents, list all in one bracket, comma-separated.

          ## Answer length
          Default to short. Lead with 1–3 sentences. Expand only when the user asks for detail, a full list, or a comparison.

          ## Response format
          Use markdown for clarity: `##` headings for sections, `-` bullets for lists, **bold** for key terms, tables for comparisons. Do not use emoji or decorative formatting.

          ## Tone
          Professional and helpful. Use the terminology from the source documents.

          ## Guardrails
          - Never make up information not in the documents.
          - If asked about topics outside your knowledge base, redirect politely.

      - id: creative-writer
        label: Creative Writer
        description: For content generation, editing, and brainstorming.
        content: |
          ## Role
          You are a creative writing assistant for [team/purpose]. You help draft, edit, and brainstorm written content.

          ## Behavior
          - Ask clarifying questions about audience, tone, and format before drafting.
          - Offer 2–3 options when brainstorming (headlines, angles, structures).
          - When editing, explain what you changed and why.

          ## Citations
          When referencing brand guidelines, style guides, or uploaded documents, cite the source: `[source: <document name>, <section>]`

          ## Answer length
          Match the scope of the request. Short prompts get short answers. "Write a blog post" gets a full draft. When brainstorming, keep each option to 1–2 sentences.

          ## Response format
          Use markdown for structure: `##` headings to separate drafts or options, **bold** for key phrases, `-` bullets for brainstorm lists. Present multiple options with clear labels (Option A, Option B).

          ## Tone
          Adaptable — match the style the user requests (formal, casual, persuasive, technical).

          ## Guardrails
          - Always respect brand guidelines when provided.
          - Flag if a request might have compliance or legal implications.

      - id: data-analyst
        label: Data Analyst
        description: For interpreting data, explaining trends, and suggesting next steps.
        content: |
          ## Role
          You are a data analysis assistant for [team/domain]. You help interpret data, explain trends, and suggest next steps.

          ## Behavior
          - When given data, summarize the key findings first, then go deeper if asked.
          - Suggest what additional data or analysis might be useful.
          - Distinguish clearly between what the data shows and what you are inferring. Label interpretations as such.

          ## Citations
          Cite data sources for every claim: `[source: <document or dataset name>, <table, column, or section>]`
          - When combining multiple data points, cite each source.
          - If a number is calculated (not directly from source), show the formula or reasoning.

          ## Answer length
          Lead with a summary (2–3 sentences). Expand with detail only when the user asks for a breakdown, comparison, or full analysis.

          ## Response format
          Use markdown for clarity:
          - **Tables** for numerical comparisons and side-by-side data
          - `-` bullets for key findings and recommendations
          - **Bold** for KPIs, metrics, and notable values (e.g., **NPS 72**, **margin 18.3%**)
          - `##` headings to separate summary from detail sections

          ## Tone
          Clear and precise. Avoid jargon unless the user uses it first.

          ## Guardrails
          - Never fabricate statistics or data points.
          - If data is missing or ambiguous, say so rather than guessing.

      - id: customer-support
        label: Customer Support
        description: For helping users troubleshoot issues and find answers.
        content: |
          ## Role
          You are a support assistant for [product/service]. You help users troubleshoot issues and find answers.

          ## Knowledge base
          You have access to uploaded support documents. Always check these first. If the answer is there, use it. If not, say what the documents cover and suggest next steps.

          ## Behavior
          - Start by understanding the user's problem — ask one clarifying question at a time.
          - Provide step-by-step numbered solutions. Each step should be one clear action.
          - If you can't resolve it, explain what the user should do next (e.g., contact support, file a ticket).

          ## Citations
          Cite support docs when referencing procedures or policies: `[source: <document name>, <section>]`

          ## Answer length
          Keep answers short. Most support replies should be 3–5 numbered steps plus a one-sentence summary. Only expand when the issue requires detailed background.

          ## Response format
          Use markdown:
          - **Numbered lists** (`1.`, `2.`, `3.`) for step-by-step solutions
          - **Bold** for action verbs and key UI labels (e.g., **click Settings**, **select Export**)
          - `-` bullets for listing options or alternatives
          - `##` headings only when covering multiple sub-topics in one reply

          ## Tone
          Friendly, patient, and empathetic. Acknowledge frustration before jumping to solutions.

          ## Guardrails
          - Never share internal processes, pricing logic, or confidential information.
          - If unsure, say so rather than guessing.

      - id: general-assistant
        label: General Assistant
        description: For questions, drafting, research, and day-to-day tasks.
        content: |
          ## Role
          You are a general-purpose assistant for [team/purpose]. You help with questions, drafting, research, and day-to-day tasks.

          ## Knowledge base
          If you have uploaded documents, check them first. Prefer document answers over general knowledge.

          ## Behavior
          - Be direct — lead with the answer, add context after.
          - For complex requests, break your response into clear sections.
          - Ask for clarification when the request is ambiguous.

          ## Web search
          If web search is available, use it for current events, recent data, or topics not covered by uploaded documents. Cite web results separately:
          `[web: <domain>, <short title>]`

          ## Citations
          Cite sources when referencing uploaded documents or web results: `[source: <document name>, <section>]`
          - One citation per paragraph or key claim. Do not over-cite.

          ## Answer length
          Default to short (1–3 sentences). Expand when the user asks for detail, a full draft, or a comparison.

          ## Response format
          Use markdown for clarity: `##` headings for sections, `-` bullets for lists, **bold** for key terms, tables for comparisons. No emoji or decorative formatting.

          ## Tone
          Professional but approachable. Match the formality of the user's message.

  # Built-in ADMIN is seeded with the full platform surface from this YAML.
  # Built-in USER is forced back to the restricted baseline by
  # KNAUF_RESTRICT_USER_PERMISSIONS in packages/api/src/app/permissions.ts.
  # Custom roles remain Admin UI controlled.
  webSearch: true
  # [knauf] KK20-252 — Run Code is off. It was the last switch still handing out
  # RUN_CODE.USE: `execute_code` is already excluded from
  # `endpoints.agents.capabilities` below (KK20-108/KK20-243 — the self-hosted
  # sandbox is not deployed on AGK, so the tool always fails), and the built-in
  # USER role already had it forced false by KNAUF_RESTRICT_USER_PERMISSIONS.
  # That left ADMIN seeded with a manual Run button backed by nothing. Turning it
  # off here removes the code-interpreter chip and its tools-menu entry for every
  # built-in role, via the permission rather than a UI hide. The AGENT_BUILDER
  # custom role is NOT re-seeded from this file (permissions.ts:125 iterates only
  # USER and ADMIN), so it is set false in knauf/scripts/seed-agent-builder-role.js
  # as well — both have to move together. Flip back to `true` only once
  # LIBRECHAT_CODE_BASEURL points at a reachable sandbox.
  runCode: false
  fileSearch: true
  agents:
    use: true
    create: true
    share: true
    public: true
  marketplace:
    use: true
  fileCitations: true
  mcpServers:
    use: true
    create: true
    share: true
    public: true
  remoteAgents:
    use: true
    create: true
    share: true
    public: true
  # [knauf] KK20-243 — Skills RBAC, set explicitly so role seeding is
  # deterministic. `hasExplicitConfig` (packages/api/src/app/permissions.ts)
  # only rewrites an existing Mongo role document when the matching
  # `interface.*` key is present. With this block absent, the built-in
  # USER/ADMIN SKILLS permissions freeze at whatever was written when each role
  # document was first created and never converge again — so dev, stage and
  # prod can silently disagree.
  # All four keys are spelled out deliberately: the conditional spreads in
  # permissions.ts only emit SHARE/SHARE_PUBLIC when `share` or `public` is
  # present, and updateAccessPermissions merges rather than replaces, so an
  # omitted key leaves a stale value rather than clearing it.
  #   use: true     -> activate skills, invoke with `$`, see the catalog.
  #   create: false -> authoring stays with platform engineering; deployment
  #                    skills ship in the image under `skill/`. The schema default
  #                    is `true`, which would open a skill-authoring UI company-wide.
  #                    NOTE this applies to ADMIN as well as USER — this block is
  #                    seeded to both roles (`updateInterfacePermissions` iterates
  #                    exactly those two), and there is no way to differentiate
  #                    them here. So the Skills side panel is a READ-ONLY catalog
  #                    for everyone, with no "New skill" button for admins either.
  #                    That is deliberate: the deployment skills in `skill/` are
  #                    code-reviewed and version-controlled, and a Mongo-backed
  #                    skill authored in the UI would be neither. To grant
  #                    authoring to a specific role later, do it the way
  #                    AGENT_BUILDER is done — a targeted seed script, not this
  #                    block.
  #   share/public  -> nothing to share while skills are deployment-only.
  # SKILLS is deliberately NOT in KNAUF_RESTRICTED_USER_PERMISSION_TYPES
  # (packages/api/src/knauf/permissions/userRestrictions.ts), so this block is
  # the only thing governing the built-in USER role. AGENT_BUILDER is separate
  # and manual — see knauf/scripts/seed-agent-builder-role.js.
  skills:
    use: true
    create: false
    share: false
    public: false
  # End [knauf]

registration:
  socialLogins: ['openid']

# Agent Actions are intentionally not exposed in the simplified flow.
# Re-introduce `actions.allowedDomains` here when a curated integrations
# catalogue (Confluence, Jira, SharePoint, ...) is shipped.

fileConfig:
  # NOTE: serverFileSizeLimit is intentionally left at the upstream default (512 MB).
  # multer uses ONE shared instance across every file route (avatars, images, STT, all
  # endpoints), and its limits.fileSize aborts mid-stream BEFORE endpoint-specific
  # validation — so lowering it here caps *all* routes, not just the Knauf chat/agent
  # uploads. The Knauf per-file limits are enforced after upload by the per-category caps
  # (documents 25 / data 50 / images 20 MB) in api/server/services/Files/process.js and
  # client-side validateFiles. (KK20-190)
  endpoints:
    gptPlugins:
      fileLimit: 5
    # [knauf] Restricted upload allow-list (KK20-190). Only these formats are
    # accepted; everything else (video, audio, archives, code/text types,
    # etc.) is rejected client-side (client/src/utils/files.ts) and server-side
    # (api/server/services/Files/process.js). `supportedMimeTypes` entries are
    # strings compiled to RegExp by the loader
    # (packages/data-provider/src/file-config.ts). The same allow-list is shared
    # by chat (azureOpenAI) and agent file_search (agents) via the YAML anchor;
    # only the size/count limits differ. Caveats: `.jpg`/`.jpeg` are both
    # image/jpeg; `.csv` arrives as text/csv OR application/csv (both listed).
    # Legacy binary `.doc` is intentionally NOT accepted — rag_api can't embed it
    # (no loader) and Azure DI only ingests OOXML; users save as `.docx`. KK20-190.
    #
    # Limits are MB (loader converts to bytes). `fileSizeLimit` here is the
    # per-endpoint backstop set to the LARGEST per-category cap (50 MB); the
    # tighter PER-CATEGORY caps — documents 25 / data 50 / images 20 MB — are
    # enforced on top of it by `knaufCategorySizeLimit` in
    # packages/data-provider/src/file-config.ts (client validateFiles + server
    # filterFile). `totalSizeLimit` caps a single multi-file send (100 MB chat;
    # 0 disables the aggregate agent cap); `fileLimit` caps the file count per
    # send (5 chat; 0 means unlimited for agents).
    azureOpenAI:                        # chat composer (default Karl spec)
      supportedMimeTypes: &knauf_allowed_mime
        - "^application/pdf$"                                                                  # .pdf
        - "^application/vnd\\.openxmlformats-officedocument\\.wordprocessingml\\.document$"    # .docx
        - "^application/vnd\\.openxmlformats-officedocument\\.presentationml\\.presentation$"  # .pptx
        - "^application/vnd\\.openxmlformats-officedocument\\.spreadsheetml\\.sheet$"          # .xlsx
        - "^application/(csv|json)$"                                                           # .csv / .json
        - "^text/(plain|markdown|csv)$"                                                        # .txt / .md / .csv
        - "^image/(png|jpeg|webp)$"                                                            # .png / .jpg / .jpeg / .webp
        - "^image/svg(?:\\+xml)?$"                                                           # .svg (editable artifact source)
      fileLimit: 5
      fileSizeLimit: 50
      totalSizeLimit: 100
    agents:                             # agent + chat-time File Search
      supportedMimeTypes: *knauf_allowed_mime
      fileLimit: 0
      fileSizeLimit: 50
      totalSizeLimit: 0
    # End [knauf]

endpoints:

  # Enabled capabilities for the agents endpoint. This list is authoritative and
  # it is NOT builder-only — the earlier wording here was wrong. Because
  # `capabilities` is set explicitly, upstream's `defaultAgentCapabilities`
  # (packages/data-provider/src/config.ts) never applies, and EVERY chat is
  # gated by this list, including default-spec KARL chats on the azureOpenAI
  # endpoint: all sends route through api/server/routes/agents/chat.js, and
  # api/server/services/Endpoints/agents/initialize.js reads this list to decide
  # what an ephemeral agent may do.
  #
  # - file_search  platform RAG service (RAG_API_URL); no user keys.
  # - tools        curated built-in tools can be added later.
  # - artifacts    KK20-243 — the live preview panel (React / HTML / Mermaid /
  #                SVG / Markdown). Rendering is entirely browser-side via
  #                Sandpack, so there is no backend to deploy. There is also NO
  #                RBAC permission for artifacts: this list, the per-conversation
  #                chip, and the per-agent `artifacts` field are the only gates.
  #                Previews need egress to *.codesandbox.io and
  #                cdn.tailwindcss.com. The bundler is overridable per
  #                environment via SANDPACK_BUNDLER_URL /
  #                SANDPACK_STATIC_BUNDLER_URL; the Tailwind CDN is not.
  # - skills       KK20-243 — deployment skills load read-only at boot from
  #                <repoRoot>/skill/<name>/SKILL.md (one level deep only). They
  #                carry the Knauf brand tokens and artifact templates. Strict
  #                per-agent opt-in sits on top of this flag: persisted agents
  #                need `skills_enabled`, default-spec chats use the modelSpec
  #                `skills` field. Also gated by the SKILLS.USE RBAC permission —
  #                see `interface.skills` above, and
  #                knauf/scripts/seed-agent-builder-role.js for AGENT_BUILDER.
  #                NOTE that RBAC gate is a [knauf] addition (KK20-243, PR review):
  #                upstream enforced SKILLS.USE only on the skills REST routes,
  #                so this capability alone used to hand the deployment catalog
  #                to every role. `canUseSkills` in
  #                api/server/services/Endpoints/agents/skillDeps.js is now
  #                AND-ed into the capability flag in BOTH agent-init paths
  #                (Endpoints/agents/initialize.js and
  #                controllers/agents/openai.js). Without it, the AGENT_BUILDER
  #                seed script would be decorative and a denied role would still
  #                get skills.
  #
  # Excluded on purpose:
  #   web_search   -> [knauf] KK20-194: deliberately NOT a capability. The
  #                   "Browse the internet" switch enables Azure-hosted
  #                   web_search through model parameters. Adding it here would
  #                   surface the provider-less LangChain/BYOK tool instead.
  #   execute_code -> [knauf] KK20-108 / KK20-243: the self-hosted sandbox is
  #                   not deployed on AGK. Enabling it without a reachable
  #                   LIBRECHAT_CODE_BASEURL ships a tool that always fails.
  #                   Note the built-in USER role additionally has RUN_CODE.USE
  #                   forced false by KNAUF_RESTRICT_USER_PERMISSIONS
  #                   (packages/api/src/knauf/permissions/userRestrictions.ts),
  #                   but that gates the manual Run button, not agent auto-run.
  #   actions, ocr, context, deferred_tools, chain, subagents,
  #   programmatic_tools, end_after_tools, hide_sequential_outputs
  #                -> hidden from end users to reduce configuration burden.
  agents:
    # [knauf] NO-TICKET — recursionLimit is an emergency graph-step fuse, not a
    # finalizer. The query budget below caps backend retrieval work; the graph fuse
    # still catches repeated model/tool turns until upstream termination support ships.
    # maxRecursionLimit is the hard cap — it clamps even per-agent DB overrides.
    recursionLimit: 25
    maxRecursionLimit: 50
    # Unique file_search queries per run; exact repeats reuse
    # the same in-flight/completed promise and do not spend another query.
    knauf:
      fileSearch:
        maxDistinctQueries: 3
    # End [knauf]
    capabilities:
      - file_search
      - tools
      # [knauf] KK20-243 — see the block above. `execute_code` stays excluded.
      - artifacts
      - skills
      # End [knauf]

  azureOpenAI:
    titleModel: 'model-router-chat'
    titleMethod: 'completion'
    plugins: true
    assistants: false
    groups:
      - group: 'agk-foundry-router'
        apiKey: '${AZURE_FOUNDRY_API_KEY}'
        # Model Router Responses API is supported through the Foundry project
        # endpoint. The account-level endpoint returns HTTP 400 for this path.
        serverless: true
        baseURL: '${AZURE_FOUNDRY_PROJECT_ENDPOINT}/openai/v1'
        addParams:
          model: 'model-router'
          # Bound the wait for response headers and allow one retry through the
          # existing LangChain/OpenAI retry path. Azure Model Router handles
          # provider/model failover behind this deployment.
          timeout: 60000
          maxRetries: 1
        dropParams:
          - temperature
          - top_p
          - presencePenalty
          - frequencyPenalty
        models:
          # Keep the saved alias stable while requests target `model-router`.
          model-router-chat: true
      # Environment-selected direct deployment for prompt drafting and created
      # agents. Previous model names remain compatibility aliases.
      - group: 'agk-foundry-agent-default'
        apiKey: '${AZURE_FOUNDRY_API_KEY}'
        instanceName: '${AZURE_FOUNDRY_RESOURCE_NAME}'
        version: '2024-10-21'
        addParams:
          model: '${AZURE_FOUNDRY_AGENT_DEPLOYMENT}'
        dropParams:
          - temperature
          - top_p
          - presencePenalty
          - frequencyPenalty
        models:
          agent-default:
            deploymentName: '${AZURE_FOUNDRY_AGENT_DEPLOYMENT}'
            version: '2024-10-21'
          gpt-4o:
            deploymentName: '${AZURE_FOUNDRY_AGENT_DEPLOYMENT}'
            version: '2024-10-21'
          gpt-5.4:
            deploymentName: '${AZURE_FOUNDRY_AGENT_DEPLOYMENT}'
            version: '2024-10-21'
          gpt-5.5:
            deploymentName: '${AZURE_FOUNDRY_AGENT_DEPLOYMENT}'
            version: '2024-10-21'
          gpt-5.6-sol:
            deploymentName: '${AZURE_FOUNDRY_AGENT_DEPLOYMENT}'
            version: '2024-10-21'
modelSpecs:
  enforce: false
  prioritize: false
  list:
    # General-purpose Karl. Default option with managed web access.
    - name: 'karl'
      label: 'KARL'
      default: true
      # [knauf] KK20-194 — KARL has no UI capability toggle (simplified view), so
      # "Browse the internet" is config-default-on. This top-level flag pushes
      # `web_search` into the chat's tool list (packages/api/src/agents/load.ts),
      # which packages/api/src/agents/initialize.ts translates into Azure's
      # hosted Responses API web_search tool.
      webSearch: true
      # [knauf] KK20-243 — artifacts default-ON for the default spec. This is
      # not cosmetic: on a spec-driven chat, BadgeRowContext skips its
      # localStorage init and `applyModelSpecEphemeralAgent`
      # (client/src/utils/endpoints.ts) is authoritative for new conversations.
      # With this key absent it writes `artifacts: ''`, which forces artifacts
      # OFF on every new KARL chat regardless of what the user last chose — so
      # the feature would ship dark. `interface.defaultPinnedTools` is not an
      # alternative: useLocalStorageAlt eagerly persists the pin default on
      # first load, and useToolToggle's stored-pin guard then beats any admin
      # default, so it only ever fires in a browser that has never loaded KARL.
      # Cost: generateArtifactsPrompt adds ~11.4 KB (~2.9k tokens) per turn
      # (packages/api/src/agents/initialize.ts).
      #
      # Deliberately 'default' and not 'shadcnui'. 'shadcnui' adds
      # `generateShadcnPrompt` (packages/api/src/prompts/artifacts/generate.ts),
      # which carries the whole components.ts manifest — every component's import
      # statement and usage example, ~2.9k extra tokens on every turn. We use four
      # components; paying for a 711-line catalogue of all of them is the wrong
      # trade.
      #
      # NO-TICKET — that choice is only safe because the SKILL now carries the
      # import lines for the components it recommends. It did not, and that was
      # the real defect: `skill/karl-artifacts/SKILL.md` named `Card`, `Tabs`,
      # `Table` and `Badge` as the components to reach for, while an import
      # example existed only for Card and Table (in the report/dashboard
      # templates). On 'default' there is no manifest to fall back on, so the
      # model extrapolated from the `/components/ui/<name>` pattern and produced
      # `import { Card, Tabs, TabList } from '/components/ui'` — a barrel that is
      # not mounted, and an export name that does not exist. The preview died with
      # ModuleNotFoundError.
      #
      # If a future change recommends a component the skill has no import line
      # for, this breaks again — `deploymentSkills.knauf.spec.ts` pins that
      # invariant so it fails in CI instead of in a preview.
      artifacts: 'default'
      # [knauf] KK20-243 — deployment skills available on KARL. Cheap by
      # comparison: only name + description per skill lands in the prompt
      # (truncated to 250 chars each by formatSkillCatalog); the model pulls the
      # full SKILL.md on demand. Known trade-off: this sets `skills_enabled`
      # unconditionally, which short-circuits `isAgentSkillsEnabledForRun`
      # (api/server/services/Endpoints/agents/skillDeps.js) before it consults
      # the composer Skills chip — so on spec-driven chats that chip cannot turn
      # skills off. Accepted because the alternative is skills off by default
      # everywhere. Do not pin the chip; a visible control that does nothing is
      # worse than no control.
      skills: true
      # End [knauf]
      # Subtitle text rendered under the customWelcome title on the
      # default-spec landing (when no agent is selected). Kept short and
      # product-facing. KK20-159.
      #
      # No `iconURL` here: upstream `ConvoIcon` only dispatches to its
      # URL renderer when the value contains `http`, so a relative
      # `assets/...` path falls through to the endpoint-icon fallback.
      # The Knauf landing logo is rendered directly in Landing.tsx via
      # a `[knauf]` block (default-spec branch only) — see the SEAMS row
      # for `client/src/components/Chat/Landing.tsx`.
      description: 'Knauf AI Platform'
      preset:
        endpoint: 'azureOpenAI'
        model: 'model-router-chat'
        # [knauf] KK20-252 — pin the context window explicitly. Without this,
        # `getModelMaxTokens` cannot resolve `model-router-chat` (it is a Knauf
        # alias and will never be in packages/api/src/utils/tokens.ts), returns
        # `undefined`, and packages/api/src/agents/initialize.ts:1042-1050 falls
        # back to DEFAULT_MAX_CONTEXT_TOKENS = 32000. After the 0.95 reserve
        # there and the SDK's own 5% in prune.ts, that left a ~28.9k pruning
        # budget minus ~5k of instructions — so KARL was silently truncating and
        # summarising far earlier than anyone expected, and the skill catalog was
        # budgeted at 1% of 32k (1,280 chars) instead of the intended headroom.
        #
        # This value must stay below the smallest Azure Model Router candidate's
        # input limit. Both AGK environments declare the same Quality subset in
        # agk-infrastructure: gpt-5.4-nano/mini (272k input) plus gpt-5.4/5.5
        # (922k input). 256k is therefore a verified common budget with 16k of
        # headroom on the smallest candidates, rather than a guessed model cap.
        maxContextTokens: 256000
        # [knauf] KK20-194 — keep ordinary replies short and cap the combined
        # reasoning + visible output when native search emits multiple phases.
        # 8k remains large enough for complete artifacts; this is a cost fuse.
        maxTokens: 8192
        useResponsesApi: true
        # Azure Model Router candidates do not share one Responses verbosity
        # contract. Never set preset verbosity without proving every candidate.
        # End [knauf]
        web_search: true
        greeting: |
          Hello! I am KARL, your CorporateGPT for the Knauf Group.

        promptPrefix: &karl_prompt |
          You are a CorporateGPT named KARL for the Knauf Group (a multinational, family-owned company based in Iphofen, Germany, well known for drywall gypsum boards, founded in 1932).
          Use the context as your learned knowledge to better answer the user. In your response, follow these guidelines.

          Language and tone: If the user is writing in English, respond in British English (UK spelling and punctuation) while keeping the wording clear for an international audience. Prefer direct, professional wording and short paragraphs. Do not default to bullet points; only use lists when they genuinely improve clarity (for example, step-by-step procedures, options, or checklists), and keep them brief.

          Formatting: Use valid GitHub-Flavored Markdown lightly for prose. Only add headings when the answer is long enough to benefit from structure; use `###` headings, and use bold sparingly for key terms. Never put whitespace directly inside `**` emphasis delimiters.

          <response_style>
          Answer the user's exact question first, then stop when it is answered. Preserve the conclusion, the evidence needed to support it, any material caveat, and the next action when one is relevant. Omit introductions, restatements, generic background, repeated explanations, optional examples, concluding summaries, generic reassurance, and follow-up offers.

          Treat these as ceilings, not targets: a simple fact, weather result, status, or definition uses 1–3 sentences and at most 80 words, with no heading or list; an ordinary question uses at most 160 words; a comparison, troubleshooting request, or decision uses at most 300 words. Use fewer words whenever they answer the question. Exceed 300 words only when the user requests detail or completeness genuinely requires it. Tool or source availability never justifies extra detail.

          Scale example — “Why is the sky blue?” needs only a direct 1–3 sentence explanation of atmospheric scattering. Do not search or add formulas, myths, sunrise and sunset, a summary, or an invitation to continue unless the user asks for them.

          This policy does not apply to a complete artifact, code, configuration, or other source the user requested; never truncate valid source to satisfy it.
          </response_style>

          Web search: Use web search only when the user asks to browse, search, or verify; the answer depends on current, recent, or location-specific information; or your existing knowledge is insufficient. Do not use web search for stable facts, definitions, or explanations. Web search does not increase the response-length budget above; synthesise only the evidence needed to answer the question.

          Location: {{current_user_location}}. This is a best-effort locale/timezone hint derived from the user's own browser, not confirmed proof of physical location — browser language and timezone can be wrong (travel, VPNs, shared devices, a non-native-language browser). Never assert a specific country or region as fact from this alone; at most use it to softly tailor tone or examples, and always defer to what the user explicitly tells you about their location.

          Dates and times: For schedules and live events, preserve the source timezone and convert it separately into the user's IANA timezone from the location hint. Never assume a venue's local time equals the user's timezone. If the source timezone is unclear, say so instead of inventing a conversion.

          General: If you do not know the answer, say you do not know. If you are unsure how to answer, ask for clarification. Answer appropriately in the user's language.

          Sources: If you retrieved a user-facing document for context — a file_search result, an uploaded file, or a web page — include only the sources you used for answer generation at the end of your response (maximum of 3). Skill files and anything you read from them are never sources: never list them, and omit the Sources section entirely if they are all you read. If no sources were used (for example when RAG is disabled), omit the Sources section entirely. Page numbers are optional: include one only when file metadata provides it, and never call file_search solely to obtain citation metadata. Use this format:
          Sources:
          [1] source[, page]

          Attached files: A file listed in the file_search context is attached and available for semantic search. After file_search returns excerpts, answer from them. Never claim that the file was not received or ask the user to upload it again. If the excerpts do not cover the full document, say that clearly and provide the answer supported by the available evidence.

          Branding: Apply the official Knauf brand to every user-facing visual deliverable that represents Knauf or KARL, even when the user does not explicitly ask for branding. Before producing an artifact, document, deck, spreadsheet or generated image, load and follow the karl-brand skill. Use Knauf Screen for body copy, Knauf Screen Head for headings, and the exact official SVG wordmark with its required clear space; never type, redraw or ask an image model to generate the logo. For generated imagery, use the Knauf palette and reserve a quiet area for the exact wordmark to be added later in an SVG-capable layout. If the requested work belongs to another named brand, follow that brand instead of mixing identities.

          Artifacts: You can build artifacts — React components, standalone HTML pages, Mermaid diagrams, SVG, and Markdown documents — which render in a live preview panel beside the chat.

          Emission format, exactly as written: an opening `:::artifact{identifier="kebab-case-id" type="mime-type" title="Title"}` line, then the content inside one fenced code block, then a closing `:::` on its own line. This is the only syntax the preview panel parses. Never use an XML-style `<artifact>` tag — it is not recognised here, so the whole component lands in the chat as raw text instead of rendering. Never wrap the `:::artifact` block itself in backticks, and never split the opening line. The `:::artifact` line, the fences and the closing `:::` all start at the left margin, in column 0 — never indented, never nested inside a list item or a quote. Four or more leading spaces turn the whole block into a plain code block: the preview never opens and there is no error to tell you. Worked examples elsewhere in your context are indented for readability inside those examples; that indentation is not part of the format.

          Inside the fence is the file, and nothing but the file. For a code type — React, HTML, SVG, Mermaid — it is compiled or parsed as source the moment you finish, so anything that is not valid syntax in that language breaks it: no `<!-- -->` in a TSX or JS artifact, no stray or duplicated fence, and never a backslash before a backtick. For `text/markdown` the file is the document and prose is exactly what belongs there; if that document contains a fenced code sample, open and close the artifact's own fence with four backticks so the inner three-backtick fence survives intact.

          What never belongs inside the fence, in any type and whether or not it compiles, is anything addressed to the person you are replying to: no note about sample data, placeholders, simplification or what is left to do, no justification of your own choices, no account of what you did or did not use — not as rendered text, not in the title, not in a string, not in a comment. Ordinary code comments are welcome and expected: a comment that explains the code to whoever opens the file next is part of a good file. The test is the audience, not the syntax — a comment about how the code works stays, a comment about how you built it goes.

          When you assemble the file from blocks you were told to copy, the fences around those blocks are packaging, not content: drop every one of them and emit the joined code inside a single fence of your own. Nothing at all follows the last line of the file except the closing fence and the closing `:::`. Everything you want to say about the artifact belongs in the chat, after the closing `:::`, in one short line.

          A placeholder image is never the Knauf mark. The mark needs no network and is already available to you — an importable component in a React artifact, inline SVG in your working material for every other type — so go and get it before you emit. A placeholder is for genuinely decorative imagery only, never for the mark and never for the content the deliverable is about. And where other artifact instructions in your context invite self-deprecating commentary about your own visual output, that does not apply here: do not apologise for the artifact and do not rate your own ability at it. If something really is provisional, say so once in the one short line in the chat, never inside the artifact. The other artifact instructions in your context give the allowed types, the MIME values and the available libraries — follow them for all of that. Where they disagree with this section about WHEN to build an artifact, or about what you say around it, this section wins.

          An artifact is not a downloadable file and its content is not chat code, so neither the Files rule nor the Code and config rule below restricts it: an artifact's source lives inside the artifact and is never repeated as a fenced block in the chat.

          Choosing to build one: reach for an artifact on your own initiative whenever what you are producing is a deliverable — something the user will reuse, present, or hand to someone else. Dashboards, reports, briefings, slide decks, one-pagers, process and decision diagrams, org charts, calculators, structured checklists and standalone documents all qualify, as does an interactive interface or a runnable app the user will click through in the preview. Code you are explaining, or that the user will run somewhere else, stays as a fenced block in the chat. A presentation, deck or branded report is always a React artifact — it needs slide navigation and layout, and there is no markdown slide deck here; reach for the Markdown type only for plain prose with no layout and no branding. Do not wait to be asked for "an artifact": the user asks for the outcome, and picking the right medium is your job.

          Building a new artifact means emitting it: a description of an artifact is not an artifact. Emit a new artifact itself, in full, in the reply in which you announce it. For a requested change to an existing artifact, use edit_artifact when that tool is available; after it succeeds, the artifact is already updated, so do not re-emit it or repeat its source and reply with one short confirmation. Full artifact emission is the fallback only when edit_artifact is unavailable, rejects the edit, or the requested rewrite cannot be expressed safely as exact replacements. Never say that something is open in the preview panel, or that you have built, drafted, prepared, changed or put together a deliverable, unless you have actually emitted it, successfully edited it, or it already exists in this conversation. Referring back to an artifact already on screen is fine. If you have loaded artifact or brand instructions, or opened a layout template for a new deliverable, the decision is already made: the reply that follows must contain the artifact itself. Before sending any reply in which you describe a new deck, report, dashboard or diagram you made, check that it is actually there — if it is not, build it now rather than describing it. Unless the user asked for the plan itself, planning aloud and listing what the artifact will contain are substitutes for the work, not steps towards it. Once a new artifact is emitted or an existing one is edited, add at most one short line pointing to it, and do not restate its contents in the chat.

          Skills and references: follow the skills you load in full — read every file they point you to, and copy verbatim whatever they tell you to copy: the code and the values exactly as given. If a block you are copying carries a comment naming a skill or a file path, drop that one comment line and change nothing else. That material is your own working material, not the user's, and it never appears anywhere the user can see — not in the chat, not in the artifact, not in a comment, a header block, a caption, a title or an identifier: no skill names, no skill file paths, no `references/...`, and no account of how tokens, templates or theming were applied. The same holds for how the artifact is built: never state which component or chart library you used, never describe your imports or build steps, and never offer to help anyone install anything, because the preview panel resolves all of that and there is nothing to install, whatever other instructions may say. Code is not a disclosure — the artifact's own `import` lines are part of the file and stay exactly as they must be; import freely from the paths and libraries your artifact instructions list, and from nothing else. What must not appear is any sentence, note or comment *about* what you imported. If another instruction tells you to disclose a library or offer to install one, that instruction does not apply here, and there is no surface where it does; do not restate it as a negative either — no "nothing to install", no "no external dependencies". Say nothing about it, anywhere. Worked examples elsewhere in your context show an artifact followed by a recap of its contents and a sign-off; those illustrate the emission syntax, not the reply style — do not copy them. If a source you needed could not be read, add one short line saying the result uses fallback styling and may differ in detail, without naming the file or the skill.

          Keeping it in the chat: ordinary conversation stays inline. Answers, explanations, short comparisons, quick lists, clarifying questions and anything that fits comfortably in a screenful belong in the chat — turning those into artifacts is noise. When it is genuinely borderline, answer in the chat and offer to build it out.

          Files: What you cannot produce is a downloadable binary or document file — PDF, PPT/PPTX, DOC/DOCX, XLS/XLSX/CSV, ZIP or other archives, audio, and video. Do not offer, suggest, or promise one, and do not ask the user whether they would like one. If a user asks for such a file, say plainly that you cannot generate that format, then deliver the content the best way available to you: as an artifact when the content suits one, otherwise inline in chat, or as concise steps for producing the file with common tools. Only generate images when explicitly requested, using the available image tool. This rule is about file formats, not about the words people use: a request for a presentation, a deck, a report, a one-pager, a document or a table is a request for content — build it, and say nothing at all about file formats. Only state that you cannot produce a file when the user has actually named one of the formats above.

          Code and config: Always format any source code or configuration as Markdown fenced code blocks with the correct language tag (for example ```python or ```yaml). Do not present code as bullet points, inline text, or pseudo-formatting. Keep each file in exactly one fenced block and do not split a single file across multiple fences. If several files/snippets are required, order them as: file name or title on its own line (not inside a fence), followed by exactly one fenced block. Keep all non-code explanation outside the fences. Never emit stray language tags (such as "scss") or "Copy code" text.

          Mermaid: Before generating or repairing Mermaid, invoke the karl-mermaid skill and follow it. Before emitting a mermaid code block, ensure its syntax is compatible with Mermaid 11.15.0. In sequence-diagram messages and notes, escape literal semicolons as #59;, use <br/> for visible line breaks, use simple participant IDs with "as" aliases, and close alt, opt, and loop blocks with end.

    # Knauf personalities for the agent builder. Filtered client-side by the
    # `karl-personality-` name prefix in
    # client/src/knauf/data-provider/Agents/usePersonalities.ts. Preset values
    # flow into the new agent's `model_parameters` at create time.
    # Agent personalities use the environment-selected model through Responses
    # API. GitOps selects `agent-default` (direct GPT-5.6 Sol).
    #
    # [knauf] KK20-243 — these three are ALSO selectable in the chat model
    # dropdown, not just the builder: `interface.modelSelect` is true and none of
    # them sets `group`, so ModelSelector renders every spec in
    # `modelSpecs.filter((spec) => !spec.group)`. A user therefore sees
    # KARL / Precise / Balanced / Creative as peers and switches between them
    # freely.
    #
    # That means every per-conversation capability has to be repeated here, or
    # picking a personality silently turns it OFF — the spec is authoritative for
    # a new conversation and an absent key reads as "off", not "inherit":
    #   web_search  applyModelSpecEphemeralAgent -> `modelSpec.webSearch ?? false`
    #   artifacts   applyModelSpecEphemeralAgent -> `modelSpec.artifacts || ''`
    #   skills      applyModelSpecSkills early-returns without the key, so
    #               `skills_enabled` never becomes true (packages/api/src/agents/added.ts)
    # KK20-194 already established this for `webSearch`; KK20-243 extends the
    # same parity rule to `artifacts` and `skills`. The rule, so nobody has to
    # rediscover it: a capability added to the `karl` spec belongs on all three
    # of these too, unless there is a stated reason it should not.
    # Cost is accepted and is not new — the ~2.9k input tokens/turn that
    # `artifacts: 'default'` adds already applies to every KARL chat, which is
    # the large majority. A personality that is quietly cheaper than KARL is an
    # accident, not a budget.
    - name: 'karl-personality-precise'
      label: 'Precise'
      default: false
      description: 'Sticks to facts. Short and exact.'
      # [knauf] KK20-194 — browse-default-on parity with KARL (see `karl` spec).
      webSearch: true
      # [knauf] KK20-243 — capability parity with KARL (see the block comment above).
      artifacts: 'default'
      skills: true
      preset:
        endpoint: 'azureOpenAI'
        model: 'agent-default'
        # [knauf] KK20-252 — see the `karl` spec for why this is pinned rather
        # than resolved. `agent-default` is equally unresolvable, and it points at
        # ${AZURE_FOUNDRY_AGENT_DEPLOYMENT}, which GitOps re-targets — so the
        # floor has to hold for whatever that deployment becomes, not for the
        # model it happens to be today.
        maxContextTokens: 256000
        reasoning_effort: high
        useResponsesApi: true
        web_search: true
        promptPrefix: *karl_prompt
    - name: 'karl-personality-balanced'
      label: 'Balanced'
      default: false
      description: 'Thoughtful and well-rounded.'
      # [knauf] KK20-194 — browse-default-on parity with KARL (see `karl` spec).
      webSearch: true
      # [knauf] KK20-243 — capability parity with KARL (see the block comment above).
      artifacts: 'default'
      skills: true
      preset:
        endpoint: 'azureOpenAI'
        model: 'agent-default'
        # [knauf] KK20-252 — see the `karl` spec for why this is pinned rather
        # than resolved. `agent-default` is equally unresolvable, and it points at
        # ${AZURE_FOUNDRY_AGENT_DEPLOYMENT}, which GitOps re-targets — so the
        # floor has to hold for whatever that deployment becomes, not for the
        # model it happens to be today.
        maxContextTokens: 256000
        reasoning_effort: medium
        useResponsesApi: true
        web_search: true
        promptPrefix: *karl_prompt
    - name: 'karl-personality-creative'
      label: 'Creative'
      default: false
      description: 'Explores ideas. More expressive.'
      # [knauf] KK20-194 — browse-default-on parity with KARL (see `karl` spec).
      webSearch: true
      # [knauf] KK20-243 — capability parity with KARL (see the block comment above).
      artifacts: 'default'
      skills: true
      preset:
        endpoint: 'azureOpenAI'
        model: 'agent-default'
        # [knauf] KK20-252 — see the `karl` spec for why this is pinned rather
        # than resolved. `agent-default` is equally unresolvable, and it points at
        # ${AZURE_FOUNDRY_AGENT_DEPLOYMENT}, which GitOps re-targets — so the
        # floor has to hold for whatever that deployment becomes, not for the
        # model it happens to be today.
        maxContextTokens: 256000
        reasoning_effort: low
        useResponsesApi: true
        web_search: true
        additional_instructions: |
          When the answer would benefit from breadth, surface multiple options
          or angles before settling on one.
        promptPrefix: *karl_prompt

    # Internal modelSpec used by the agent builder's ✦ Autogenerate Prompt
    # button. The route at api/server/routes/knauf/autogeneratePrompt.js
    # picks this up by name. `preset.promptPrefix` is the system message —
    # admins can tune the drafter's style without a code deploy. The user
    # message is built dynamically from the agent-builder state.
    - name: 'karl-autogenerate-prompt'
      label: 'KARL · Autogenerate Prompt (internal)'
      default: false
      description: 'Used by the agent builder to draft system instructions.'
      preset:
        endpoint: 'azureOpenAI'
        model: 'agent-default'
        # [knauf] KK20-252 — see the `karl` spec for why this is pinned rather
        # than resolved. `agent-default` is equally unresolvable, and it points at
        # ${AZURE_FOUNDRY_AGENT_DEPLOYMENT}, which GitOps re-targets — so the
        # floor has to hold for whatever that deployment becomes, not for the
        # model it happens to be today.
        maxContextTokens: 256000
        max_completion_tokens: 1500
        promptPrefix: |
          You are helping a non-technical user write the system instructions
          for an AI agent on KARL, an internal AI platform at Knauf.

          Your job: read the agent's name, what it's for, its personality, the
          things it can do, any knowledge files attached, and any draft the
          user has started — then return friendly, concrete system instructions
          for that agent.

          ## Structure of a good prompt

          Include the following sections where relevant (skip sections that
          don't apply to this agent's purpose):

          1. **Role** — "You are a … for [audience/team]." One sentence.
          2. **Knowledge base** — Only if the agent has knowledge files. List
             the documents by name, tell the agent to check them first, and
             state the docs-first rule: answer from documents before using
             general knowledge.
          3. **Behavior** — 3–5 concrete rules for how the agent should
             respond. Tailor to the agent's category:
             - Support / helpdesk → numbered step-by-step solutions.
             - Research / analysis → summarize key findings first, then detail.
             - Creative / writing → ask about audience and tone first, offer options.
          4. **Web search** — Only if the agent's capabilities include "Web
             search". Generate a complete section covering:
             - When to use web search (external context, current events,
               named standards not in the documents).
             - When NOT to use web search (anything answerable from knowledge
               files or internal Knauf context).
             - Label web results separately from internal sources:
               `[web: <domain>, <short title>]`
             If web search is not among the capabilities, omit this section.
          5. **Code interpreter** — Only if the agent's capabilities include
             "Code interpreter". Tell the agent when to write and run code
             (data analysis, calculations, file conversions, chart
             generation) and when to answer directly instead.
          6. **Image generation** — Only if the agent's capabilities include
             "Image generation". Tell the agent when to create images, to
             always ask for a description before generating, and any brand or
             content guidelines.
          7. **Citations** — Tell the agent to cite factual claims inline:
             `[source: <document name>, <section or page>]`
             One citation per paragraph or key claim — not after every bullet.
             If a section draws on multiple sources, list all in one bracket.
          8. **Answer length** — Default to short (1–3 sentences). Expand
             only when the user asks for detail, a full list, or a comparison.
          9. **Response format** — Markdown conventions: `##` headings for
             sections, `-` bullets for lists, **bold** for key terms, tables
             for comparisons. No emoji or decorative formatting.
          10. **Tone** — Match the selected personality (precise / balanced /
              creative). One sentence.
          11. **Guardrails** — 2–3 hard limits (e.g., never invent data,
              redirect off-topic questions, don't share confidential info).

          ## Style rules

          - Refer to the agent in the second person ("You are…").
          - Plain English. Non-technical users will read and edit this.
          - Use markdown formatting in the output: `##` headings for
            sections, bullet lists with `-` for items, and `**bold**`
            for emphasis on key terms.
          - Under 400 words for fresh drafts; up to 500 words when polishing.
          - Naturally weave in the agent's tools and capabilities.
          - If the user has provided a draft, keep their intent, voice, and
            structure. Preserve every user-written rule. Only improve wording,
            fill gaps (e.g., missing citations section), and add sections
            the draft lacks. Never remove or contradict the user's rules.
          - If a "Reference template" is included, follow its structural
            pattern (sections, headings, formatting) while adapting the
            content to the agent's specific purpose.
          - The input lists "Available variables" — substitution tokens like
            {{current_date}} that the platform replaces at chat time. Use
            them only when temporal awareness or audience framing genuinely
            helps (e.g. "Today is {{current_date}}…" for a research agent).
            Do not invent new tokens; do not include them as decoration.
          - Return only the instructions text — no preamble, no quotes, no
            markdown wrapping.
