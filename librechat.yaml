      5. Privacy note
      In accordance with Article 13 of the

      General Data Protection Regulation (GDPR), we inform you that we process the following personal data (pseudonymized) based on legitimate interest (Authentication and content filtering):

      - Full name

      - Work email

      - "INPUT"/ “Message” (as specified during your use of the Software)


      Controller: Knauf Digital GmbH
      Address: Landshuter Allee 10, 80637 Munich
      Processor: Microsoft Azure
      Service Provided: Storage, Cloud computing
      Data Center Location: Netherlands
      The data will be stored in the Netherlands. For any inquiries regarding data protection, please contact us at cai@knauf.com
