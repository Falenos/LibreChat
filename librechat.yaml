      · to revoke your consent
      at any time in accordance with Art. 7 (3) GDPR. This has the consequence that we are no longer allowed to continue the data processing based on this consent for the future.


      6. AI Output and User Responsibility
      Karl is an AI assistant and may produce inaccurate, incomplete, outdated, or misleading responses. Outputs should not be treated as authoritative advice or as a substitute for professional judgment.

      You are responsible for reviewing, validating, and independently verifying any information before relying on it, especially for business, legal, financial, technical, safety-related, or other important decisions. Do not rely solely on Karl's responses without appropriate human review and additional research.


      7. Data Storage and Security
      We implement appropriate technical and organizational measures to ensure a level of security appropriate to the risk of the personal data we process. Your data is stored securely in the Netherlands.


      8. Termination
      This Agreement is effective until terminated. Company may terminate this Agreement at any time without notice if you breach any term hereof. Upon termination, you shall cease all use of the Software.


