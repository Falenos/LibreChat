# LibreChat Configuration
# Based on new version 1.3.8
# Old production values merged in

version: 1.3.13

cache: true

# [knauf] KK20-252 — state summarization explicitly. This block previously did
# not exist, which did NOT mean "off": `resolveSummarizationConfig`
# (packages/api/src/agents/run.ts:652-666) tests `config?.enabled !== false`, and
# with no block `config` is `undefined`, so `undefined !== false` evaluated true
# and summarization was **on by accident**. It stays on — summarizing the dropped
# tail is strictly better for recall than the alternative, which is hard
# truncation silently discarding the oldest turns (prune.ts drops them and
# re-prepends only the system message).
#
# Behaviour is unchanged by writing it down; the point is that it is now
# discoverable instead of an emergent property of a `!== false` comparison.
#
# Deliberately still defaulted, and worth revisiting together:
#   provider/model  inherited from the agent, so on the default KARL spec the
#                   summarizer runs through Azure Model Router and picks a
#                   different model per call.
#   trigger         absent, so the SDK summarizes on ANY overflow
#                   (@librechat/agents summarization/index.ts:79-82). With the
#                   context window now pinned to 256k rather than falling back to
#                   32k, overflow should be rare enough that this matters much
#                   less than it did.
#   prompt          the SDK default; not tuned for KARL's tone or for German.
summarization:
  enabled: true
# End [knauf]

# Route all file uploads (avatars, images, attachments, file_search) to
# Azure Blob Storage with SAS-signed URLs. Behavior of `azure_blob` here
# depends on the Knauf overlay (KK20-167) that adds short-lived signed
# URLs + refresh-on-expiry on top of upstream's Azure file strategy.
# Required env: AZURE_STORAGE_CONNECTION_STRING (or AZURE_STORAGE_ACCOUNT_NAME
# for Managed Identity), AZURE_CONTAINER_NAME, AZURE_STORAGE_PUBLIC_ACCESS=false.
fileStrategy: "azure_blob"

# Only expose tools we have server-side API keys for.
# All others (Gemini, DALL-E 3, Stable Diffusion, Flux, etc.) are hidden.
# KK20-194 — open-ended browsing uses Azure-hosted web_search through Responses.
# open_url stays hidden from pickers and is exposed server-side only when a
# browse-enabled current user message contains an HTTP(S) link.
includedTools:
  - "image_gen_oai"
  - "calculator"

memory:
  disabled: false
  personalize: true
  tokenLimit: 2000
  messageWindowSize: 5
  storage:
    type: 'mongodb'
  agent:
    enabled: true
    provider: "azureOpenAI"
    model: "model-router-chat"

