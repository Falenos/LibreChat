      15 GDPR to request information about your personal data processed by us. In particular, you can request information about the processing purposes, the category of personal data, the categories of recipients to whom your data has been or will be disclosed, the planned storage period, the existence of a right to rectification, erasure, restriction of processing or objection, the existence of a right of appeal; in connection with the operation of the Survey website, we do not collect any personal data about the user from third parties and do not carry out any data processing in the sense of automated decision-making or profiling;


      · in accordance with Art.
      16 GDPR to immediately demand the correction of incorrect or completion of yourpersonal data stored by us;


      · pursuant to Art. 17
      GDPR to request the erasure of your personal data stored by us, unless theprocessing is necessary for the exercise of the right to freedom of expression and information, for compliance with a legal obligation, for reasons of public interest or for the establishment, exercise or defense of legal claims;


