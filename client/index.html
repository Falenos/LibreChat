<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="theme-color" content="#171717" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- [knauf] KK20-159 / KK20-175 / NO-TICKET — replace upstream brand on the static
         head. Static title/description carry the Agentic Karl / Knauf identity
         for the initial paint, SEO, browser tabs, and social-card previews.
         Open Graph/Twitter image metadata uses the existing Knauf logo asset
         so shared links do not fall back to a generic link avatar. Favicon +
         apple-touch-icon paths are unchanged from upstream; the PNG binaries
         at these paths are replaced wholesale (see SEAMS Configuration row
         for the binary overrides). -->
    <meta name="description" content="Discover Agentic Karl, Knauf's AI platform for faster access to information, improved productivity and simpler everyday work." />
    <meta property="og:title" content="Agentic Karl | Knauf AI Platform" />
    <meta property="og:description" content="Discover Agentic Karl, Knauf's AI platform for faster access to information, improved productivity and simpler everyday work." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://agentic-karl.knauf.com/assets/knauf-logo.png" />
    <meta property="og:image:alt" content="Knauf logo" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Agentic Karl | Knauf AI Platform" />
    <meta name="twitter:description" content="Discover Agentic Karl, Knauf's AI platform for faster access to information, improved productivity and simpler everyday work." />
    <meta name="twitter:image" content="https://agentic-karl.knauf.com/assets/knauf-logo.png" />
    <meta name="twitter:image:alt" content="Knauf logo" />
    <title>Agentic Karl | Knauf AI Platform</title>
    <!-- End [knauf] -->
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
    </style>
    <script>
      const theme = localStorage.getItem('color-theme');
      const loadingContainerStyle = document.createElement('style');
      let backgroundColor;

      if (theme === 'dark') {
        backgroundColor = '#0d0d0d';
      } else if (theme === 'light') {
        backgroundColor = '#ffffff';
      } else if (theme === 'system') {
        const prefersDarkScheme = window.matchMedia('(prefers-color-scheme: dark)').matches;
        backgroundColor = prefersDarkScheme ? '#0d0d0d' : '#ffffff';
      } else {
        backgroundColor = '#ffffff';
      }

      loadingContainerStyle.innerHTML = `
        #loading-container {
          display: flex;
          align-items: center;
          justify-content: center;
          height: 100vh;
          background-color: ${backgroundColor};
        }
      `;
      document.head.appendChild(loadingContainerStyle);
    </script>
    <script defer type="module" src="/src/main.jsx"></script>
  </head>
  <body>
    <div id="root">
      <div id="loading-container"></div>
    </div>
  </body>
</html>
